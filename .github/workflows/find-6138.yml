name: Check 6.1.138 Remote

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - name: Check Xiaomi remote
        run: |
          set -e

          URL="https://github.com/tuanhackmap1-bot/Xiaomi_Kernel_OpenSource.git"

          echo "========================================"
          echo "REMOTE BRANCHES"
          echo "========================================"

          git ls-remote --heads "$URL"

          echo ""
          echo "========================================"
          echo "REMOTE TAGS"
          echo "========================================"

          git ls-remote --tags "$URL" | grep -E '6\.1\.138|uke' || true

          echo ""
          echo "========================================"
          echo "CHECK SPECIFIC VERSION"
          echo "========================================"

          git ls-remote "$URL" | grep -E \
            '6\.1\.138|android14.*138|uke.*138|138.*uke' \
            || true

          echo ""
          echo "========================================"
          echo "DONE"
          echo "========================================
