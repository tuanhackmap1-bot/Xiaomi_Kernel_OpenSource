name: Step 6 - Find Google GKI 6.1.138

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-24.04

    steps:
      - name: Check Google GKI 6.1.138
        run: |
          set -e

          echo "========================================"
          echo "CHECK GOOGLE GKI 6.1.138"
          echo "========================================"

          echo ""
          echo "Checking remote tag..."

          git ls-remote \
            --refs \
            https://android.googlesource.com/kernel/common \
            refs/tags/android14-6.1.138_r00

          echo ""
          echo "========================================"
          echo "CLONE GKI 6.1.138"
          echo "========================================"

          git clone \
            --depth=1 \
            --branch android14-6.1.138_r00 \
            https://android.googlesource.com/kernel/common \
            gki-6.1.138

          cd gki-6.1.138

          echo ""
          echo "Commit:"
          git rev-parse HEAD

          echo ""
          echo "Kernel version:"
          make -s kernelversion

          echo ""
          echo "Makefile:"
          grep -E '^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION' Makefile

          VERSION="$(make -s kernelversion)"

          if [ "$VERSION" != "6.1.138" ]; then
            echo ""
            echo "ERROR: WRONG KERNEL VERSION"
            echo "Detected: $VERSION"
            echo "Required: 6.1.138"
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "SUCCESS"
          echo "GOOGLE GKI 6.1.138 FOUND"
          echo "========================================"
