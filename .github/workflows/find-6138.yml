name: Find Kernel Version History

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Find version history
        run: |
          set -e

          echo "========================================"
          echo "KERNEL VERSION HISTORY"
          echo "========================================"

          echo "Current:"
          make -s kernelversion

          echo ""
          echo "Commits changing Makefile:"
          git log --all --oneline -- Makefile | head -100

          echo ""
          echo "Search 6.1.138 in Makefile history:"
          git log --all -S'138' --oneline -- Makefile | head -100

          echo ""
          echo "Search 6.1.68 in Makefile history:"
          git log --all -S'68' --oneline -- Makefile | head -100

          echo ""
          echo "Search Android 6.1.138:"
          git log --all \
            --oneline \
            --grep='6.1.138' \
            --grep='138' \
            | head -100

          echo ""
          echo "Branches:"
          git branch -a

          echo ""
          echo "Tags:"
          git tag --list | tail -100
