name: Pad 7 - KernelSU Next - Stock Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT OFFICIAL XIAOMI UKE
      # ============================================================
      - name: Checkout official Xiaomi UKE
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: 5712080a4b0c0b1a879e6d145c601c649ddaddfd
          fetch-depth: 1
          submodules: false

      # ============================================================
      # 2. INSTALL BUILD TOOLS
      # ============================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            flex \
            git \
            lld \
            llvm \
            libelf-dev \
            libssl-dev \
            pahole \
            pkg-config \
            python3 \
            rsync \
            cpio \
            unzip \
            wget \
            xz-utils \
            zstd

      # ============================================================
      # 3. VERIFY SOURCE
      # ============================================================
      - name: Verify Xiaomi source
        run: |
          set -eux

          echo "========================================"
          echo "XIAOMI SOURCE"
          echo "========================================"

          echo "Commit:"
          git rev-parse HEAD

          echo ""
          echo "Branch:"
          git branch --show-current || true

          echo ""
          echo "Kernel version:"
          make -s kernelversion

          echo ""
          echo "Makefile:"
          grep -E \
            '^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION' \
            Makefile

      # ============================================================
      # 4. STOP IF SOURCE IS NOT 6.1.138
      # ============================================================
      - name: Verify required kernel version
        run: |
          set -eux

          VERSION="$(make -s kernelversion)"

          echo "Detected: $VERSION"
          echo "Required: 6.1.138"

          if [ "$VERSION" != "6.1.138" ]; then
            echo ""
            echo "========================================"
            echo "WRONG KERNEL SOURCE"
            echo "========================================"
            echo ""
            echo "This checkout is:"
            echo "$VERSION"
            echo ""
            echo "The required stock kernel is:"
            echo "6.1.138"
            echo ""
            echo "BUILD STOPPED."
            exit 1
          fi

          echo "Kernel version OK."

      # ============================================================
      # 5. CHECK HWID
      # ============================================================
      - name: Check HWID source
        run: |
          set -eux

          echo "========================================"
          echo "HWID CHECK"
          echo "========================================"

          if [ ! -d drivers/misc/hwid ]; then
            echo ""
            echo "ERROR:"
            echo "drivers/misc/hwid is missing."
            echo ""
            echo "The public Xiaomi source is incomplete."
            echo "A stock-compatible kernel cannot be built"
            echo "without the required HWID source."
            echo ""
            exit 1
          fi

          if [ ! -f drivers/misc/hwid/Kconfig ]; then
            echo ""
            echo "ERROR:"
            echo "drivers/misc/hwid/Kconfig is missing."
            exit 1
          fi

          echo "HWID source OK."

      # ============================================================
      # 6. DOWNLOAD STOCK BOOT
      # ============================================================
      - name: Download stock boot.img
        run: |
          set -eux

          wget \
            --show-progress \
            -O boot.img \
            "https://github.com/tuanhackmap1-bot/Xiaomi_Kernel_OpenSource/releases/download/boot-analysis/boot.img"

          echo ""
          echo "boot.img:"
          ls -lh boot.img

          echo ""
          echo "SHA256:"
          sha256sum boot.img

      # ============================================================
      # 7. EXTRACT STOCK KERNEL
      # ============================================================
      - name: Extract stock kernel
        run: |
          set -eux

          rm -rf stock
          mkdir -p stock

          dd \
            if=boot.img \
            of=stock/kernel \
            bs=4096 \
            skip=1 \
            count=8645 \
            status=progress

          echo ""
          echo "Stock kernel:"
          ls -lh stock/kernel

          echo ""
          file stock/kernel

      # ============================================================
      # 8. EXTRACT STOCK CONFIG
      # ============================================================
      - name: Extract stock config
        run: |
          set -eux

          wget \
            -O extract-ikconfig \
            "https://raw.githubusercontent.com/torvalds/linux/master/scripts/extract-ikconfig"

          chmod +x extract-ikconfig

          ./extract-ikconfig \
            stock/kernel \
            > stock.config \
            2>extract-ikconfig-error.txt \
            || true

          if [ ! -s stock.config ]; then
            echo ""
            echo "ERROR: stock.config extraction failed."
            cat extract-ikconfig-error.txt || true
            exit 1
          fi

          echo ""
          echo "Stock config:"
          wc -l stock.config

      # ============================================================
      # 9. CHECK STOCK CONFIG
      # ============================================================
      - name: Inspect stock config
        run: |
          set -eux

          echo "========================================"
          echo "STOCK CONFIG"
          echo "========================================"

          grep '^CONFIG_ARM64=' stock.config || true
          grep '^CONFIG_MODULES=' stock.config || true
          grep '^CONFIG_KALLSYMS=' stock.config || true
          grep '^CONFIG_KALLSYMS_ALL=' stock.config || true
          grep '^CONFIG_COMPAT=' stock.config || true

      # ============================================================
      # 10. CLEAN
      # ============================================================
      - name: Clean kernel tree
        run: |
          set -eux

          make mrproper

      # ============================================================
      # 11. PREPARE OUT
      # ============================================================
      - name: Prepare output
        run: |
          set -eux

          rm -rf out
          mkdir -p out

          cp stock.config out/.config

      # ============================================================
      # 12. SETUP KERNELSU-NEXT
      # ============================================================
      - name: Setup KernelSU-Next
        run: |
          set -eux

          echo "========================================"
          echo "KERNELSU-NEXT"
          echo "========================================"

          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash

          echo ""
          echo "Checking KernelSU..."

          test -d drivers/kernelsu
          test -f drivers/kernelsu/Kconfig

          echo "KernelSU-Next installed."

      # ============================================================
      # 13. ENABLE KSU WITHOUT INTERACTIVE CONFIG
      # ============================================================
      - name: Enable KernelSU
        run: |
          set -eux

          echo "========================================"
          echo "ENABLE KERNELSU"
          echo "========================================"

          if [ -x scripts/config ]; then
            scripts/config \
              --file out/.config \
              --enable CONFIG_KSU
          else
            echo "scripts/config not available yet."
            echo "KernelSU will use its Kconfig default."
          fi

      # ============================================================
      # 14. OLDDEFCONFIG
      # ============================================================
      - name: Generate kernel config
        run: |
          set -eux

          echo "========================================"
          echo "GENERATE CONFIG"
          echo "========================================"

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo ""
          echo "Config generated."

      # ============================================================
      # 15. VERIFY KSU
      # ============================================================
      - name: Verify KernelSU
        run: |
          set -eux

          echo "========================================"
          echo "VERIFY KERNELSU"
          echo "========================================"

          grep '^CONFIG_KSU=' out/.config

          echo ""
          echo "KernelSU options:"
          grep '^CONFIG_KSU' out/.config || true

      # ============================================================
      # 16. COMPILER
      # ============================================================
      - name: Show compiler
        run: |
          set -eux

          echo "========================================"
          echo "COMPILER"
          echo "========================================"

          clang --version
          echo ""
          ld.lld --version

      # ============================================================
      # 17. BUILD
      # ============================================================
      - name: Build kernel Image
        run: |
          set -eux

          echo "========================================"
          echo "BUILD KERNEL"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image

      # ============================================================
      # 18. VERIFY IMAGE
      # ============================================================
      - name: Verify build
        run: |
          set -eux

          IMAGE="out/arch/arm64/boot/Image"

          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"

          test -f "$IMAGE"

          echo ""
          echo "Image:"
          ls -lh "$IMAGE"

          echo ""
          echo "SHA256:"
          sha256sum "$IMAGE"

          echo ""
          echo "File:"
          file "$IMAGE"

      # ============================================================
      # 19. REPORT
      # ============================================================
      - name: Create report
        run: |
          set -eux

          mkdir -p report

          {
            echo "========================================"
            echo "PAD 7 KERNELSU-NEXT BUILD"
            echo "========================================"
            echo ""
            echo "SOURCE COMMIT:"
            git rev-parse HEAD
            echo ""
            echo "KERNEL VERSION:"
            make -s kernelversion
            echo ""
            echo "KERNELSU:"
            grep '^CONFIG_KSU=' out/.config
            echo ""
            echo "STOCK CONFIG:"
            sha256sum stock.config
            echo ""
            echo "FINAL CONFIG:"
            sha256sum out/.config
            echo ""
            echo "IMAGE:"
            ls -lh out/arch/arm64/boot/Image
            echo ""
            echo "IMAGE SHA256:"
            sha256sum out/arch/arm64/boot/Image
            echo ""
            echo "========================================"
            echo "BUILD SUCCESS"
            echo "========================================"
          } | tee report/FINAL-REPORT.txt

      # ============================================================
      # 20. ARTIFACT
      # ============================================================
      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: pad7-kernelsu-next
          path: |
            out/arch/arm64/boot/Image
            out/.config
            stock.config
            report/FINAL-REPORT.txt
