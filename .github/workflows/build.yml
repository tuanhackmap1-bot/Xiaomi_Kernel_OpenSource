name: Step 6 - Find Xiaomi Kernel 6.1.138

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout official Xiaomi repository
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: uke-v-oss
          fetch-depth: 0

      - name: Check current kernel
        run: |
          set -e

          echo "========================================"
          echo "CURRENT XIAOMI UKE SOURCE"
          echo "========================================"

          echo ""
          echo "Commit:"
          git rev-parse HEAD

          echo ""
          echo "Branch:"
          git branch --show-current || true

          echo ""
          echo "Kernel version:"
          make -s kernelversion

          echo ""
          echo "Makefile:"
          grep -E \
            '^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION' \
            Makefile

      - name: Search remote 6.1.138
        run: |
          set -e

          echo "========================================"
          echo "SEARCH REMOTE 6.1.138"
          echo "========================================"

          echo ""
          echo "REMOTE BRANCHES:"
          git ls-remote --heads origin

          echo ""
          echo "REMOTE TAGS:"
          git ls-remote --tags origin

          echo ""
          echo "FILTER 6.1.138:"
          git ls-remote origin | grep '6.1.138' || true

          echo ""
          echo "========================================"
          echo "SEARCH COMPLETE"
          echo "========================================"
