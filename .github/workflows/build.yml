name: GKI 6.1.138 - KernelSU Next - SUSFS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. ANDROID COMMON 6.1.138
      # ============================================================
      - name: Checkout Android Common 6.1.138
        uses: actions/checkout@v4
        with:
          repository: android/kernel_common
          ref: android14-6.1-2025-06
          fetch-depth: 1

      # ============================================================
      # 2. DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            cpio \
            curl \
            flex \
            git \
            lld \
            llvm \
            libelf-dev \
            libssl-dev \
            pahole \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd

      # ============================================================
      # 3. VERIFY KERNEL
      # ============================================================
      - name: Verify kernel version
        run: |
          set -eux

          echo "========================================"
          echo "KERNEL VERSION"
          echo "========================================"

          VERSION="$(make -s kernelversion)"

          echo "Detected:"
          echo "$VERSION"

          if [ "$VERSION" != "6.1.138" ]; then
            echo ""
            echo "ERROR: Expected 6.1.138"
            echo "Detected: $VERSION"
            exit 1
          fi

          echo ""
          echo "6.1.138 OK."

      # ============================================================
      # 4. KERNELSU NEXT
      # ============================================================
      - name: Install KernelSU Next
        run: |
          set -eux

          echo "========================================"
          echo "KERNELSU NEXT"
          echo "========================================"

          curl -LSs \
            "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s next

          test -d drivers/kernelsu

          echo ""
          echo "KernelSU Next installed."

      # ============================================================
      # 5. CLONE SUSFS - VERIFIED REPOSITORY
      # ============================================================
      - name: Download SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "DOWNLOAD SUSFS"
          echo "========================================"

          rm -rf susfs

          git clone \
            --depth=1 \
            --branch gki-android14-6.1 \
            https://github.com/deepongi-labs/susfs4ksu.git \
            susfs

          cd susfs

          echo ""
          echo "SUSFS commit:"
          git rev-parse HEAD

          echo ""
          echo "SUSFS files:"
          find kernel_patches -maxdepth 3 -type f | sort

      # ============================================================
      # 6. FIND CORRECT 6.1 SUSFS PATCH
      # ============================================================
      - name: Find SUSFS 6.1 patch
        run: |
          set -eux

          echo "========================================"
          echo "FIND SUSFS PATCH"
          echo "========================================"

          echo ""
          echo "Available kernel patches:"
          find susfs/kernel_patches \
            -maxdepth 2 \
            -type f \
            -name '*.patch' \
            | sort

          echo ""
          echo "Looking for Android 14 / 6.1 patch..."

          PATCH="$(find susfs/kernel_patches \
            -maxdepth 1 \
            -type f \
            -name '50_add_susfs_in_kernel-*.patch' \
            | head -1)"

          if [ -z "$PATCH" ]; then
            echo ""
            echo "ERROR: No 50_add_susfs_in_kernel patch found."
            exit 1
          fi

          echo ""
          echo "Selected patch:"
          echo "$PATCH"

          cp "$PATCH" susfs-kernel.patch

          test -s susfs-kernel.patch

          echo ""
          echo "Patch saved as:"
          ls -lh susfs-kernel.patch

      # ============================================================
      # 7. APPLY SUSFS FILES
      # ============================================================
      - name: Apply SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "APPLY SUSFS"
          echo "========================================"

          KERNEL="$GITHUB_WORKSPACE"
          SUSFS="$GITHUB_WORKSPACE/susfs"

          echo "Kernel:"
          echo "$KERNEL"

          echo ""
          echo "SUSFS:"
          echo "$SUSFS"

          # --------------------------------------------------------
          # Check SUSFS files
          # --------------------------------------------------------

          test -f \
            "$SUSFS/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          test -d \
            "$SUSFS/kernel_patches/fs"

          test -d \
            "$SUSFS/kernel_patches/include/linux"

          echo ""
          echo "Required SUSFS directories found."

          # --------------------------------------------------------
          # Copy SUSFS kernel files
          # --------------------------------------------------------

          cp \
            "$SUSFS/kernel_patches/fs/"* \
            "$KERNEL/fs/"

          cp \
            "$SUSFS/kernel_patches/include/linux/"* \
            "$KERNEL/include/linux/"

          echo ""
          echo "SUSFS kernel files copied."

          # --------------------------------------------------------
          # KernelSU patch
          # --------------------------------------------------------

          cp \
            "$SUSFS/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" \
            "$KERNEL/drivers/kernelsu/"

          cd "$KERNEL/drivers/kernelsu"

          patch \
            --forward \
            -p1 \
            < 10_enable_susfs_for_ksu.patch

          # --------------------------------------------------------
          # Kernel patch
          # --------------------------------------------------------

          cd "$KERNEL"

          patch \
            --forward \
            -p1 \
            < susfs-kernel.patch

          echo ""
          echo "========================================"
          echo "SUSFS PATCH APPLIED"
          echo "========================================"

      # ============================================================
      # 8. VERIFY SUSFS
      # ============================================================
      - name: Verify SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "VERIFY SUSFS"
          echo "========================================"

          echo ""
          echo "SUSFS files in kernel:"

          find fs include drivers \
            -type f \
            \( \
              -name 'susfs.c' \
              -o \
              -name 'susfs.h' \
              -o \
              -name '*susfs*' \
            \) \
            | sort \
            | head -200

          echo ""
          echo "CONFIG_KSU_SUSFS references:"

          grep -R \
            -n \
            "CONFIG_KSU_SUSFS" \
            drivers/kernelsu \
            fs \
            include \
            2>/dev/null \
            | head -100 \
            || true

          echo ""
          echo "SUSFS verification finished."

      # ============================================================
      # 9. REMOVE GKI PROTECTED EXPORT FILES
      # ============================================================
      - name: Fix GKI protected exports
        run: |
          set -eux

          echo "========================================"
          echo "GKI PROTECTED EXPORTS"
          echo "========================================"

          rm -f \
            android/abi_gki_protected_exports_aarch64 \
            android/abi_gki_protected_exports_x86_64

          echo "Protected export files removed if present."

      # ============================================================
      # 10. GKI CONFIG
      # ============================================================
      - name: Generate GKI config
        run: |
          set -eux

          echo "========================================"
          echo "GKI CONFIG"
          echo "========================================"

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            gki_defconfig

      # ============================================================
      # 11. ENABLE KSU + SUSFS
      # ============================================================
      - name: Enable KernelSU and SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "ENABLE KSU + SUSFS"
          echo "========================================"

          chmod +x scripts/config || true

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_SUSFS

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo ""
          echo "KernelSU:"
          grep '^CONFIG_KSU=' out/.config

          echo ""
          echo "SUSFS:"
          grep '^CONFIG_KSU_SUSFS=' out/.config

      # ============================================================
      # 12. SHOW SUSFS OPTIONS
      # ============================================================
      - name: Show SUSFS configuration
        run: |
          set -eux

          echo "========================================"
          echo "SUSFS CONFIGURATION"
          echo "========================================"

          grep '^CONFIG_KSU_SUSFS' \
            out/.config \
            || true

      # ============================================================
      # 13. COMPILER
      # ============================================================
      - name: Check compiler
        run: |
          set -eux

          echo "========================================"
          echo "COMPILER"
          echo "========================================"

          clang --version
          echo ""
          ld.lld --version

      # ============================================================
      # 14. BUILD
      # ============================================================
      - name: Build kernel
        run: |
          set -eux

          echo "========================================"
          echo "BUILD 6.1.138"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image

      # ============================================================
      # 15. VERIFY IMAGE
      # ============================================================
      - name: Verify Image
        run: |
          set -eux

          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"

          IMAGE="out/arch/arm64/boot/Image"

          test -f "$IMAGE"

          echo ""
          echo "Image:"
          ls -lh "$IMAGE"

          echo ""
          echo "SHA256:"
          sha256sum "$IMAGE"

          echo ""
          echo "File:"
          file "$IMAGE"

      # ============================================================
      # 16. REPORT
      # ============================================================
      - name: Create report
        run: |
          set -eux

          mkdir -p report

          {
            echo "========================================"
            echo "GKI 6.1.138"
            echo "KERNELSU NEXT"
            echo "SUSFS"
            echo "========================================"
            echo ""
            echo "KERNEL:"
            make -s kernelversion
            echo ""
            echo "SOURCE COMMIT:"
            git rev-parse HEAD
            echo ""
            echo "KSU:"
            grep '^CONFIG_KSU=' out/.config || true
            echo ""
            echo "SUSFS:"
            grep '^CONFIG_KSU_SUSFS=' out/.config || true
            echo ""
            echo "IMAGE:"
            ls -lh out/arch/arm64/boot/Image
            echo ""
            echo "SHA256:"
            sha256sum out/arch/arm64/boot/Image
          } | tee report/FINAL-REPORT.txt

      # ============================================================
      # 17. ARTIFACT
      # ============================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pad7-6.1.138-kernelsu-next-susfs
          path: |
            out/arch/arm64/boot/Image
            out/.config
            report/FINAL-REPORT.txt
