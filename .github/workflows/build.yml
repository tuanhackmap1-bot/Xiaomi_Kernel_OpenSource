name: Step 6 - Build Stock Kernel 6.1.138

on:
  workflow_dispatch:
  push:
    branches:
      - uke-v-oss

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout official Xiaomi UKE
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: 5712080a4b0c0b1a879e6d145c601c649ddaddfd
          fetch-depth: 1
          
      - name: Inspect HWID reference
        run: |
          set -e

          echo "COMMIT:"
          git rev-parse HEAD

          echo ""
          echo "Kconfig line 525-540:"
          nl -ba drivers/misc/Kconfig | sed -n '525,540p'

          echo ""
          echo "Search HWID:"
          grep -Rni "hwid" drivers/misc/Kconfig drivers/misc/Makefile || true

          echo ""
          echo "Check HWID directory:"
          if [ -d drivers/misc/hwid ]; then
            echo "drivers/misc/hwid EXISTS"
            find drivers/misc/hwid -maxdepth 2 -type f -print
          else
            echo "drivers/misc/hwid DOES NOT EXIST"
          fi
      - name: Show source information
        run: |
          set -e

          echo "========================================"
          echo "XIAOMI KERNEL SOURCE"
          echo "========================================"

          echo "Branch:"
          git branch --show-current || true

          echo ""
          echo "Commit:"
          git rev-parse HEAD

          echo ""
          echo "Kernel Makefile version:"
          grep -E '^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION' Makefile

          echo ""
          echo "make kernelversion:"
          make -s kernelversion

      - name: Verify Xiaomi source
        run: |
          set -e

          VERSION="$(make -s kernelversion)"

          echo "Xiaomi source version: $VERSION"

          if [ "$VERSION" != "6.1.68" ]; then
            echo "Unexpected Xiaomi source version."
            exit 1
          fi

          echo "Xiaomi UKE source confirmed."

      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            build-essential \
            clang \
            lld \
            llvm \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            python3 \
            cpio \
            rsync \
            wget \
            unzip \
            xz-utils \
            zstd

      - name: Download stock boot.img
        run: |
          set -e

          wget -q --show-progress \
            -O boot.img \
            "https://github.com/tuanhackmap1-bot/Xiaomi_Kernel_OpenSource/releases/download/boot-analysis/boot.img"

          echo "boot.img:"
          stat -c%s boot.img

          echo ""
          echo "SHA256:"
          sha256sum boot.img

      - name: Extract stock kernel
        run: |
          set -e

          mkdir -p stock

          dd \
            if=boot.img \
            of=stock/kernel \
            bs=4096 \
            skip=1 \
            count=8645 \
            status=progress

          echo ""
          echo "Stock kernel size:"
          stat -c%s stock/kernel

          echo ""
          echo "Stock kernel:"
          file stock/kernel

      - name: Extract stock config
        run: |
          set -e

          wget -q \
            -O extract-ikconfig \
            "https://raw.githubusercontent.com/torvalds/linux/master/scripts/extract-ikconfig"

          chmod +x extract-ikconfig

          ./extract-ikconfig \
            stock/kernel \
            > stock.config \
            2> stock-config-error.txt \
            || true

          echo "Stock config size:"
          stat -c%s stock.config

          echo ""
          echo "Stock config lines:"
          wc -l stock.config

          if [ ! -s stock.config ]; then
            echo ""
            echo "ERROR: Could not extract stock.config"
            cat stock-config-error.txt || true
            exit 1
          fi

          echo ""
          echo "Stock config successfully extracted."

      - name: Save stock config
        run: |
          set -e

          mkdir -p arch/arm64/configs

          cp stock.config \
            arch/arm64/configs/stock_pad7_defconfig

          echo "Stock config installed:"
          wc -l arch/arm64/configs/stock_pad7_defconfig

      - name: Prepare compiler
        run: |
          set -e

          echo "========================================"
          echo "COMPILER"
          echo "========================================"

          clang --version
          ld.lld --version

      - name: Check missing HWID source
        run: |
          set -e

          echo "========================================"
          echo "CHECK HWID SOURCE"
          echo "========================================"

          echo "Git submodules:"
          git submodule status || true

          echo ""
          echo "Git LFS:"
          git lfs ls-files 2>/dev/null | grep -i hwid || true

          echo ""
          echo "HWID references:"
          git grep -n -i "drivers/misc/hwid" || true

          echo ""
          echo "HWID directory:"
          if [ -d drivers/misc/hwid ]; then
            find drivers/misc/hwid -maxdepth 2 -type f -print
          else
            echo "MISSING: drivers/misc/hwid"
          fi
      - name: Handle missing HWID source
        run: |
          set -e

          echo "========================================"
          echo "HANDLE MISSING HWID"
          echo "========================================"

          if [ ! -d "drivers/misc/hwid" ]; then
            echo "HWID source is missing."

            cp drivers/misc/Kconfig \
              drivers/misc/Kconfig.before-hwid

            sed -i '/source "drivers\/misc\/hwid\/Kconfig"/d' \
              drivers/misc/Kconfig

            echo "Removed missing HWID Kconfig reference."
          else
            echo "HWID source exists."
          fi

          echo ""
          echo "Checking Kconfig reference:"

          if grep -n 'drivers/misc/hwid/Kconfig' drivers/misc/Kconfig; then
            echo "ERROR: HWID Kconfig reference still exists."
            exit 1
          fi

          echo "HWID Kconfig check passed."
         
      - name: Load stock Pad 7 config
        run: |
          set -e

          mkdir -p out

          cp stock.config \
            out/.config

          echo "Running olddefconfig..."

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo ""
          echo "Final config:"
          grep -E \
            '^CONFIG_(IKCONFIG|KALLSYMS|KALLSYMS_ALL|MODULES|BPF|BPF_SYSCALL|SECURITY|SECURITYFS|SECURITY_SELINUX)' \
            out/.config \
            || true
      - name: Disable KMI whitelist requirement
        run: |
          set -e

          echo "Checking ABI/KMI settings..."

          if grep -q '^CONFIG_UNUSED_KSYMS_WHITELIST=' out/.config; then
            echo "Removing CONFIG_UNUSED_KSYMS_WHITELIST"
            sed -i '/^CONFIG_UNUSED_KSYMS_WHITELIST=/d' out/.config
          fi

          if grep -q '^CONFIG_TRIM_UNUSED_KSYMS=y' out/.config; then
            echo "Disabling CONFIG_TRIM_UNUSED_KSYMS"
            sed -i \
              's/^CONFIG_TRIM_UNUSED_KSYMS=y/# CONFIG_TRIM_UNUSED_KSYMS is not set/' \
              out/.config
          fi

          echo ""
          echo "Final ABI/KMI settings:"
          grep -E \
            '^CONFIG_(UNUSED_KSYMS_WHITELIST|TRIM_UNUSED_KSYMS)' \
            out/.config \
            || true
      - name: Verify final kernel config
        run: |
          set -e

          echo "========================================"
          echo "FINAL CONFIG CHECK"
          echo "========================================"

          echo "CONFIG_ARM64:"
          grep '^CONFIG_ARM64=' out/.config || true

          echo ""
          echo "CONFIG_MODULES:"
          grep '^CONFIG_MODULES=' out/.config || true

          echo ""
          echo "CONFIG_KALLSYMS:"
          grep '^CONFIG_KALLSYMS=' out/.config || true

          echo ""
          echo "CONFIG_KALLSYMS_ALL:"
          grep '^CONFIG_KALLSYMS_ALL=' out/.config || true

      - name: Diagnose ABI KMI whitelist
        run: |
          set -e

          echo "========================================"
          echo "ABI / KMI DIAGNOSTIC"
          echo "========================================"

          echo ""
          echo "ABI whitelist files:"
          find . \
            -maxdepth 3 \
            -type f \
            \( -name 'abi_symbollist*' -o -name '*symbollist*' \) \
            -print \
            2>/dev/null || true

          echo ""
          echo "KMI / ABI config:"
          grep -E \
            'CONFIG_(TRIM_UNUSED_KSYMS|UNUSED_KSYMS_WHITELIST|MODULES)' \
            out/.config \
            || true

          echo ""
          echo "Makefile ABI references:"
          grep -Rni \
            -E 'abi_symbollist|UNUSED_KSYMS_WHITELIST|TRIM_UNUSED_KSYMS' \
            Makefile scripts kernel \
            2>/dev/null \
            | head -100 \
            || true

          echo ""
          echo "========================================"
          echo "ABI DIAGNOSTIC COMPLETE"
          echo "========================================"

      

     
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pad7-step6-kernel-build
          path: |
            out/arch/arm64/boot/Image
            out/.config
            stock.config
            report/FINAL-REPORT.txt
