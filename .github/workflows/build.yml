name: GKI 6.1.138 - KernelSU Next - SUSFS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. ANDROID COMMON 6.1.138
      # ============================================================
      - name: Checkout Android Common
        uses: actions/checkout@v4
        with:
          repository: android/kernel_common
          ref: android14-6.1-2025-06
          fetch-depth: 1

      # ============================================================
      # 2. TOOLS
      # ============================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            cpio \
            curl \
            flex \
            git \
            lld \
            llvm \
            libelf-dev \
            libssl-dev \
            pahole \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd

      # ============================================================
      # 3. VERIFY KERNEL
      # ============================================================
      - name: Verify kernel 6.1.138
        run: |
          set -eux

          VERSION="$(make -s kernelversion)"

          echo "========================================"
          echo "KERNEL VERSION"
          echo "========================================"

          echo "Detected: $VERSION"

          if [ "$VERSION" != "6.1.138" ]; then
            echo ""
            echo "ERROR: WRONG KERNEL VERSION"
            echo "Expected: 6.1.138"
            echo "Detected: $VERSION"
            exit 1
          fi

          echo ""
          echo "6.1.138 OK."

      # ============================================================
      # 4. KERNELSU NEXT
      # ============================================================
      - name: Setup KernelSU Next
        run: |
          set -eux

          echo "========================================"
          echo "KERNELSU NEXT"
          echo "========================================"

          curl -LSs \
            "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" \
            | bash -

          test -d drivers/kernelsu

          echo ""
          echo "KernelSU installed."

      # ============================================================
      # 5. CLONE SUSFS - VERIFIED REPOSITORY
      # ============================================================
      - name: Clone SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "CLONE SUSFS"
          echo "========================================"

          rm -rf susfs

          git clone \
            --depth=1 \
            --branch gki-android14-6.1 \
            https://github.com/deepongi-labs/susfs4ksu.git \
            susfs

          echo ""
          echo "SUSFS commit:"
          git -C susfs rev-parse HEAD

          echo ""
          echo "SUSFS patch files:"
          find susfs/kernel_patches \
            -maxdepth 2 \
            -type f \
            | sort

      # ============================================================
      # 6. FIND CORRECT 6.1 PATCH
      # ============================================================
      - name: Find SUSFS 6.1 patch
        run: |
          set -eux

          echo "========================================"
          echo "FIND SUSFS 6.1 PATCH"
          echo "========================================"

          PATCH="$(find susfs/kernel_patches \
            -maxdepth 1 \
            -type f \
            -name '50_add_susfs_in_kernel-6.1*.patch' \
            | sort \
            | head -1)"

          if [ -z "$PATCH" ]; then
            echo ""
            echo "ERROR: NO SUSFS 6.1 PATCH FOUND."
            echo ""
            echo "Available kernel patches:"
            find susfs/kernel_patches \
              -maxdepth 1 \
              -type f \
              -name '50_add_susfs_in_kernel*.patch' \
              | sort

            exit 1
          fi

          echo "Found:"
          echo "$PATCH"

          echo "SUSFS_KERNEL_PATCH=$PATCH" >> "$GITHUB_ENV"

      # ============================================================
      # 7. COPY SUSFS FILES
      # ============================================================
      - name: Copy SUSFS kernel files
        run: |
          set -eux

          echo "========================================"
          echo "COPY SUSFS FILES"
          echo "========================================"

          test -f "$SUSFS_KERNEL_PATCH"

          cp "$SUSFS_KERNEL_PATCH" .

          cp \
            susfs/kernel_patches/fs/* \
            fs/

          cp \
            susfs/kernel_patches/include/linux/* \
            include/linux/

          echo ""
          echo "SUSFS files copied."

      # ============================================================
      # 8. PATCH KERNELSU
      # ============================================================
      - name: Patch KernelSU for SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "PATCH KERNELSU"
          echo "========================================"

          KSU_PATCH="$(find susfs/kernel_patches/KernelSU \
            -maxdepth 1 \
            -type f \
            -name '10_enable_susfs_for_ksu.patch' \
            | head -1)"

          if [ -z "$KSU_PATCH" ]; then
            echo "ERROR: KernelSU SUSFS patch missing."
            exit 1
          fi

          cp "$KSU_PATCH" drivers/kernelsu/

          cd drivers/kernelsu

          patch \
            -p1 \
            --batch \
            < 10_enable_susfs_for_ksu.patch

          cd ../..

          echo "KernelSU SUSFS patch applied."

      # ============================================================
      # 9. APPLY SUSFS KERNEL PATCH
      # ============================================================
      - name: Apply SUSFS kernel patch
        run: |
          set -eux

          echo "========================================"
          echo "APPLY SUSFS"
          echo "========================================"

          echo "Patch:"
          echo "$SUSFS_KERNEL_PATCH"

          PATCH_FILE="$(basename "$SUSFS_KERNEL_PATCH")"

          test -f "$PATCH_FILE"

          echo ""
          echo "Applying:"
          echo "$PATCH_FILE"

          patch \
            -p1 \
            --batch \
            < "$PATCH_FILE"

          echo ""
          echo "SUSFS kernel patch applied."

      # ============================================================
      # 10. VERIFY SUSFS
      # ============================================================
      - name: Verify SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "VERIFY SUSFS"
          echo "========================================"

          test -f fs/susfs.c
          test -f include/linux/susfs.h

          echo ""
          echo "SUSFS source:"
          ls -lh fs/susfs.c
          ls -lh include/linux/susfs.h

          echo ""
          echo "SUSFS Kconfig:"
          grep -R \
            -n \
            "CONFIG_KSU_SUSFS" \
            drivers/kernelsu \
            fs \
            include \
            2>/dev/null \
            | head -100 \
            || true

      # ============================================================
      # 11. REMOVE GKI PROTECTED EXPORT FILES
      # ============================================================
      - name: Prepare GKI protected exports
        run: |
          set -eux

          rm -f \
            android/abi_gki_protected_exports_aarch64 \
            android/abi_gki_protected_exports_x86_64

      # ============================================================
      # 12. GKI DEFCONFIG
      # ============================================================
      - name: Create GKI config
        run: |
          set -eux

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            gki_defconfig

      # ============================================================
      # 13. ENABLE KSU + SUSFS
      # ============================================================
      - name: Enable KSU SUSFS config
        run: |
          set -eux

          echo "========================================"
          echo "ENABLE KSU + SUSFS"
          echo "========================================"

          chmod +x scripts/config || true

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_SUSFS

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo ""
          echo "KSU:"
          grep '^CONFIG_KSU=' out/.config

          echo ""
          echo "SUSFS:"
          grep '^CONFIG_KSU_SUSFS=' out/.config

      # ============================================================
      # 14. BUILD
      # ============================================================
      - name: Build kernel
        run: |
          set -eux

          echo "========================================"
          echo "BUILD 6.1.138"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image

      # ============================================================
      # 15. VERIFY
      # ============================================================
      - name: Verify build
        run: |
          set -eux

          IMAGE="out/arch/arm64/boot/Image"

          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"

          test -f "$IMAGE"

          echo ""
          ls -lh "$IMAGE"

          echo ""
          sha256sum "$IMAGE"

          echo ""
          file "$IMAGE"

      # ============================================================
      # 16. REPORT
      # ============================================================
      - name: Create report
        run: |
          set -eux

          mkdir -p report

          {
            echo "========================================"
            echo "6.1.138 KERNELSU NEXT SUSFS"
            echo "========================================"
            echo ""
            echo "SOURCE:"
            git rev-parse HEAD
            echo ""
            echo "KERNEL:"
            make -s kernelversion
            echo ""
            echo "KERNELSU:"
            grep '^CONFIG_KSU=' out/.config
            echo ""
            echo "SUSFS:"
            grep '^CONFIG_KSU_SUSFS=' out/.config
            echo ""
            echo "SUSFS COMMIT:"
            git -C susfs rev-parse HEAD
            echo ""
            echo "IMAGE:"
            ls -lh out/arch/arm64/boot/Image
            echo ""
            echo "IMAGE SHA256:"
            sha256sum out/arch/arm64/boot/Image
          } | tee report/FINAL-REPORT.txt

      # ============================================================
      # 17. ARTIFACT
      # ============================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pad7-6.1.138-kernelsu-next-susfs
          path: |
            out/arch/arm64/boot/Image
            out/.config
            report/FINAL-REPORT.txt
