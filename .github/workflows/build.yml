name: Pad 7 - GKI 6.1.138 - KernelSU Next - SUSFS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # 1. ANDROID COMMON 6.1.138
      # ==========================================================
      - name: Checkout Android Common 6.1.138
        uses: actions/checkout@v4
        with:
          repository: android/kernel_common
          ref: android14-6.1-2025-06
          fetch-depth: 1

      # ==========================================================
      # 2. DEPENDENCIES
      # ==========================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            cpio \
            curl \
            flex \
            git \
            lld \
            llvm \
            libelf-dev \
            libssl-dev \
            pahole \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd

      # ==========================================================
      # 3. VERIFY KERNEL
      # ==========================================================
      - name: Verify kernel version
        run: |
          set -eux

          echo "========================================"
          echo "KERNEL VERSION"
          echo "========================================"

          VERSION="$(make -s kernelversion)"

          echo "Detected: $VERSION"

          if [ "$VERSION" != "6.1.138" ]; then
            echo ""
            echo "ERROR: WRONG KERNEL"
            echo "Expected: 6.1.138"
            echo "Detected: $VERSION"
            exit 1
          fi

          echo ""
          echo "6.1.138 OK."

      # ==========================================================
      # 4. KERNELSU NEXT + SUSFS
      # ==========================================================
      - name: Setup KernelSU Next SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "KERNELSU NEXT"
          echo "========================================"

          curl -LSs \
            "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/next-susfs/kernel/setup.sh" \
            | bash -s next-susfs

          echo ""
          echo "KernelSU directory:"
          find KernelSU-Next -maxdepth 2 -type f | head -50

          test -d KernelSU-Next

      # ==========================================================
      # 5. GET THE CORRECT SUSFS BRANCH
      # ==========================================================
      - name: Download SUSFS gki-android14-6.1
        run: |
          set -eux

          echo "========================================"
          echo "SUSFS"
          echo "========================================"

          rm -rf susfs

          git clone \
            --depth=1 \
            --branch gki-android14-6.1 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs

          echo ""
          echo "SUSFS branch:"
          git -C susfs branch --show-current

          echo ""
          echo "SUSFS commit:"
          git -C susfs rev-parse HEAD

          echo ""
          echo "Available kernel patches:"
          find susfs/kernel_patches \
            -maxdepth 2 \
            -type f \
            | sort

      # ==========================================================
      # 6. FIND ACTUAL 6.1 PATCH
      # ==========================================================
      - name: Locate SUSFS 6.1 patch
        run: |
          set -eux

          echo "========================================"
          echo "LOCATE SUSFS PATCH"
          echo "========================================"

          PATCH="$(find susfs/kernel_patches \
            -maxdepth 1 \
            -type f \
            -name '*6.1*.patch' \
            | head -1)"

          if [ -z "$PATCH" ]; then
            echo ""
            echo "ERROR: No 6.1 SUSFS kernel patch found."
            echo ""
            find susfs/kernel_patches \
              -maxdepth 2 \
              -type f \
              | sort
            exit 1
          fi

          echo "Found:"
          echo "$PATCH"

          echo "SUSFS_KERNEL_PATCH=$PATCH" >> "$GITHUB_ENV"

      # ==========================================================
      # 7. COPY SUSFS FILES
      # ==========================================================
      - name: Copy SUSFS kernel files
        run: |
          set -eux

          echo "========================================"
          echo "COPY SUSFS FILES"
          echo "========================================"

          cp \
            susfs/kernel_patches/fs/* \
            fs/

          cp \
            susfs/kernel_patches/include/linux/* \
            include/linux/

          echo ""
          echo "SUSFS files installed."

      # ==========================================================
      # 8. APPLY SUSFS KERNEL PATCH
      # ==========================================================
      - name: Apply SUSFS kernel patch
        run: |
          set -eux

          echo "========================================"
          echo "PATCH SUSFS"
          echo "========================================"

          echo "Patch:"
          echo "$SUSFS_KERNEL_PATCH"

          patch \
            -p1 \
            --forward \
            < "$SUSFS_KERNEL_PATCH"

      # ==========================================================
      # 9. APPLY KSU SUSFS PATCH
      # ==========================================================
      - name: Apply SUSFS KernelSU patch
        run: |
          set -eux

          echo "========================================"
          echo "PATCH KERNELSU"
          echo "========================================"

          KSU_PATCH="susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          if [ ! -f "$KSU_PATCH" ]; then
            echo "ERROR: KernelSU SUSFS patch missing."
            find susfs/kernel_patches/KernelSU \
              -maxdepth 1 \
              -type f \
              -print
            exit 1
          fi

          cp \
            "$KSU_PATCH" \
            KernelSU-Next/

          cd KernelSU-Next

          patch \
            -p1 \
            --forward \
            < 10_enable_susfs_for_ksu.patch

          cd ..

      # ==========================================================
      # 10. VERIFY SUSFS
      # ==========================================================
      - name: Verify SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "VERIFY SUSFS"
          echo "========================================"

          test -f fs/susfs.c
          test -f include/linux/susfs.h

          echo ""
          echo "susfs.c:"
          ls -lh fs/susfs.c

          echo ""
          echo "susfs.h:"
          ls -lh include/linux/susfs.h

          echo ""
          echo "SUSFS references:"
          grep -R \
            -n \
            "CONFIG_KSU_SUSFS" \
            KernelSU-Next/kernel \
            2>/dev/null \
            | head -30 \
            || true

      # ==========================================================
      # 11. GKI CONFIG
      # ==========================================================
      - name: Prepare GKI config
        run: |
          set -eux

          echo "========================================"
          echo "GKI CONFIG"
          echo "========================================"

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            gki_defconfig

      # ==========================================================
      # 12. ENABLE KSU + SUSFS
      # ==========================================================
      - name: Enable KernelSU SUSFS config
        run: |
          set -eux

          echo "========================================"
          echo "ENABLE KSU + SUSFS"
          echo "========================================"

          chmod +x scripts/config || true

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_SUSFS \
            --enable CONFIG_KPROBES \
            --enable CONFIG_KPROBE_EVENTS \
            --enable CONFIG_MODULES

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo ""
          echo "KSU:"
          grep '^CONFIG_KSU=' out/.config

          echo ""
          echo "SUSFS:"
          grep '^CONFIG_KSU_SUSFS=' out/.config

          echo ""
          echo "KPROBES:"
          grep '^CONFIG_KPROBES=' out/.config

      # ==========================================================
      # 13. REMOVE GKI PROTECTED EXPORT FILES
      # ==========================================================
      - name: Remove protected GKI exports
        run: |
          set -eux

          echo "========================================"
          echo "GKI PROTECTED EXPORTS"
          echo "========================================"

          rm -f \
            android/abi_gki_protected_exports_aarch64 \
            android/abi_gki_protected_exports_x86_64

          echo "Protected export files removed."

      # ==========================================================
      # 14. FINAL CONFIG
      # ==========================================================
      - name: Final config check
        run: |
          set -eux

          echo "========================================"
          echo "FINAL CONFIG"
          echo "========================================"

          grep '^CONFIG_ARM64=' out/.config || true
          grep '^CONFIG_MODULES=' out/.config || true
          grep '^CONFIG_KPROBES=' out/.config || true
          grep '^CONFIG_KSU=' out/.config || true
          grep '^CONFIG_KSU_SUSFS=' out/.config || true

      # ==========================================================
      # 15. COMPILER
      # ==========================================================
      - name: Compiler
        run: |
          set -eux

          clang --version
          echo ""
          ld.lld --version

      # ==========================================================
      # 16. BUILD
      # ==========================================================
      - name: Build kernel
        run: |
          set -eux

          echo "========================================"
          echo "BUILD 6.1.138"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image

      # ==========================================================
      # 17. VERIFY IMAGE
      # ==========================================================
      - name: Verify Image
        run: |
          set -eux

          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"

          IMAGE="out/arch/arm64/boot/Image"

          test -f "$IMAGE"

          echo ""
          echo "Image:"
          ls -lh "$IMAGE"

          echo ""
          echo "SHA256:"
          sha256sum "$IMAGE"

          echo ""
          echo "File:"
          file "$IMAGE"

      # ==========================================================
      # 18. REPORT
      # ==========================================================
      - name: Create report
        run: |
          set -eux

          mkdir -p report

          {
            echo "========================================"
            echo "PAD 7 GKI BUILD"
            echo "========================================"
            echo ""
            echo "KERNEL:"
            make -s kernelversion
            echo ""
            echo "SOURCE:"
            git rev-parse HEAD
            echo ""
            echo "KSU:"
            grep '^CONFIG_KSU=' out/.config || true
            echo ""
            echo "SUSFS:"
            grep '^CONFIG_KSU_SUSFS=' out/.config || true
            echo ""
            echo "IMAGE:"
            ls -lh out/arch/arm64/boot/Image
            echo ""
            echo "SHA256:"
            sha256sum out/arch/arm64/boot/Image
            echo ""
            echo "========================================"
            echo "BUILD SUCCESS"
            echo "========================================"
          } | tee report/FINAL-REPORT.txt

      # ==========================================================
      # 19. ARTIFACT
      # ==========================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pad7-6.1.138-kernelsu-next-susfs
          path: |
            out/arch/arm64/boot/Image
            out/.config
            report/FINAL-REPORT.txt
