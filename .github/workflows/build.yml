name: Build Xiaomi Pad 7 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo add-apt-repository universe
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            lld-18 \
            libelf-dev \
            libssl-dev \
            pahole \
            python3 \
            rsync \
            unzip \
            zip
                            sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld
        
      - name: Check source
        run: |
          echo "Kernel source:"
          pwd
          echo "Branch:"
          git branch --show-current
          echo "Kernel version:"
          make kernelversion

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          echo "=== PREPARE CONFIG ==="
          rm -rf out
          mkdir -p out

          echo "=== GKI DEFCONFIG ==="
          yes "" | make O=out ARCH=arm64 gki_defconfig

          echo "=== DISABLE KASAN ==="
          scripts/config --file out/.config -d CONFIG_KASAN
          scripts/config --file out/.config -d CONFIG_KASAN_GENERIC
          scripts/config --file out/.config -d CONFIG_KASAN_SW_TAGS
          scripts/config --file out/.config -d CONFIG_KASAN_HW_TAGS

          echo "=== DISABLE UBSAN ==="
          scripts/config --file out/.config -d CONFIG_UBSAN
          scripts/config --file out/.config -d CONFIG_UBSAN_TRAP
          scripts/config --file out/.config -d CONFIG_UBSAN_BOUNDS
          scripts/config --file out/.config -d CONFIG_UBSAN_LOCAL_BOUNDS
          scripts/config --file out/.config -d CONFIG_UBSAN_SHIFT
          scripts/config --file out/.config -d CONFIG_UBSAN_UNREACHABLE
          scripts/config --file out/.config -d CONFIG_UBSAN_BOOL
          scripts/config --file out/.config -d CONFIG_UBSAN_ENUM

          echo "=== FINALIZE CONFIG ==="
          yes "" | make O=out ARCH=arm64 olddefconfig

          echo "=== BUILD KERNEL ==="
          make -j"$(nproc)" O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            Image \
            dtbs \
            modules

      - name: Show output
        run: |
          echo "=== Kernel ==="
          ls -lh out/arch/arm64/boot/Image || true

          echo "=== DTBs ==="
          find out/arch/arm64/boot/dts -type f \
            \( -name "*.dtb" -o -name "*.dtbo" \) \
            -print | head -50 || true

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-pad7-kernel
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/**/*.dtb
            out/arch/arm64/boot/dts/**/*.dtbo
          if-no-files-found: warn
