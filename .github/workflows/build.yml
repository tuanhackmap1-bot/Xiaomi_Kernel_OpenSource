name: Build Xiaomi Pad 7 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          set -e

          sudo add-apt-repository universe
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            git \
            lld \
            llvm \
            libelf-dev \
            libssl-dev \
            pahole \
            pkg-config \
            python3 \
            rsync \
            unzip \
            zip

          echo "=== LLVM ==="
          clang --version

          echo "=== LLD ==="
          ld.lld --version


      # ============================================================
      # CHECK ORIGINAL XIAOMI KERNEL
      # ============================================================

      - name: Check Xiaomi kernel source
        run: |
          set -e

          echo "========================================"
          echo "     XIAOMI PAD 7 KERNEL SOURCE"
          echo "========================================"

          echo "=== REMOTE ==="
          git remote -v

          echo "=== COMMIT ==="
          git rev-parse HEAD

          echo "=== BRANCH ==="
          git branch --show-current || true

          echo "=== KERNEL VERSION ==="
          make -s kernelversion

          echo "=== KERNEL RELEASE ==="
          make -s kernelrelease || true

          echo "=== ARCH ==="
          echo "${ARCH:-not-set}"

          echo "========================================"


      # ============================================================
      # SETUP KERNELSU-NEXT
      #
      # KernelSU-Next v3.3.0 / Manager 33214
      # ============================================================

      - name: Setup KernelSU-Next
        run: |
          set -e

          echo "========================================"
          echo "       KERNELSU-NEXT SETUP"
          echo "========================================"

          echo "=== KERNELSU-NEXT SETUP ==="

          rm -rf KernelSU-Next

          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s v3.3.0

          echo "=== KERNELSU-NEXT DIRECTORY ==="

          test -d KernelSU-Next
          test -d KernelSU-Next/kernel

          echo "=== KERNELSU-NEXT COMMIT ==="

          git -C KernelSU-Next/kernel log -1 --oneline

          echo "=== KERNELSU-NEXT TAG ==="

          git -C KernelSU-Next/kernel describe --tags --always || true

          echo "=== CHECK KSU DRIVER ==="

          test -e drivers/kernelsu
          test -f drivers/kernelsu/Kconfig

          echo "KernelSU-Next setup OK"


      # ============================================================
      # CLONE SUSFS
      # ============================================================

      - name: Clone SUSFS
        run: |
          set -e

          echo "========================================"
          echo "             SUSFS SETUP"
          echo "========================================"

          rm -rf susfs

          git clone \
            --branch gki-android14-6.1 \
            https://github.com/deepongi-labs/susfs4ksu.git \
            susfs

          echo "=== SUSFS COMMIT ==="

          git -C susfs log -1 --oneline

          echo "=== SUSFS BRANCH ==="

          git -C susfs branch --show-current

          echo "=== SUSFS PATCH DIRECTORY ==="

          find susfs/kernel_patches \
            -maxdepth 3 \
            -type f \
            -print | head -100

          echo "SUSFS clone OK"


      # ============================================================
      # CHECK KERNELSU-NEXT + SUSFS
      #
      # IMPORTANT:
      # Do NOT apply the old KernelSU patch here.
      # ============================================================

      - name: Check KernelSU-Next and SUSFS
        run: |
          set -e

          echo "========================================"
          echo "   CHECK KERNELSU-NEXT + SUSFS"
          echo "========================================"

          echo "=== KERNEL ==="

          make -s kernelversion

          echo "=== KERNELSU-NEXT ==="

          git -C KernelSU-Next/kernel log -1 --format="%H"
          git -C KernelSU-Next/kernel log -1 --oneline

          echo "=== SUSFS ==="

          git -C susfs log -1 --format="%H"
          git -C susfs log -1 --oneline

          echo "=== KSU DRIVER ==="

          test -e drivers/kernelsu
          test -f drivers/kernelsu/Kconfig

          echo "drivers/kernelsu OK"

          echo "=== KSU CONFIG ==="

          grep -R "config KSU" \
            drivers/kernelsu/Kconfig \
            2>/dev/null | head -20 || true

          echo "=== SUSFS PATCH FILES ==="

          find susfs/kernel_patches \
            -type f \
            \( -name "*.patch" -o -name "*.diff" \) \
            -print

          echo "========================================"
          echo "   SOURCE CHECK PASSED"
          echo "========================================"


      # ============================================================
      # APPLY SUSFS KERNEL PATCHES
      #
      # Only apply the GKI kernel patch.
      # DO NOT apply:
      # KernelSU/10_enable_susfs_for_ksu.patch
      #
      # because that patch is for KernelSU, not this KSU-Next tree.
      # ============================================================

      - name: Apply SUSFS kernel patch
        run: |
          set -e

          echo "========================================"
          echo "       CHECK SUSFS KERNEL PATCH"
          echo "========================================"

          PATCH_FILE="susfs/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch"

          test -f "$PATCH_FILE"

          echo "=== SHOW SUSFS BASE.C HUNK ==="

          grep -n -A80 -B20 \
            "fs/proc/base.c" \
            "$PATCH_FILE" || true

          echo "=== FIRST FAILED HUNK CHECK ==="

          if patch \
            --dry-run \
            --batch \
            --forward \
            -p1 \
            < "$PATCH_FILE"
          then
            echo "SUSFS patch applies cleanly"
          else
            echo ""
            echo "========================================"
            echo " SUSFS PATCH DOES NOT FULLY MATCH KERNEL"
            echo "========================================"
            echo ""
            echo "The first known mismatch is in:"
            echo "fs/proc/base.c"
            echo ""
            echo "DO NOT BUILD."
            exit 1
          fi

      # ============================================================
      # CONFIG
      # ============================================================

      - name: Configure Xiaomi Pad 7 kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          echo "========================================"
          echo "        KERNEL CONFIGURATION"
          echo "========================================"

          rm -rf out
          mkdir -p out

          echo "=== FIND DEFCONFIG ==="

          find arch/arm64/configs \
            -maxdepth 2 \
            -type f \
            -name "*defconfig" \
            -print | head -100

          echo "=== GKI DEFCONFIG ==="

          make \
            O=out \
            ARCH=arm64 \
            gki_defconfig

          echo "=== ENABLE KERNELSU ==="

          scripts/config \
            --file out/.config \
            -e CONFIG_KSU

          echo "=== ENABLE SUSFS ==="

          if grep -q '^config KSU_SUSFS' drivers/kernelsu/Kconfig 2>/dev/null; then
            scripts/config \
              --file out/.config \
              -e CONFIG_KSU_SUSFS
          else
            echo "WARNING: CONFIG_KSU_SUSFS not found in KSU Kconfig"
          fi

          echo "=== DISABLE KASAN ==="

          scripts/config \
            --file out/.config \
            -d CONFIG_KASAN \
            -d CONFIG_KASAN_GENERIC \
            -d CONFIG_KASAN_SW_TAGS \
            -d CONFIG_KASAN_HW_TAGS

          echo "=== DISABLE UBSAN ==="

          scripts/config \
            --file out/.config \
            -d CONFIG_UBSAN \
            -d CONFIG_UBSAN_TRAP \
            -d CONFIG_UBSAN_BOUNDS \
            -d CONFIG_UBSAN_LOCAL_BOUNDS \
            -d CONFIG_UBSAN_SHIFT \
            -d CONFIG_UBSAN_UNREACHABLE \
            -d CONFIG_UBSAN_BOOL \
            -d CONFIG_UBSAN_ENUM

          echo "=== FINALIZE CONFIG ==="

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo "=== FINAL CONFIG ==="

          grep -E \
            '^(CONFIG_KSU=|CONFIG_KSU_SUSFS=|CONFIG_KSU_SUSFS_*)' \
            out/.config || true

          test -f out/include/config/auto.conf

          echo "Kernel config OK"


      # ============================================================
      # BUILD KERNEL
      # ============================================================

      - name: Build kernel Image
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          echo "========================================"
          echo "             BUILD IMAGE"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            Image

          test -f out/arch/arm64/boot/Image

          ls -lh out/arch/arm64/boot/Image

          echo "IMAGE BUILD SUCCESS"


      # ============================================================
      # BUILD DTBS
      # ============================================================

      - name: Build DTBs
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          echo "========================================"
          echo "               BUILD DTBS"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            dtbs

          echo "DTB BUILD SUCCESS"


      # ============================================================
      # SHOW OUTPUT
      # ============================================================

      - name: Show build output
        run: |
          echo "========================================"
          echo "             BUILD OUTPUT"
          echo "========================================"

          echo "=== IMAGE ==="

          ls -lh \
            out/arch/arm64/boot/Image || true

          echo "=== DTB / DTBO ==="

          find out/arch/arm64/boot/dts \
            -type f \
            \( -name "*.dtb" -o -name "*.dtbo" \) \
            -print | head -100 || true


      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-pad7-kernel
          if-no-files-found: warn
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/**/*.dtb
            out/arch/arm64/boot/dts/**/*.dtbo
