name: GKI 6.1.138 - KernelSU Next - SUSFS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. ANDROID COMMON 6.1.138
      # ============================================================
      - name: Checkout Android Common 6.1.138
        uses: actions/checkout@v4
        with:
          repository: android/kernel_common
          ref: android14-6.1-2025-06
          fetch-depth: 1

      # ============================================================
      # 2. DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            cpio \
            curl \
            flex \
            git \
            lld \
            llvm \
            libelf-dev \
            libssl-dev \
            pahole \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd

      # ============================================================
      # 3. VERIFY KERNEL
      # ============================================================
      - name: Verify 6.1.138
        run: |
          set -eux

          VERSION="$(make -s kernelversion)"

          echo "========================================"
          echo "KERNEL VERSION"
          echo "========================================"

          echo "Detected: $VERSION"

          test "$VERSION" = "6.1.138"

      # ============================================================
      # 4. KERNELSU NEXT
      # ============================================================
      - name: Install KernelSU Next
        run: |
          set -eux

          echo "========================================"
          echo "KERNELSU NEXT"
          echo "========================================"

          curl -LSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            | bash -s next

          test -d drivers/kernelsu

      # ============================================================
      # 5. SUSFS - CORRECT BRANCH
      # ============================================================
      - name: Download SUSFS gki-android14-6.1
        run: |
          set -eux

          echo "========================================"
          echo "SUSFS"
          echo "========================================"

          rm -rf susfs

          git clone \
            --depth=1 \
            --branch gki-android14-6.1 \
            https://github.com/deepongi-labs/susfs4ksu.git \
            susfs

          echo ""
          echo "SUSFS commit:"
          git -C susfs rev-parse HEAD

          echo ""
          echo "SUSFS patches:"
          find susfs/kernel_patches \
            -maxdepth 3 \
            -type f \
            | sort

      # ============================================================
      # 6. FIND CORRECT KERNEL PATCH
      # ============================================================
      - name: Find SUSFS 6.1 patch
        run: |
          set -eux

          echo "========================================"
          echo "FIND SUSFS PATCH"
          echo "========================================"

          PATCH="$(find susfs/kernel_patches \
            -maxdepth 1 \
            -type f \
            -name '50_add_susfs_in_kernel-*.patch' \
            | head -n 1)"

          if [ -z "$PATCH" ]; then
            echo ""
            echo "ERROR: No SUSFS kernel patch found."
            echo ""
            find susfs/kernel_patches \
              -maxdepth 2 \
              -type f \
              | sort
            exit 1
          fi

          echo "Found:"
          echo "$PATCH"

          cp "$PATCH" ./susfs-kernel.patch

      # ============================================================
      # 7. COPY SUSFS SOURCE
      # ============================================================
      - name: Copy SUSFS kernel source
        run: |
          set -eux

          echo "========================================"
          echo "COPY SUSFS SOURCE"
          echo "========================================"

          mkdir -p fs
          mkdir -p include/linux

          cp -v \
            susfs/kernel_patches/fs/* \
            fs/

          cp -v \
            susfs/kernel_patches/include/linux/* \
            include/linux/

      # ============================================================
      # 8. APPLY SUSFS KERNEL PATCH
      # ============================================================
      - name: Apply SUSFS kernel patch
        run: |
          set -eux

          echo "========================================"
          echo "PATCH KERNEL"
          echo "========================================"

          patch \
            -p1 \
            --forward \
            < susfs-kernel.patch

      # ============================================================
      # 9. APPLY KSU SUSFS PATCH IF PRESENT
      # ============================================================
      - name: Apply SUSFS KernelSU patch
        run: |
          set -eux

          echo "========================================"
          echo "PATCH KERNELSU"
          echo "========================================"

          KSU_PATCH="susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          if [ ! -f "$KSU_PATCH" ]; then
            echo "KernelSU SUSFS patch not found."
            echo "Listing available KernelSU patches:"
            find susfs/kernel_patches/KernelSU \
              -maxdepth 1 \
              -type f \
              | sort
            exit 1
          fi

          cp "$KSU_PATCH" drivers/kernelsu/

          cd drivers/kernelsu

          patch \
            -p1 \
            --forward \
            < 10_enable_susfs_for_ksu.patch

          cd ../..

      # ============================================================
      # 10. VERIFY SOURCE
      # ============================================================
      - name: Verify SUSFS source
        run: |
          set -eux

          echo "========================================"
          echo "VERIFY SUSFS"
          echo "========================================"

          test -f fs/susfs.c

          test -f include/linux/susfs.h

          grep -R \
            -n \
            "KSU_SUSFS" \
            fs \
            include \
            drivers/kernelsu \
            2>/dev/null \
            | head -50 \
            || true

          echo ""
          echo "SUSFS source successfully installed."

      # ============================================================
      # 11. GKI CONFIG
      # ============================================================
      - name: Prepare GKI config
        run: |
          set -eux

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            gki_defconfig

      # ============================================================
      # 12. ENABLE KSU + SUSFS
      # ============================================================
      - name: Enable KernelSU and SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "ENABLE KSU + SUSFS"
          echo "========================================"

          chmod +x scripts/config

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo ""
          echo "CONFIG_KSU:"
          grep '^CONFIG_KSU=' out/.config

          echo ""
          echo "CONFIG_KSU_SUSFS:"
          grep '^CONFIG_KSU_SUSFS=' out/.config

      # ============================================================
      # 13. REMOVE GKI PROTECTED EXPORT FILES
      # ============================================================
      - name: Prepare GKI ABI
        run: |
          set -eux

          rm -f \
            android/abi_gki_protected_exports_aarch64 \
            android/abi_gki_protected_exports_x86_64 \
            || true

      # ============================================================
      # 14. BUILD
      # ============================================================
      - name: Build Image
        run: |
          set -eux

          echo "========================================"
          echo "BUILD"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image

      # ============================================================
      # 15. VERIFY BUILD
      # ============================================================
      - name: Verify build
        run: |
          set -eux

          IMAGE="out/arch/arm64/boot/Image"

          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"

          test -f "$IMAGE"

          ls -lh "$IMAGE"

          echo ""
          echo "SHA256:"
          sha256sum "$IMAGE"

      # ============================================================
      # 16. REPORT
      # ============================================================
      - name: Create report
        run: |
          set -eux

          mkdir -p report

          {
            echo "GKI 6.1.138"
            echo "KernelSU Next"
            echo "SUSFS"
            echo ""
            echo "Kernel:"
            make -s kernelversion
            echo ""
            echo "KernelSU:"
            grep '^CONFIG_KSU=' out/.config || true
            echo ""
            echo "SUSFS:"
            grep '^CONFIG_KSU_SUSFS=' out/.config || true
            echo ""
            echo "Image:"
            ls -lh out/arch/arm64/boot/Image
            echo ""
            echo "SHA256:"
            sha256sum out/arch/arm64/boot/Image
          } | tee report/FINAL-REPORT.txt

      # ============================================================
      # 17. ARTIFACT
      # ============================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pad7-gki-6.1.138-ksu-next-susfs
          path: |
            out/arch/arm64/boot/Image
            out/.config
            report/FINAL-REPORT.txt
