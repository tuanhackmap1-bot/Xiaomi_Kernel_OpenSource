name: GKI 6.1.138 KernelSU-Next SUSFS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # 1. CHECKOUT GKI 6.1.138
      # ==========================================================
      - name: Checkout Android Common
        uses: actions/checkout@v4
        with:
          repository: android/kernel_common
          ref: android14-6.1-2025-06
          fetch-depth: 1

      # ==========================================================
      # 2. DEPENDENCIES
      # ==========================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            cpio \
            curl \
            flex \
            git \
            lld \
            llvm \
            libelf-dev \
            libssl-dev \
            pahole \
            patch \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd

      # ==========================================================
      # 3. VERIFY KERNEL VERSION
      # ==========================================================
      - name: Verify kernel version
        run: |
          set -eux

          echo "========================================"
          echo "KERNEL VERSION"
          echo "========================================"

          VERSION="$(make -s kernelversion)"

          echo "Detected: $VERSION"
          echo "Required: 6.1.138"

          if [ "$VERSION" != "6.1.138" ]; then
            echo ""
            echo "ERROR: Wrong kernel version."
            exit 1
          fi

          echo ""
          echo "6.1.138 OK."

      # ==========================================================
      # 4. DOWNLOAD SUSFS FROM GITLAB
      # ==========================================================
      - name: Download SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "DOWNLOAD SUSFS"
          echo "========================================"

          rm -rf susfs

          git clone \
            --depth=1 \
            --branch gki-android14-6.1 \
            https://gitlab.com/pershoot/susfs4ksu.git \
            susfs

          echo ""
          echo "SUSFS commit:"
          git -C susfs rev-parse HEAD

          echo ""
          echo "SUSFS files:"
          ls -la susfs/kernel_patches

      # ==========================================================
      # 5. VERIFY REQUIRED SUSFS FILES
      # ==========================================================
      - name: Verify SUSFS patch files
        run: |
          set -eux

          echo "========================================"
          echo "VERIFY SUSFS"
          echo "========================================"

          test -f \
            susfs/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch

          test -f \
            susfs/kernel_patches/60_scope-minimized_manual_hooks.patch

          test -d \
            susfs/kernel_patches/fs

          test -d \
            susfs/kernel_patches/include/linux

          echo ""
          echo "Required SUSFS files found."

      # ==========================================================
      # 6. COPY SUSFS SOURCE
      # ==========================================================
      - name: Copy SUSFS source
        run: |
          set -eux

          echo "========================================"
          echo "COPY SUSFS SOURCE"
          echo "========================================"

          cp -p \
            susfs/kernel_patches/fs/* \
            fs/

          cp -p \
            susfs/kernel_patches/include/linux/* \
            include/linux/

          echo ""
          echo "SUSFS source copied."

      # ==========================================================
      # 7. APPLY SUSFS PATCH 50
      # ==========================================================
      - name: Apply SUSFS patch 50
        run: |
          set -eux

          echo "========================================"
          echo "APPLY SUSFS PATCH 50"
          echo "========================================"

          patch \
            -p1 \
            --forward \
            < susfs/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch

          echo ""
          echo "Patch 50 applied."

      # ==========================================================
      # 8. APPLY SUSFS PATCH 60
      # ==========================================================
      - name: Apply SUSFS patch 60
        run: |
          set -eux

          echo "========================================"
          echo "APPLY SUSFS PATCH 60"
          echo "========================================"

          patch \
            -p1 \
            --forward \
            < susfs/kernel_patches/60_scope-minimized_manual_hooks.patch

          echo ""
          echo "Patch 60 applied."

      # ==========================================================
      # 9. VERIFY SUSFS SOURCE
      # ==========================================================
      - name: Verify SUSFS source
        run: |
          set -eux

          echo "========================================"
          echo "VERIFY SUSFS SOURCE"
          echo "========================================"

          echo ""
          echo "susfs.c:"
          test -f fs/susfs.c
          ls -lh fs/susfs.c

          echo ""
          echo "SUSFS headers:"
          find include/linux \
            -maxdepth 1 \
            -type f \
            -iname '*susfs*' \
            -print

          echo ""
          echo "Kconfig references:"
          grep -R \
            -n \
            "SUSFS\|susfs" \
            fs/Kconfig \
            fs/Makefile \
            2>/dev/null \
            || true

          echo ""
          echo "SUSFS source OK."

      # ==========================================================
      # 10. INSTALL KERNELSU-NEXT
      # ==========================================================
      - name: Install KernelSU Next
        run: |
          set -eux

          echo "========================================"
          echo "KERNELSU NEXT"
          echo "========================================"

          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -

          echo ""
          echo "KernelSU directory:"
          test -d drivers/kernelsu

          ls -la drivers/kernelsu

      # ==========================================================
      # 11. PREPARE GKI CONFIG
      # ==========================================================
      - name: Prepare GKI config
        run: |
          set -eux

          echo "========================================"
          echo "GKI CONFIG"
          echo "========================================"

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            gki_defconfig

      # ==========================================================
      # 12. ENABLE KSU
      # ==========================================================
      - name: Enable KernelSU
        run: |
          set -eux

          echo "========================================"
          echo "ENABLE KSU"
          echo "========================================"

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo ""
          echo "KernelSU:"
          grep '^CONFIG_KSU=' out/.config

      # ==========================================================
      # 13. CHECK SUSFS CONFIG
      # ==========================================================
      - name: Check SUSFS config
        run: |
          set -eux

          echo "========================================"
          echo "SUSFS CONFIG"
          echo "========================================"

          grep -R \
            -n \
            "CONFIG_KSU\|CONFIG_KPROBES\|CONFIG_KPROBE_EVENTS" \
            out/.config \
            || true

          echo ""
          echo "SUSFS files after patch:"
          test -f fs/susfs.c

          find include/linux \
            -maxdepth 1 \
            -type f \
            -iname '*susfs*' \
            -print

      # ==========================================================
      # 14. COMPILER
      # ==========================================================
      - name: Check compiler
        run: |
          set -eux

          echo "========================================"
          echo "LLVM"
          echo "========================================"

          clang --version
          echo ""
          ld.lld --version

      # ==========================================================
      # 15. BUILD
      # ==========================================================
      - name: Build kernel
        run: |
          set -eux

          echo "========================================"
          echo "BUILD 6.1.138"
          echo "KERNELSU NEXT"
          echo "SUSFS"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image

      # ==========================================================
      # 16. VERIFY IMAGE
      # ==========================================================
      - name: Verify Image
        run: |
          set -eux

          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"

          IMAGE="out/arch/arm64/boot/Image"

          test -f "$IMAGE"

          echo ""
          echo "Image:"
          ls -lh "$IMAGE"

          echo ""
          echo "SHA256:"
          sha256sum "$IMAGE"

          echo ""
          echo "File:"
          file "$IMAGE"

      # ==========================================================
      # 17. FINAL REPORT
      # ==========================================================
      - name: Create final report
        run: |
          set -eux

          mkdir -p report

          {
            echo "========================================"
            echo "GKI 6.1.138"
            echo "KERNELSU NEXT"
            echo "SUSFS"
            echo "========================================"
            echo ""
            echo "KERNEL VERSION:"
            make -s kernelversion
            echo ""
            echo "KERNEL COMMIT:"
            git rev-parse HEAD
            echo ""
            echo "SUSFS COMMIT:"
            git -C susfs rev-parse HEAD
            echo ""
            echo "KSU:"
            grep '^CONFIG_KSU=' out/.config || true
            echo ""
            echo "IMAGE:"
            ls -lh out/arch/arm64/boot/Image
            echo ""
            echo "SHA256:"
            sha256sum out/arch/arm64/boot/Image
            echo ""
            echo "========================================"
            echo "BUILD SUCCESS"
            echo "========================================"
          } | tee report/FINAL-REPORT.txt

      # ==========================================================
      # 18. UPLOAD
      # ==========================================================
      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: gki-6.1.138-kernelsu-next-susfs
          path: |
            out/arch/arm64/boot/Image
            out/.config
            report/FINAL-REPORT.txt
