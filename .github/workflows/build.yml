name: Pad 7 - KernelSU Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Xiaomi UKE
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: 5712080a4b0c0b1a879e6d145c601c649ddaddfd
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential clang flex git \
            lld llvm libelf-dev libssl-dev pahole \
            pkg-config python3 rsync unzip zip cpio \
            wget xz-utils zstd

      - name: Check source
        run: |
          set -e
          echo "========================================"
          echo "SOURCE"
          echo "========================================"

          git rev-parse HEAD
          echo ""
          echo "Kernel version:"
          make -s kernelversion

          echo ""
          echo "HWID:"
          if [ -d drivers/misc/hwid ]; then
            echo "FOUND"
          else
            echo "MISSING"
          fi

      - name: Remove unavailable HWID Kconfig reference
        run: |
          set -e

          if [ ! -d drivers/misc/hwid ]; then
            sed -i \
              '/source "drivers\/misc\/hwid\/Kconfig"/d' \
              drivers/misc/Kconfig
          fi

          echo "HWID Kconfig reference:"
          grep -n \
            'drivers/misc/hwid/Kconfig' \
            drivers/misc/Kconfig \
            || true

      - name: Download stock boot
        run: |
          set -e

          wget -q --show-progress \
            -O boot.img \
            "https://github.com/tuanhackmap1-bot/Xiaomi_Kernel_OpenSource/releases/download/boot-analysis/boot.img"

          ls -lh boot.img
          sha256sum boot.img

      - name: Extract stock kernel
        run: |
          set -e

          mkdir -p stock

          dd \
            if=boot.img \
            of=stock/kernel \
            bs=4096 \
            skip=1 \
            count=8645 \
            status=progress

          ls -lh stock/kernel
          file stock/kernel

      - name: Extract stock config
        run: |
          set -e

          wget -q \
            -O extract-ikconfig \
            "https://raw.githubusercontent.com/torvalds/linux/master/scripts/extract-ikconfig"

          chmod +x extract-ikconfig

          ./extract-ikconfig \
            stock/kernel \
            > stock.config \
            2>extract-error.txt \
            || true

          if [ ! -s stock.config ]; then
            echo "ERROR: stock config extraction failed"
            cat extract-error.txt || true
            exit 1
          fi

          wc -l stock.config

      - name: Prepare config
        run: |
          set -e

          rm -rf out
          mkdir -p out

          cp stock.config out/.config

      - name: Setup KernelSU Next
        run: |
          set -e

          echo "========================================"
          echo "KERNELSU-NEXT"
          echo "========================================"

          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s v3.3.0

          test -d drivers/kernelsu
          test -f drivers/kernelsu/Kconfig

          echo "KernelSU-Next installed."

      - name: Run olddefconfig
        run: |
          set -e

          echo "========================================"
          echo "OLDDEFCONFIG"
          echo "========================================"

          yes "" | make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo "olddefconfig OK"

      - name: Check KernelSU
        run: |
          set -e

          echo "========================================"
          echo "KERNELSU CONFIG"
          echo "========================================"

          grep '^CONFIG_KSU=' out/.config || true
          grep '^CONFIG_KSU' out/.config || true

      - name: Build Image
        run: |
          set -e

          echo "========================================"
          echo "BUILD"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image

      - name: Verify Image
        run: |
          set -e

          IMAGE="out/arch/arm64/boot/Image"

          test -f "$IMAGE"

          echo "========================================"
          echo "SUCCESS"
          echo "========================================"

          ls -lh "$IMAGE"

          echo ""
          sha256sum "$IMAGE"

          echo ""
          file "$IMAGE"

      - name: Create report
        run: |
          set -e

          mkdir -p report

          {
            echo "PAD 7 KERNELSU-NEXT"
            echo "=================="
            echo ""
            echo "Commit:"
            git rev-parse HEAD
            echo ""
            echo "Kernel version:"
            make -s kernelversion
            echo ""
            echo "KernelSU:"
            grep '^CONFIG_KSU=' out/.config || true
            echo ""
            echo "Image:"
            ls -lh out/arch/arm64/boot/Image
            echo ""
            echo "SHA256:"
            sha256sum out/arch/arm64/boot/Image
          } | tee report/FINAL-REPORT.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pad7-kernelsu-next-test
          path: |
            out/arch/arm64/boot/Image
            out/.config
            stock.config
            report/FINAL-REPORT.txt
