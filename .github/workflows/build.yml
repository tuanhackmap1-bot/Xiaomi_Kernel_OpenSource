name: GKI 6.1.138 KernelSU Next SUSFS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. ANDROID COMMON 6.1.138
      # ============================================================
      - name: Checkout Android Common 6.1.138
        uses: actions/checkout@v4
        with:
          repository: android/kernel_common
          ref: android14-6.1-2025-06
          fetch-depth: 1

      # ============================================================
      # 2. DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            cpio \
            curl \
            flex \
            git \
            lld \
            llvm \
            libelf-dev \
            libssl-dev \
            pahole \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd

      # ============================================================
      # 3. CHECK VERSION
      # ============================================================
      - name: Check kernel version
        run: |
          set -eux

          VERSION="$(make -s kernelversion)"

          echo "========================================"
          echo "KERNEL VERSION"
          echo "========================================"

          echo "Detected: $VERSION"
          echo "Required: 6.1.138"

          test "$VERSION" = "6.1.138"

      # ============================================================
      # 4. KERNELSU NEXT
      # ============================================================
      - name: Install KernelSU Next
        run: |
          set -eux

          echo "========================================"
          echo "KERNELSU NEXT"
          echo "========================================"

          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s next

          test -d drivers/kernelsu

          echo "KernelSU Next installed."

      # ============================================================
      # 5. CLONE SUSFS - CORRECT BRANCH
      # ============================================================
      - name: Clone SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "SUSFS"
          echo "========================================"

          rm -rf susfs4ksu

          git clone \
            --depth=1 \
            --branch gki-android14-6.1 \
            https://github.com/ShirkNeko/susfs4ksu.git \
            susfs4ksu

          test -d susfs4ksu/kernel_patches

          echo ""
          echo "SUSFS commit:"
          git -C susfs4ksu rev-parse HEAD

          echo ""
          echo "Available kernel patches:"
          find susfs4ksu/kernel_patches \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

      # ============================================================
      # 6. FIND CORRECT 6.1 PATCH
      # ============================================================
      - name: Find SUSFS 6.1 patch
        run: |
          set -eux

          echo "========================================"
          echo "FIND 6.1 PATCH"
          echo "========================================"

          PATCH="$(find susfs4ksu/kernel_patches \
            -maxdepth 1 \
            -type f \
            -name '50_add_susfs_in_kernel-6.1*.patch' \
            | head -1)"

          if [ -z "$PATCH" ]; then
            echo ""
            echo "ERROR: No SUSFS 6.1 kernel patch found."
            echo ""
            find susfs4ksu/kernel_patches \
              -maxdepth 1 \
              -type f \
              -print \
              | sort
            exit 1
          fi

          echo "Using patch:"
          echo "$PATCH"

          echo "SUSFS_PATCH=$PATCH" >> "$GITHUB_ENV"

      # ============================================================
      # 7. COPY SUSFS FILES
      # ============================================================
      - name: Copy SUSFS kernel files
        run: |
          set -eux

          echo "========================================"
          echo "COPY SUSFS"
          echo "========================================"

          cp \
            susfs4ksu/kernel_patches/fs/* \
            fs/

          cp \
            susfs4ksu/kernel_patches/include/linux/* \
            include/linux/

          echo ""
          echo "SUSFS files copied."

          echo ""
          echo "susfs.c:"
          test -f fs/susfs.c

          echo ""
          echo "susfs headers:"
          ls include/linux/*susfs* 2>/dev/null || true

      # ============================================================
      # 8. PATCH KERNELSU
      # ============================================================
      - name: Patch KernelSU for SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "PATCH KERNELSU"
          echo "========================================"

          KSU_PATCH="susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          test -f "$KSU_PATCH"

          cd drivers/kernelsu

          patch -p1 < "../../$KSU_PATCH"

      # ============================================================
      # 9. PATCH KERNEL
      # ============================================================
      - name: Patch kernel for SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "PATCH KERNEL"
          echo "========================================"

          patch -p1 < "$SUSFS_PATCH"

      # ============================================================
      # 10. VERIFY SUSFS
      # ============================================================
      - name: Verify SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "VERIFY SUSFS"
          echo "========================================"

          test -f fs/susfs.c

          ls include/linux/*susfs* >/dev/null

          grep -R \
            -n \
            "KSU_SUSFS" \
            drivers/kernelsu \
            2>/dev/null \
            | head -30 \
            || true

          echo ""
          echo "SUSFS source is present."

      # ============================================================
      # 11. CONFIG
      # ============================================================
      - name: Prepare GKI config
        run: |
          set -eux

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            gki_defconfig

      # ============================================================
      # 12. ENABLE KSU + SUSFS
      # ============================================================
      - name: Enable KernelSU SUSFS config
        run: |
          set -eux

          echo "========================================"
          echo "CONFIG KSU SUSFS"
          echo "========================================"

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_SUSFS

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo ""
          echo "KSU:"
          grep '^CONFIG_KSU=' out/.config

          echo ""
          echo "SUSFS:"
          grep '^CONFIG_KSU_SUSFS=' out/.config

      # ============================================================
      # 13. ENABLE IMPORTANT SUSFS FEATURES
      # ============================================================
      - name: Enable SUSFS features
        run: |
          set -eux

          for CONFIG in \
            CONFIG_KSU_SUSFS_SUS_MOUNT \
            CONFIG_KSU_SUSFS_SUS_KSTAT \
            CONFIG_KSU_SUSFS_SUS_PATH \
            CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
            CONFIG_KSU_SUSFS_TRY_UMOUNT \
            CONFIG_KSU_SUSFS_SPOOF_UNAME \
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          do
            scripts/config \
              --file out/.config \
              --enable "$CONFIG" \
              || true
          done

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo ""
          echo "Enabled SUSFS options:"

          grep '^CONFIG_KSU_SUSFS' \
            out/.config \
            || true

      # ============================================================
      # 14. BUILD
      # ============================================================
      - name: Build kernel
        run: |
          set -eux

          echo "========================================"
          echo "BUILD 6.1.138"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image

      # ============================================================
      # 15. VERIFY IMAGE
      # ============================================================
      - name: Verify Image
        run: |
          set -eux

          IMAGE="out/arch/arm64/boot/Image"

          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"

          test -f "$IMAGE"

          echo ""
          ls -lh "$IMAGE"

          echo ""
          sha256sum "$IMAGE"

          echo ""
          file "$IMAGE"

      # ============================================================
      # 16. REPORT
      # ============================================================
      - name: Create report
        run: |
          set -eux

          mkdir -p report

          {
            echo "========================================"
            echo "KERNEL BUILD REPORT"
            echo "========================================"
            echo ""
            echo "KERNEL VERSION:"
            make -s kernelversion
            echo ""
            echo "KERNEL COMMIT:"
            git rev-parse HEAD
            echo ""
            echo "SUSFS COMMIT:"
            git -C susfs4ksu rev-parse HEAD
            echo ""
            echo "KSU:"
            grep '^CONFIG_KSU=' out/.config || true
            echo ""
            echo "SUSFS:"
            grep '^CONFIG_KSU_SUSFS=' out/.config || true
            echo ""
            echo "IMAGE:"
            ls -lh out/arch/arm64/boot/Image
            echo ""
            echo "SHA256:"
            sha256sum out/arch/arm64/boot/Image
          } | tee report/FINAL-REPORT.txt

      # ============================================================
      # 17. ARTIFACT
      # ============================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gki-6.1.138-kernelsu-next-susfs
          path: |
            out/arch/arm64/boot/Image
            out/.config
            report/FINAL-REPORT.txt
