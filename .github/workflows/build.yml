name: GKI 6.1.138 KernelSU Next SUSFS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # 1. ANDROID COMMON 6.1.138
      # ==========================================================
      - name: Checkout Android Common 6.1.138
        uses: actions/checkout@v4
        with:
          repository: android/kernel_common
          ref: android14-6.1-2025-06
          fetch-depth: 1

      # ==========================================================
      # 2. DEPENDENCIES
      # ==========================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            cpio \
            curl \
            flex \
            git \
            lld \
            llvm \
            libelf-dev \
            libssl-dev \
            pahole \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd

      # ==========================================================
      # 3. VERIFY 6.1.138
      # ==========================================================
      - name: Verify kernel
        run: |
          set -eux

          VERSION="$(make -s kernelversion)"

          echo "========================================"
          echo "KERNEL VERSION"
          echo "========================================"

          echo "$VERSION"

          test "$VERSION" = "6.1.138"

      # ==========================================================
      # 4. KERNELSU NEXT
      # ==========================================================
      - name: Install KernelSU Next
        run: |
          set -eux

          echo "========================================"
          echo "KERNELSU NEXT"
          echo "========================================"

          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s next

          test -d drivers/kernelsu

          echo "KernelSU Next installed."

      # ==========================================================
      # 5. CLONE REAL SUSFS REPOSITORY
      # ==========================================================
      - name: Clone SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "CLONE SUSFS"
          echo "========================================"

          rm -rf susfs4ksu

          git clone \
            --depth=1 \
            --branch gki-android14-6.1 \
            https://github.com/deepongi-labs/susfs4ksu.git \
            susfs4ksu

          echo ""
          echo "SUSFS commit:"
          git -C susfs4ksu rev-parse HEAD

          echo ""
          echo "Patch files:"
          find susfs4ksu/kernel_patches \
            -maxdepth 2 \
            -type f \
            | sort

      # ==========================================================
      # 6. FIND CORRECT 6.1 PATCH
      # ==========================================================
      - name: Find SUSFS 6.1 patch
        run: |
          set -eux

          echo "========================================"
          echo "FIND SUSFS PATCH"
          echo "========================================"

          PATCH="$(find susfs4ksu/kernel_patches \
            -maxdepth 1 \
            -type f \
            -name '50_add_susfs_in_kernel-6.1*.patch' \
            | sort \
            | head -1)"

          if [ -z "$PATCH" ]; then
            echo ""
            echo "ERROR: No 6.1 SUSFS kernel patch found."
            echo ""
            find susfs4ksu/kernel_patches \
              -maxdepth 1 \
              -type f \
              -print \
              | sort
            exit 1
          fi

          echo "Found:"
          echo "$PATCH"

          echo "SUSFS_KERNEL_PATCH=$PATCH" >> "$GITHUB_ENV"

      # ==========================================================
      # 7. APPLY SUSFS FILES
      # ==========================================================
      - name: Apply SUSFS files
        run: |
          set -eux

          echo "========================================"
          echo "COPY SUSFS FILES"
          echo "========================================"

          cp \
            susfs4ksu/kernel_patches/fs/* \
            fs/

          cp \
            susfs4ksu/kernel_patches/include/linux/* \
            include/linux/

          echo "SUSFS source files copied."

      # ==========================================================
      # 8. PATCH KERNELSU
      # ==========================================================
      - name: Patch KernelSU Next
        run: |
          set -eux

          echo "========================================"
          echo "PATCH KERNELSU"
          echo "========================================"

          KSU_PATCH="susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          test -f "$KSU_PATCH"

          cp \
            "$KSU_PATCH" \
            drivers/kernelsu/

          cd drivers/kernelsu

          patch \
            -p1 \
            < 10_enable_susfs_for_ksu.patch

      # ==========================================================
      # 9. PATCH KERNEL
      # ==========================================================
      - name: Patch kernel with SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "PATCH KERNEL"
          echo "========================================"

          cp \
            "$SUSFS_KERNEL_PATCH" \
            ./susfs-kernel.patch

          patch \
            -p1 \
            < susfs-kernel.patch

      # ==========================================================
      # 10. VERIFY SUSFS
      # ==========================================================
      - name: Verify SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "VERIFY SUSFS"
          echo "========================================"

          echo ""
          echo "susfs.c:"
          test -f fs/susfs.c
          ls -lh fs/susfs.c

          echo ""
          echo "susfs.h:"
          test -f include/linux/susfs.h
          ls -lh include/linux/susfs.h

          echo ""
          echo "KSU SUSFS config:"
          grep -R \
            -n \
            "CONFIG_KSU_SUSFS" \
            drivers/kernelsu \
            | head -50 \
            || true

      # ==========================================================
      # 11. GKI DEFCONFIG
      # ==========================================================
      - name: Prepare GKI config
        run: |
          set -eux

          echo "========================================"
          echo "GKI CONFIG"
          echo "========================================"

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            gki_defconfig

      # ==========================================================
      # 12. ENABLE KSU + SUSFS
      # ==========================================================
      - name: Enable KSU SUSFS config
        run: |
          set -eux

          echo "========================================"
          echo "ENABLE KSU SUSFS"
          echo "========================================"

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_SUSFS \
            --enable CONFIG_MODULES

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo ""
          echo "CONFIG_KSU:"
          grep '^CONFIG_KSU=' out/.config

          echo ""
          echo "CONFIG_KSU_SUSFS:"
          grep '^CONFIG_KSU_SUSFS=' out/.config

      # ==========================================================
      # 13. REMOVE GKI PROTECTED EXPORTS
      # ==========================================================
      - name: Prepare GKI protected exports
        run: |
          set -eux

          rm -f \
            android/abi_gki_protected_exports_aarch64

          rm -f \
            android/abi_gki_protected_exports_x86_64

      # ==========================================================
      # 14. COMPILER
      # ==========================================================
      - name: Check compiler
        run: |
          set -eux

          clang --version
          ld.lld --version

      # ==========================================================
      # 15. BUILD
      # ==========================================================
      - name: Build kernel
        run: |
          set -eux

          echo "========================================"
          echo "BUILD 6.1.138"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image

      # ==========================================================
      # 16. VERIFY IMAGE
      # ==========================================================
      - name: Verify build
        run: |
          set -eux

          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"

          IMAGE="out/arch/arm64/boot/Image"

          test -f "$IMAGE"

          echo ""
          echo "Image:"
          ls -lh "$IMAGE"

          echo ""
          echo "SHA256:"
          sha256sum "$IMAGE"

          echo ""
          echo "File:"
          file "$IMAGE"

      # ==========================================================
      # 17. REPORT
      # ==========================================================
      - name: Create report
        run: |
          set -eux

          mkdir -p report

          {
            echo "========================================"
            echo "GKI 6.1.138"
            echo "KernelSU Next"
            echo "SUSFS"
            echo "========================================"
            echo ""
            echo "KERNEL:"
            make -s kernelversion
            echo ""
            echo "SOURCE:"
            git rev-parse HEAD
            echo ""
            echo "KSU:"
            grep '^CONFIG_KSU=' out/.config || true
            echo ""
            echo "SUSFS:"
            grep '^CONFIG_KSU_SUSFS=' out/.config || true
            echo ""
            echo "IMAGE:"
            ls -lh out/arch/arm64/boot/Image
            echo ""
            sha256sum out/arch/arm64/boot/Image
          } | tee report/FINAL-REPORT.txt

      # ==========================================================
      # 18. ARTIFACT
      # ==========================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pad7-gki-6.1.138-ksunext-susfs
          path: |
            out/arch/arm64/boot/Image
            out/.config
            report/FINAL-REPORT.txt
