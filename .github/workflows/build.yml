name: GKI 6.1.138 - KernelSU Next - SUSFS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT ANDROID COMMON
      # ============================================================
      - name: Checkout Android Common
        uses: actions/checkout@v4
        with:
          repository: android/kernel_common
          ref: android14-6.1-2025-06
          fetch-depth: 1

      # ============================================================
      # 2. DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            cpio \
            curl \
            flex \
            git \
            lld \
            llvm \
            libelf-dev \
            libssl-dev \
            pahole \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd

      # ============================================================
      # 3. VERIFY KERNEL VERSION
      # ============================================================
      - name: Verify kernel version
        run: |
          set -eux

          VERSION="$(make -s kernelversion)"

          echo "========================================"
          echo "KERNEL VERSION"
          echo "========================================"

          echo "$VERSION"

          if [ "$VERSION" != "6.1.138" ]; then
            echo ""
            echo "ERROR: Wrong kernel version"
            echo "Expected: 6.1.138"
            echo "Detected: $VERSION"
            exit 1
          fi

          echo ""
          echo "6.1.138 OK."

      # ============================================================
      # 4. KERNELSU NEXT
      # ============================================================
      - name: Install KernelSU Next
        run: |
          set -eux

          echo "========================================"
          echo "KERNELSU NEXT"
          echo "========================================"

          curl -LSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            | bash -s next

          test -d drivers/kernelsu

          echo ""
          echo "KernelSU source installed."

      # ============================================================
      # 5. DOWNLOAD SUSFS
      # ============================================================
      - name: Download SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "SUSFS"
          echo "========================================"

          rm -rf susfs

          git clone \
            --depth=1 \
            https://github.com/sidex15/susfs4ksu \
            susfs

          echo ""
          echo "SUSFS repository:"
          ls -la susfs

      # ============================================================
      # 6. SHOW SUSFS FILES
      # ============================================================
      - name: Inspect SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "SUSFS FILES"
          echo "========================================"

          find susfs \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -200

      # ============================================================
      # 7. CHECK SUSFS INTEGRATION SCRIPT
      # ============================================================
      - name: Locate SUSFS integration script
        run: |
          set -eux

          echo "========================================"
          echo "SUSFS INTEGRATION SCRIPT"
          echo "========================================"

          find susfs \
            -type f \
            \( \
              -name '*.sh' \
              -o \
              -name '*patch*' \
            \) \
            -print \
            | sort

      # ============================================================
      # 8. APPLY SUSFS
      # ============================================================
      - name: Apply SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "APPLY SUSFS"
          echo "========================================"

          cd susfs

          SCRIPT=""

          if [ -f kernel/setup.sh ]; then
            SCRIPT="kernel/setup.sh"
          elif [ -f setup.sh ]; then
            SCRIPT="setup.sh"
          fi

          if [ -n "$SCRIPT" ]; then
            echo "Using: $SCRIPT"

            chmod +x "$SCRIPT"

            "$SCRIPT" \
              "$(cd .. && pwd)"
          else
            echo ""
            echo "No automatic SUSFS kernel setup script found."
            echo ""
            echo "Available files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

      # ============================================================
      # 9. VERIFY SUSFS
      # ============================================================
      - name: Verify SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "VERIFY SUSFS"
          echo "========================================"

          cd "$GITHUB_WORKSPACE"

          echo ""
          echo "Searching kernel tree..."

          find fs \
            include \
            kernel \
            drivers \
            -type f \
            \( \
              -name 'susfs.c' \
              -o \
              -name '*susfs*.h' \
              -o \
              -name '*susfs*' \
            \) \
            -print \
            | sort \
            | head -200

          echo ""
          echo "Checking Kconfig references..."

          grep -R \
            -n \
            "SUSFS\|susfs" \
            fs \
            include \
            kernel \
            drivers \
            2>/dev/null \
            | head -100 \
            || true

      # ============================================================
      # 10. PREPARE GKI CONFIG
      # ============================================================
      - name: Prepare GKI config
        run: |
          set -eux

          echo "========================================"
          echo "GKI CONFIG"
          echo "========================================"

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            gki_defconfig

      # ============================================================
      # 11. ENABLE KERNELSU
      # ============================================================
      - name: Enable KernelSU
        run: |
          set -eux

          echo "========================================"
          echo "ENABLE KSU"
          echo "========================================"

          if [ ! -x scripts/config ]; then
            chmod +x scripts/config || true
          fi

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo ""
          grep '^CONFIG_KSU=' out/.config

      # ============================================================
      # 12. CONFIG CHECK
      # ============================================================
      - name: Check final config
        run: |
          set -eux

          echo "========================================"
          echo "CONFIG CHECK"
          echo "========================================"

          grep '^CONFIG_ARM64=' out/.config || true
          grep '^CONFIG_MODULES=' out/.config || true
          grep '^CONFIG_KPROBES=' out/.config || true
          grep '^CONFIG_KSU=' out/.config || true

      # ============================================================
      # 13. COMPILER
      # ============================================================
      - name: Check compiler
        run: |
          set -eux

          clang --version
          ld.lld --version

      # ============================================================
      # 14. BUILD
      # ============================================================
      - name: Build kernel
        run: |
          set -eux

          echo "========================================"
          echo "BUILD"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image

      # ============================================================
      # 15. VERIFY IMAGE
      # ============================================================
      - name: Verify Image
        run: |
          set -eux

          IMAGE="out/arch/arm64/boot/Image"

          echo "========================================"
          echo "RESULT"
          echo "========================================"

          test -f "$IMAGE"

          ls -lh "$IMAGE"

          echo ""
          sha256sum "$IMAGE"

          echo ""
          file "$IMAGE"

      # ============================================================
      # 16. REPORT
      # ============================================================
      - name: Create report
        run: |
          set -eux

          mkdir -p report

          {
            echo "========================================"
            echo "GKI 6.1.138"
            echo "KernelSU Next"
            echo "SUSFS"
            echo "========================================"
            echo ""
            echo "COMMIT:"
            git rev-parse HEAD
            echo ""
            echo "KERNEL:"
            make -s kernelversion
            echo ""
            echo "KSU:"
            grep '^CONFIG_KSU=' out/.config || true
            echo ""
            echo "IMAGE:"
            ls -lh out/arch/arm64/boot/Image
            echo ""
            echo "SHA256:"
            sha256sum out/arch/arm64/boot/Image
          } | tee report/FINAL-REPORT.txt

      # ============================================================
      # 17. ARTIFACT
      # ============================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pad7-6.1.138-kernelsu-next-susfs
          path: |
            out/arch/arm64/boot/Image
            out/.config
            report/FINAL-REPORT.txt
