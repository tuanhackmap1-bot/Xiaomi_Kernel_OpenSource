name: Build Pad 7 Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - uke-v-oss

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout official Xiaomi UKE
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: 5712080a4b0c0b1a879e6d145c601c649ddaddfd
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            cpio \
            flex \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd

      - name: Show source information
        run: |
          set -e

          echo "========================================"
          echo "XIAOMI UKE SOURCE"
          echo "========================================"

          echo "Commit:"
          git rev-parse HEAD

          echo ""
          echo "Branch:"
          git branch --show-current || true

          echo ""
          echo "Kernel version:"
          make -s kernelversion

          echo ""
          echo "Makefile:"
          grep -E '^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION' Makefile

      - name: Check missing Xiaomi HWID source
        run: |
          set -e

          echo "========================================"
          echo "CHECK HWID"
          echo "========================================"

          echo "HWID references:"
          git grep -n -i "drivers/misc/hwid" || true

          echo ""
          echo "HWID directory:"

          if [ -d drivers/misc/hwid ]; then
            echo "FOUND"
            find drivers/misc/hwid -maxdepth 2 -type f -print
          else
            echo "MISSING"
          fi

      - name: Download stock boot image
        run: |
          set -e

          wget -q --show-progress \
            -O boot.img \
            "https://github.com/tuanhackmap1-bot/Xiaomi_Kernel_OpenSource/releases/download/boot-analysis/boot.img"

          echo ""
          echo "boot.img:"
          ls -lh boot.img

          echo ""
          echo "SHA256:"
          sha256sum boot.img

      - name: Extract stock kernel
        run: |
          set -e

          mkdir -p stock

          dd \
            if=boot.img \
            of=stock/kernel \
            bs=4096 \
            skip=1 \
            count=8645 \
            status=progress

          echo ""
          echo "Stock kernel:"
          ls -lh stock/kernel

          file stock/kernel

      - name: Extract stock config
        run: |
          set -e

          wget -q \
            -O extract-ikconfig \
            "https://raw.githubusercontent.com/torvalds/linux/master/scripts/extract-ikconfig"

          chmod +x extract-ikconfig

          ./extract-ikconfig \
            stock/kernel \
            > stock.config \
            2> stock-config-error.txt \
            || true

          if [ ! -s stock.config ]; then
            echo "ERROR: stock.config extraction failed"
            cat stock-config-error.txt || true
            exit 1
          fi

          echo "Stock config:"
          wc -l stock.config

      - name: Check stock config
        run: |
          set -e

          echo "========================================"
          echo "STOCK CONFIG"
          echo "========================================"

          grep -E \
            '^CONFIG_(ARM64|MODULES|KALLSYMS|KALLSYMS_ALL|BPF|BPF_SYSCALL|SECURITY|SECURITYFS|SECURITY_SELINUX)' \
            stock.config \
            || true

      - name: Prepare output
        run: |
          set -e

          mkdir -p out

          cp stock.config out/.config

      - name: Run olddefconfig
        run: |
          set -e

          echo "========================================"
          echo "OLDDEFCONFIG"
          echo "========================================"

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

      - name: Verify configuration
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURATION RESULT"
          echo "========================================"

          grep '^CONFIG_ARM64=' out/.config || true
          grep '^CONFIG_MODULES=' out/.config || true
          grep '^CONFIG_KALLSYMS=' out/.config || true
          grep '^CONFIG_KALLSYMS_ALL=' out/.config || true

      - name: Check SUSFS patch
        run: |
          set -e

          echo "========================================"
          echo "SUSFS PATCH CHECK"
          echo "========================================"

          if [ ! -f susfs.patch ]; then
            echo "No susfs.patch found."
            echo "Skipping SUSFS patch."
            exit 0
          fi

          echo "Patch found:"
          ls -lh susfs.patch

          echo ""
          echo "Patch targets:"
          grep -E \
            '^\+\+\+ b/|^--- a/' \
            susfs.patch \
            | head -100

          echo ""
          echo "Checking kernel/supercalls.c..."

          if [ -f kernel/supercalls.c ]; then
            echo "kernel/supercalls.c EXISTS"
          else
            echo "kernel/supercalls.c DOES NOT EXIST"
            echo ""
            echo "SUSFS patch does not match this Xiaomi source tree."
            echo "Patch will NOT be applied."
          fi

      - name: Build kernel
        run: |
          set -e

          echo "========================================"
          echo "BUILD KERNEL"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image

      - name: Check Image
        run: |
          set -e

          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"

          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "ERROR: Image not produced."
            exit 1
          fi

          ls -lh out/arch/arm64/boot/Image

          echo ""
          echo "SHA256:"
          sha256sum out/arch/arm64/boot/Image

          echo ""
          echo "File:"
          file out/arch/arm64/boot/Image

      - name: Create report
        run: |
          set -e

          mkdir -p report

          {
            echo "PAD 7 KERNEL BUILD REPORT"
            echo "========================="
            echo ""
            echo "Commit:"
            git rev-parse HEAD
            echo ""
            echo "Kernel version:"
            make -s kernelversion
            echo ""
            echo "Stock config SHA256:"
            sha256sum stock.config
            echo ""
            echo "Final config SHA256:"
            sha256sum out/.config
            echo ""
            echo "Image SHA256:"
            sha256sum out/arch/arm64/boot/Image
            echo ""
            echo "Image:"
            ls -lh out/arch/arm64/boot/Image
          } | tee report/FINAL-REPORT.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pad7-kernel-build
          path: |
            out/arch/arm64/boot/Image
            out/.config
            stock.config
            report/FINAL-REPORT.txt
