name: Build Xiaomi Pad 7 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e

          sudo add-apt-repository universe
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            lld \
            clang \
            llvm \
            libelf-dev \
            libssl-dev \
            zlib1g-dev \
            pkg-config \
            pahole \
            python3 \
            rsync \
            unzip \
            zip \
            curl

      - name: Check Xiaomi source
        run: |
          set -e

          echo "========================================"
          echo "      XIAOMI PAD 7 SOURCE CHECK"
          echo "========================================"

          echo "=== BRANCH ==="
          git branch --show-current

          echo "=== COMMIT ==="
          git rev-parse HEAD

          echo "=== SOURCE KERNEL VERSION ==="
          make -s kernelversion

          echo "=== STOCK CONFIG ==="
          test -f arch/arm64/configs/uke_stock.config
          echo "uke_stock.config FOUND"

          echo "=== STOCK CONFIG HEADER ==="
          head -5 arch/arm64/configs/uke_stock.config

      - name: Check stock config
        run: |
          set -e

          echo "========================================"
          echo "       STOCK CONFIG 6.1.138"
          echo "========================================"

          grep '^CONFIG_CC_VERSION_TEXT=' \
            arch/arm64/configs/uke_stock.config

          grep '^CONFIG_CLANG_VERSION=' \
            arch/arm64/configs/uke_stock.config

          grep '^CONFIG_LLD_VERSION=' \
            arch/arm64/configs/uke_stock.config

          grep '^CONFIG_TRIM_UNUSED_KSYMS=' \
            arch/arm64/configs/uke_stock.config

          grep '^CONFIG_MODULES=' \
            arch/arm64/configs/uke_stock.config

          grep '^CONFIG_MODVERSIONS=' \
            arch/arm64/configs/uke_stock.config

      - name: Setup KernelSU-Next
        run: |
          set -e

          echo "========================================"
          echo "       KERNELSU-NEXT SETUP"
          echo "========================================"

          rm -rf KernelSU-Next

          git clone \
            https://github.com/pershoot/KernelSU-Next.git \
            KernelSU-Next

          cd KernelSU-Next

          git checkout v3.3.0

          echo "=== KERNELSU-NEXT COMMIT ==="
          git log -1 --oneline

          cd ..

          echo "=== RUN KERNELSU-NEXT SETUP ==="

          bash KernelSU-Next/kernel/setup.sh dev

          echo "=== CHECK KERNELSU-NEXT ==="

          test -e drivers/kernelsu
          test -f drivers/kernelsu/Kconfig

          echo "KernelSU-Next setup OK"
          

      - name: Clone SUSFS
        run: |
          set -e

          echo "========================================"
          echo "            SUSFS SETUP"
          echo "========================================"

          rm -rf susfs

          git clone \
            --branch gki-android14-6.1 \
            https://github.com/deepongi-labs/susfs4ksu.git \
            susfs

          cd susfs

          SUSFS_COMMIT=$(git log --format="%H" --grep="Bump version to v" -1)

          if [ -z "$SUSFS_COMMIT" ]; then
            echo "ERROR: Cannot find SUSFS Bump version commit"
            exit 1
          fi

          git checkout "$SUSFS_COMMIT"

          cd ..

          echo "=== SUSFS COMMIT ==="

          git -C susfs log -1 --oneline

          echo "=== SUSFS PATCH ==="

          test -f \
            susfs/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch

          test -f \
            susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

          echo "SUSFS patches FOUND"
      - name: CHECK KernelSU and SUSFS compatibility
        run: |
          set -e

          echo "========================================"
          echo "   CHECK KERNELSU + SUSFS COMPATIBILITY"
          echo "========================================"

          echo "=== KERNEL SOURCE ==="
          make -s kernelversion

          echo "=== KERNELSU COMMIT ==="
          git -C KernelSU log -1 --oneline

          echo "=== SUSFS COMMIT ==="
          git -C susfs log -1 --oneline

          echo "=== TEST KERNELSU SUSFS PATCH ==="

          cd KernelSU

          patch --dry-run --batch --forward -p1 \
            < ../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

          cd ..

          echo "========================================"
          echo "   KERNELSU + SUSFS CHECK PASSED"
          echo "========================================"
      - name: Copy SUSFS files
        run: |
          set -e

          echo "========================================"
          echo "       COPY SUSFS FILES"
          echo "========================================"

          cp -fv \
            susfs/kernel_patches/fs/* \
            fs/

          cp -fv \
            susfs/kernel_patches/include/linux/* \
            include/linux/

      

      
      
      
      - name: Prepare stock configuration
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          echo "========================================"
          echo "       PREPARE STOCK CONFIG"
          echo "========================================"

          rm -rf out
          mkdir -p out

          cp \
            arch/arm64/configs/uke_stock.config \
            out/.config

          echo "=== ENABLE KERNELSU ==="

          scripts/config \
            --file out/.config \
            -e CONFIG_KSU

          echo "=== ENABLE SUSFS ==="

          scripts/config \
            --file out/.config \
            -e CONFIG_KSU_SUSFS

          echo "=== KEEP STOCK CONFIG ==="

          grep '^CONFIG_TRIM_UNUSED_KSYMS=' \
            out/.config || true

          echo "=== FINALIZE CONFIG ==="

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          test -f out/.config
          test -f out/include/config/auto.conf

          echo "=== FINAL CONFIG ==="

          grep -E \
            '^(CONFIG_KSU=|CONFIG_KSU_SUSFS=|CONFIG_MODULES=|CONFIG_MODVERSIONS=|CONFIG_TRIM_UNUSED_KSYMS=)' \
            out/.config || true

      - name: Prepare kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          echo "========================================"
          echo "          KERNEL PREPARE"
          echo "========================================"

          make \
            O=out \
            ARCH=arm64 \
            prepare

          make \
            O=out \
            ARCH=arm64 \
            modules_prepare

      - name: Build Image
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          echo "========================================"
          echo "             BUILD IMAGE"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            Image

          test -f \
            out/arch/arm64/boot/Image

          ls -lh \
            out/arch/arm64/boot/Image

      - name: Build DTBs
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          echo "========================================"
          echo "              BUILD DTBS"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            dtbs

      - name: Verify result
        run: |
          set -e

          echo "========================================"
          echo "           BUILD SUCCESS"
          echo "========================================"

          test -f \
            out/arch/arm64/boot/Image

          echo "=== IMAGE ==="

          ls -lh \
            out/arch/arm64/boot/Image

          echo "=== KERNEL RELEASE ==="

          make \
            O=out \
            ARCH=arm64 \
            -s kernelrelease

          echo "=== DTB FILES ==="

          find \
            out/arch/arm64/boot/dts \
            -type f \
            \( -name "*.dtb" -o -name "*.dtbo" \) \
            -print | head -100 || true

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-pad7-kernel-ksu-susfs
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/**/*.dtb
            out/arch/arm64/boot/dts/**/*.dtbo
          if-no-files-found: warn
