name: GKI 6.1.138 - KernelSU Next - SUSFS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. ANDROID COMMON 6.1.138
      # ============================================================
      - name: Checkout Android Common 6.1
        uses: actions/checkout@v4
        with:
          repository: android/kernel_common
          ref: android14-6.1-2025-06
          fetch-depth: 1

      # ============================================================
      # 2. DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            cpio \
            curl \
            flex \
            git \
            lld \
            llvm \
            libelf-dev \
            libssl-dev \
            pahole \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd

      # ============================================================
      # 3. VERIFY 6.1.138
      # ============================================================
      - name: Verify kernel version
        run: |
          set -eux

          VERSION="$(make -s kernelversion)"

          echo "========================================"
          echo "KERNEL VERSION"
          echo "========================================"

          echo "Detected: $VERSION"

          if [ "$VERSION" != "6.1.138" ]; then
            echo ""
            echo "ERROR: Expected 6.1.138"
            echo "Detected: $VERSION"
            exit 1
          fi

          echo ""
          echo "6.1.138 OK."

      # ============================================================
      # 4. KERNELSU NEXT - DEV SUSFS
      # ============================================================
      - name: Install KernelSU Next
        run: |
          set -eux

          echo "========================================"
          echo "KERNELSU NEXT"
          echo "========================================"

          curl -LSs \
            "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" \
            | bash -s dev-susfs

          test -d KernelSU-Next/kernel

          echo ""
          echo "KernelSU Next installed."

      # ============================================================
      # 5. SUSFS
      # ============================================================
      - name: Clone SUSFS 6.1
        run: |
          set -eux

          echo "========================================"
          echo "SUSFS"
          echo "========================================"

          rm -rf susfs

          git clone \
            --depth=1 \
            --branch gki-android14-6.1 \
            https://github.com/deepongi-labs/susfs4ksu.git \
            susfs

          echo ""
          echo "SUSFS commit:"
          git -C susfs rev-parse HEAD

          echo ""
          echo "SUSFS files:"
          find susfs/kernel_patches \
            -maxdepth 3 \
            -type f \
            | sort

      # ============================================================
      # 6. FIND REAL 6.1 PATCH
      # ============================================================
      - name: Find SUSFS 6.1 patch
        run: |
          set -eux

          echo "========================================"
          echo "FIND 6.1 PATCH"
          echo "========================================"

          PATCH="$(find susfs/kernel_patches \
            -maxdepth 1 \
            -type f \
            -name '50_add_susfs_in_kernel-6.1*.patch' \
            | head -1)"

          if [ -z "$PATCH" ]; then
            echo ""
            echo "ERROR: No SUSFS 6.1 kernel patch found."
            echo ""
            echo "Available kernel patches:"
            find susfs/kernel_patches \
              -maxdepth 1 \
              -type f \
              -print \
              | sort
            exit 1
          fi

          echo "Found:"
          echo "$PATCH"

          echo "SUSFS_PATCH=$PATCH" >> "$GITHUB_ENV"

      # ============================================================
      # 7. COPY SUSFS KERNEL FILES
      # ============================================================
      - name: Copy SUSFS kernel files
        run: |
          set -eux

          echo "========================================"
          echo "COPY SUSFS FILES"
          echo "========================================"

          cp -av \
            susfs/kernel_patches/fs/* \
            fs/

          cp -av \
            susfs/kernel_patches/include/linux/* \
            include/linux/

      # ============================================================
      # 8. PATCH KERNELSU
      # ============================================================
      - name: Patch KernelSU for SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "PATCH KERNELSU"
          echo "========================================"

          KSU_PATCH="$(find susfs/kernel_patches/KernelSU \
            -maxdepth 1 \
            -type f \
            -name '10_enable_susfs_for_ksu.patch' \
            | head -1)"

          if [ -z "$KSU_PATCH" ]; then
            echo ""
            echo "ERROR: KernelSU SUSFS patch not found."
            find susfs/kernel_patches/KernelSU \
              -maxdepth 1 \
              -type f \
              -print \
              | sort
            exit 1
          fi

          echo "Using:"
          echo "$KSU_PATCH"

          cd KernelSU-Next

          patch -p1 < "../$KSU_PATCH"

      # ============================================================
      # 9. PATCH KERNEL
      # ============================================================
      - name: Patch kernel with SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "APPLY SUSFS"
          echo "========================================"

          echo "Patch:"
          echo "$SUSFS_PATCH"

          patch -p1 < "$SUSFS_PATCH"

      # ============================================================
      # 10. CHECK SUSFS
      # ============================================================
      - name: Verify SUSFS source
        run: |
          set -eux

          echo "========================================"
          echo "VERIFY SUSFS"
          echo "========================================"

          echo ""
          echo "susfs.c:"
          find fs -name 'susfs.c' -print

          echo ""
          echo "susfs headers:"
          find include/linux \
            -iname '*susfs*' \
            -print

          echo ""
          echo "KSU SUSFS:"
          grep -R \
            -n \
            'CONFIG_KSU_SUSFS' \
            KernelSU-Next/kernel \
            2>/dev/null \
            | head -50 \
            || true

      # ============================================================
      # 11. GKI CONFIG
      # ============================================================
      - name: Prepare GKI config
        run: |
          set -eux

          echo "========================================"
          echo "GKI CONFIG"
          echo "========================================"

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            gki_defconfig

      # ============================================================
      # 12. ENABLE KSU + SUSFS
      # ============================================================
      - name: Enable KernelSU and SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "ENABLE KSU + SUSFS"
          echo "========================================"

          chmod +x scripts/config || true

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_SUSFS \
            --enable CONFIG_MODULES

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo ""
          echo "KSU:"
          grep '^CONFIG_KSU=' out/.config || true

          echo ""
          echo "SUSFS:"
          grep '^CONFIG_KSU_SUSFS=' out/.config || true

      # ============================================================
      # 13. REMOVE GKI PROTECTED EXPORTS
      # ============================================================
      - name: Fix GKI protected exports
        run: |
          set -eux

          rm -f \
            android/abi_gki_protected_exports_aarch64 \
            android/abi_gki_protected_exports_x86_64

      # ============================================================
      # 14. COMPILER
      # ============================================================
      - name: Show compiler
        run: |
          set -eux

          clang --version
          echo ""
          ld.lld --version

      # ============================================================
      # 15. BUILD
      # ============================================================
      - name: Build kernel
        run: |
          set -eux

          echo "========================================"
          echo "BUILD 6.1.138"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image

      # ============================================================
      # 16. RESULT
      # ============================================================
      - name: Verify Image
        run: |
          set -eux

          IMAGE="out/arch/arm64/boot/Image"

          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"

          test -f "$IMAGE"

          echo ""
          echo "Image:"
          ls -lh "$IMAGE"

          echo ""
          echo "SHA256:"
          sha256sum "$IMAGE"

          echo ""
          echo "File:"
          file "$IMAGE"

      # ============================================================
      # 17. REPORT
      # ============================================================
      - name: Create report
        run: |
          set -eux

          mkdir -p report

          {
            echo "========================================"
            echo "GKI 6.1.138"
            echo "KERNELSU NEXT"
            echo "SUSFS"
            echo "========================================"
            echo ""
            echo "SOURCE:"
            git rev-parse HEAD
            echo ""
            echo "KERNEL:"
            make -s kernelversion
            echo ""
            echo "KSU:"
            grep '^CONFIG_KSU=' out/.config || true
            echo ""
            echo "SUSFS:"
            grep '^CONFIG_KSU_SUSFS=' out/.config || true
            echo ""
            echo "IMAGE:"
            ls -lh out/arch/arm64/boot/Image
            echo ""
            echo "SHA256:"
            sha256sum out/arch/arm64/boot/Image
          } | tee report/FINAL-REPORT.txt

      # ============================================================
      # 18. ARTIFACT
      # ============================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pad7-6.1.138-kernelsu-next-susfs
          path: |
            out/arch/arm64/boot/Image
            out/.config
            report/FINAL-REPORT.txt
