name: GKI 6.1.138 KernelSU Next SUSFS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout Android Common 6.1.138
        uses: actions/checkout@v4
        with:
          repository: android/kernel_common
          ref: android14-6.1-2025-06
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            cpio \
            curl \
            flex \
            git \
            lld \
            llvm \
            libelf-dev \
            libssl-dev \
            pahole \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd

      - name: Verify kernel version
        run: |
          set -eux

          VERSION="$(make -s kernelversion)"

          echo "Kernel: $VERSION"

          test "$VERSION" = "6.1.138"

      - name: Setup KernelSU Next
        run: |
          set -eux

          curl -LSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            | bash -s next

          test -d drivers/kernelsu

      - name: Clone SUSFS 6.1
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch gki-android14-6.1 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs

          test -d susfs/kernel_patches

          find susfs/kernel_patches -maxdepth 2 -type f | sort

      - name: Apply SUSFS kernel patches
        run: |
          set -eux

          echo "========================================"
          echo "APPLY SUSFS"
          echo "========================================"

          cp \
            susfs/kernel_patches/50_add_susfs_in_kernel-6.1.patch \
            .

          cp \
            susfs/kernel_patches/fs/* \
            fs/

          cp \
            susfs/kernel_patches/include/linux/* \
            include/linux/

          echo ""
          echo "SUSFS files copied."

          echo ""
          echo "Kernel patch:"
          ls -lh 50_add_susfs_in_kernel-6.1.patch

          patch \
            -p1 \
            < 50_add_susfs_in_kernel-6.1.patch

      - name: Apply SUSFS KernelSU patch
        run: |
          set -eux

          echo "========================================"
          echo "PATCH KERNELSU"
          echo "========================================"

          cp \
            susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch \
            drivers/kernelsu/

          cd drivers/kernelsu

          patch \
            -p1 \
            < 10_enable_susfs_for_ksu.patch

      - name: Verify SUSFS source
        run: |
          set -eux

          echo "========================================"
          echo "VERIFY SUSFS"
          echo "========================================"

          test -f fs/susfs.c

          find include/linux \
            -iname '*susfs*' \
            -print

          grep -R \
            -n \
            "CONFIG_KSU_SUSFS" \
            drivers/kernelsu \
            fs \
            include/linux \
            | head -50

      - name: Prepare GKI config
        run: |
          set -eux

          rm -rf out

          make \
            O=out \
            ARCH=arm64 \
            gki_defconfig

      - name: Enable KernelSU and SUSFS
        run: |
          set -eux

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_SUSFS

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo ""
          echo "KSU:"
          grep '^CONFIG_KSU=' out/.config

          echo ""
          echo "SUSFS:"
          grep '^CONFIG_KSU_SUSFS=' out/.config

      - name: Build kernel
        run: |
          set -eux

          echo "========================================"
          echo "BUILD"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image

      - name: Verify Image
        run: |
          set -eux

          IMAGE="out/arch/arm64/boot/Image"

          test -f "$IMAGE"

          echo "========================================"
          echo "SUCCESS"
          echo "========================================"

          ls -lh "$IMAGE"

          echo ""
          sha256sum "$IMAGE"

      - name: Create report
        run: |
          set -eux

          mkdir -p report

          {
            echo "Kernel version:"
            make -s kernelversion

            echo ""
            echo "KSU:"
            grep '^CONFIG_KSU=' out/.config || true

            echo ""
            echo "SUSFS:"
            grep '^CONFIG_KSU_SUSFS=' out/.config || true

            echo ""
            echo "Image:"
            ls -lh out/arch/arm64/boot/Image

            echo ""
            echo "SHA256:"
            sha256sum out/arch/arm64/boot/Image
          } | tee report/FINAL-REPORT.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gki-6.1.138-kernelsu-next-susfs
          path: |
            out/arch/arm64/boot/Image
            out/.config
            report/FINAL-REPORT.txt
