name: Pad 7 - KernelSU Next Build

on:
  workflow_dispatch:
  push:
    branches:
      - uke-v-oss

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout official Xiaomi UKE
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: 5712080a4b0c0b1a879e6d145c601c649ddaddfd
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            rsync \
            cpio \
            wget \
            unzip \
            xz-utils \
            zstd

      - name: Show source
        run: |
          set -e

          echo "========================================"
          echo "XIAOMI PAD 7 UKE"
          echo "========================================"

          echo "Commit:"
          git rev-parse HEAD

          echo ""
          echo "Kernel version:"
          make -s kernelversion

          echo ""
          grep -E \
            '^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION' \
            Makefile

      - name: Check HWID
        run: |
          set -e

          echo "========================================"
          echo "CHECK HWID"
          echo "========================================"

          if [ -d drivers/misc/hwid ]; then
            echo "HWID directory exists."
          else
            echo "HWID directory is missing."
          fi

          echo ""
          echo "Reference:"
          grep -n \
            'drivers/misc/hwid/Kconfig' \
            drivers/misc/Kconfig \
            || true

      - name: Remove missing HWID dependency
        run: |
          set -e

          if [ ! -d drivers/misc/hwid ]; then

            echo "HWID source missing."
            echo "Removing broken Kconfig reference."

            sed -i \
              '/source "drivers\/misc\/hwid\/Kconfig"/d' \
              drivers/misc/Kconfig

          else

            echo "HWID source exists."
            echo "Nothing to change."

          fi

          echo ""
          echo "Remaining HWID reference:"
          grep -n \
            'drivers/misc/hwid/Kconfig' \
            drivers/misc/Kconfig \
            || true

      - name: Download stock boot
        run: |
          set -e

          wget -q --show-progress \
            -O boot.img \
            "https://github.com/tuanhackmap1-bot/Xiaomi_Kernel_OpenSource/releases/download/boot-analysis/boot.img"

          echo ""
          echo "boot.img:"
          ls -lh boot.img

          echo ""
          echo "SHA256:"
          sha256sum boot.img

      - name: Extract stock kernel
        run: |
          set -e

          mkdir -p stock

          dd \
            if=boot.img \
            of=stock/kernel \
            bs=4096 \
            skip=1 \
            count=8645 \
            status=progress

          echo ""
          echo "Stock kernel:"
          ls -lh stock/kernel

      - name: Extract stock config
        run: |
          set -e

          wget -q \
            -O extract-ikconfig \
            "https://raw.githubusercontent.com/torvalds/linux/master/scripts/extract-ikconfig"

          chmod +x extract-ikconfig

          ./extract-ikconfig \
            stock/kernel \
            > stock.config \
            2>stock-config-error.txt \
            || true

          if [ ! -s stock.config ]; then
            echo "ERROR: stock.config extraction failed"
            cat stock-config-error.txt || true
            exit 1
          fi

          echo ""
          echo "Stock config:"
          wc -l stock.config

      - name: Prepare build output
        run: |
          set -e

          mkdir -p out

          cp stock.config out/.config

      - name: Setup KernelSU Next
        run: |
          set -e

          echo "========================================"
          echo "KERNELSU NEXT"
          echo "========================================"

          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" \
            | bash

      - name: Verify KernelSU Next
        run: |
          set -e

          echo "========================================"
          echo "VERIFY KERNELSU NEXT"
          echo "========================================"

          if [ ! -d drivers/kernelsu ]; then
            echo "ERROR: drivers/kernelsu was not created."
            exit 1
          fi

          echo "KernelSU directory:"
          ls -la drivers/kernelsu

          echo ""
          echo "KernelSU Kconfig:"
          grep -n \
            'drivers/kernelsu/Kconfig' \
            drivers/Kconfig \
            || true

          echo ""
          echo "KernelSU Makefile:"
          grep -n \
            'kernelsu' \
            drivers/Makefile \
            || true

      - name: Run olddefconfig
        run: |
          set -e

          echo "========================================"
          echo "OLDDEFCONFIG"
          echo "========================================"

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

      - name: Check KernelSU config
        run: |
          set -e

          echo "========================================"
          echo "KERNELSU CONFIG"
          echo "========================================"

          grep -E \
            '^CONFIG_KSU=' \
            out/.config \
            || true

          grep -E \
            '^CONFIG_KSU_SUSFS' \
            out/.config \
            || true

      - name: Prepare compiler
        run: |
          set -e

          clang --version
          ld.lld --version

      - name: Build kernel Image
        run: |
          set -e

          echo "========================================"
          echo "BUILD KERNEL"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image

      - name: Verify Image
        run: |
          set -e

          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"

          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "ERROR: Image not found."
            exit 1
          fi

          ls -lh \
            out/arch/arm64/boot/Image

          echo ""
          echo "SHA256:"
          sha256sum \
            out/arch/arm64/boot/Image

          echo ""
          file \
            out/arch/arm64/boot/Image

      - name: Create report
        run: |
          set -e

          mkdir -p report

          {
            echo "PAD 7 KERNELSU NEXT BUILD"
            echo "========================="
            echo ""
            echo "SOURCE COMMIT:"
            git rev-parse HEAD
            echo ""
            echo "KERNEL VERSION:"
            make -s kernelversion
            echo ""
            echo "KERNELSU:"
            grep -E '^CONFIG_KSU=' out/.config || true
            echo ""
            echo "STOCK CONFIG SHA256:"
            sha256sum stock.config
            echo ""
            echo "FINAL CONFIG SHA256:"
            sha256sum out/.config
            echo ""
            echo "IMAGE SHA256:"
            sha256sum out/arch/arm64/boot/Image
            echo ""
            echo "IMAGE:"
            ls -lh out/arch/arm64/boot/Image
          } | tee report/FINAL-REPORT.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pad7-kernelsu-next
          path: |
            out/arch/arm64/boot/Image
            out/.config
            stock.config
            report/FINAL-REPORT.txt
