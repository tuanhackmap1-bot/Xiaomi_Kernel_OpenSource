name: Step 5 - Extract Stock Config

on:
  workflow_dispatch:
  push:
    branches:
      - uke-v-oss

jobs:
  extract:
    runs-on: ubuntu-24.04

    steps:
      - name: Download stock boot
        run: |
          set -e
          wget -q --show-progress \
            -O boot.img \
            "https://github.com/tuanhackmap1-bot/Xiaomi_Kernel_OpenSource/releases/download/boot-analysis/boot.img"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            python3 \
            gzip \
            bzip2 \
            xz-utils \
            lz4 \
            zstd

      - name: Extract stock kernel
        run: |
          set -e
          mkdir -p analysis

          dd \
            if=boot.img \
            of=analysis/stock-kernel \
            bs=4096 \
            skip=1 \
            count=8641 \
            status=progress

          echo "Stock kernel:"
          stat -c%s analysis/stock-kernel
          file analysis/stock-kernel

      - name: Extract IKCONFIG
        run: |
          set -e

          wget -q \
            -O extract-ikconfig \
            "https://raw.githubusercontent.com/torvalds/linux/master/scripts/extract-ikconfig"

          chmod +x extract-ikconfig

          echo "Trying to extract stock config..."

          ./extract-ikconfig \
            analysis/stock-kernel \
            > analysis/stock.config \
            2> analysis/extract-error.txt || true

          echo ""
          echo "Config size:"
          stat -c%s analysis/stock.config

          echo ""
          echo "Config lines:"
          wc -l analysis/stock.config

          echo ""
          echo "First 30 lines:"
          head -30 analysis/stock.config || true

          echo ""
          echo "Extractor message:"
          cat analysis/extract-error.txt || true

      - name: Clone Google GKI 6.1.138
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch android14-6.1.138_r00 \
            "https://android.googlesource.com/kernel/common.git" \
            google-kernel

          cd google-kernel

          echo "Google commit:"
          git rev-parse HEAD

          echo "Google kernel:"
          make -s kernelversion

      - name: Save Google config
        run: |
          set -e

          cp \
            google-kernel/arch/arm64/configs/gki_defconfig \
            analysis/google-gki_defconfig

      - name: Normalize configs
        run: |
          set -e

          if [ -s analysis/stock.config ]; then
            grep '^CONFIG_' \
              analysis/stock.config \
              | sort \
              > analysis/stock.config.sorted
          else
            touch analysis/stock.config.sorted
          fi

          grep '^CONFIG_' \
            analysis/google-gki_defconfig \
            | sort \
            > analysis/google-gki.config.sorted

      - name: Create diff
        run: |
          set -e

          diff -u \
            analysis/google-gki.config.sorted \
            analysis/stock.config.sorted \
            > analysis/google-vs-stock.diff \
            || true

          echo "Diff created:"
          wc -l analysis/google-vs-stock.diff

      - name: Check important configs
        run: |
          set -e

          {
            echo "===== STOCK ====="

            if [ -s analysis/stock.config ]; then
              grep -E \
                '^CONFIG_(KALLSYMS|KALLSYMS_ALL|MODULES|DEBUG_INFO|DEBUG_INFO_BTF|BPF|SECURITY|SECURITYFS|SELINUX|PROC_FS)' \
                analysis/stock.config \
                || true
            else
              echo "STOCK CONFIG EMPTY"
            fi

            echo ""
            echo "===== GOOGLE GKI ====="

            grep -E \
              '^CONFIG_(KALLSYMS|KALLSYMS_ALL|MODULES|DEBUG_INFO|DEBUG_INFO_BTF|BPF|SECURITY|SECURITYFS|SELINUX|PROC_FS)' \
              analysis/google-gki_defconfig \
              || true

          } | tee analysis/important-configs.txt

      - name: Create report
        run: |
          set -e

          {
            echo "========================================"
            echo "PAD 7 STEP 5"
            echo "STOCK CONFIG VS GOOGLE GKI"
            echo "========================================"

            echo ""
            echo "STOCK KERNEL:"
            stat -c%s analysis/stock-kernel
            sha256sum analysis/stock-kernel

            echo ""
            echo "STOCK CONFIG SIZE:"
            stat -c%s analysis/stock.config

            echo ""
            echo "STOCK CONFIG LINES:"
            wc -l analysis/stock.config

            echo ""
            echo "GOOGLE GKI:"
            cd google-kernel
            git rev-parse HEAD
            make -s kernelversion
            cd ..

            echo ""
            echo "IMPORTANT CONFIGS:"
            cat analysis/important-configs.txt

            echo ""
            echo "DIFF:"
            cat analysis/google-vs-stock.diff

            echo ""
            echo "========================================"
            echo "STEP 5 COMPLETE"
            echo "========================================"

          } | tee analysis/FINAL-REPORT.txt

      - name: Upload Step 5
        uses: actions/upload-artifact@v4
        with:
          name: pad7-step5-stock-config
          path: analysis/
