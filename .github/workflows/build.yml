name: Analyze stock boot.img

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # CHECK BOOT.IMG
      # ============================================================

      - name: Check boot.img
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo "       STOCK BOOT.IMG ANALYSIS"
          echo "========================================"

          if [ ! -f boot.img ]; then
            echo ""
            echo "ERROR: boot.img NOT FOUND"
            echo ""
            echo "Put your stock boot.img in the repository root:"
            echo ""
            echo "boot.img"
            echo ""
            exit 1
          fi

          echo ""
          echo "boot.img found:"
          ls -lh boot.img

          echo ""
          echo "SHA256:"
          sha256sum boot.img


      # ============================================================
      # INSTALL TOOLS
      # ============================================================

      - name: Install analysis tools
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            file \
            binwalk \
            cpio \
            gzip \
            lz4 \
            xz-utils \
            zstd \
            python3 \
            python3-pip \
            unzip


      # ============================================================
      # FILE IDENTIFICATION
      # ============================================================

      - name: Identify boot.img
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo "       FILE IDENTIFICATION"
          echo "========================================"

          file boot.img

          echo ""
          echo "First 256 bytes:"
          xxd -l 256 boot.img || true


      # ============================================================
      # BOOT HEADER
      # ============================================================

      - name: Analyze Android boot header
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo "       ANDROID BOOT HEADER"
          echo "========================================"

          python3 - <<'PY'
          import struct

          f = open("boot.img", "rb")
          data = f.read(4096)
          f.close()

          print("Magic:", data[0:8])

          if data[0:8] != b"ANDROID!":
              print("WARNING: Android boot magic not found")
              raise SystemExit(0)

          kernel_size = struct.unpack_from("<I", data, 8)[0]
          ramdisk_size = struct.unpack_from("<I", data, 16)[0]
          second_size = struct.unpack_from("<I", data, 24)[0]
          header_version = struct.unpack_from("<I", data, 40)[0]

          print("Kernel size :", kernel_size)
          print("Ramdisk size:", ramdisk_size)
          print("Second size :", second_size)
          print("Header ver. :", header_version)

          if header_version >= 3:
              os_version = struct.unpack_from("<I", data, 44)[0]
              print("OS version field:", hex(os_version))
          PY


      # ============================================================
      # SEARCH KERNEL STRING
      # ============================================================

      - name: Search kernel strings
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo "       KERNEL STRING SEARCH"
          echo "========================================"

          strings -a boot.img \
            | grep -E \
            'Linux version|6\.1\.|android14|g0c3d559bcd85|clang|LLVM|Xiaomi|xiaomi|uke' \
            | head -200 \
            || true


      # ============================================================
      # EXTRACT POSSIBLE KERNEL
      # ============================================================

      - name: Extract kernel payload
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          mkdir -p analysis

          echo "========================================"
          echo "       SEARCH KERNEL PAYLOAD"
          echo "========================================"

          binwalk boot.img || true

          echo ""
          echo "Searching for compressed kernel signatures..."

          binwalk -R $'\x1f\x8b\x08' boot.img || true
          binwalk -R $'\x28\xb5\x2f\xfd' boot.img || true
          binwalk -R $'\x02\x21\x4c\x18' boot.img || true


      # ============================================================
      # KERNEL BINARY STRING REPORT
      # ============================================================

      - name: Generate kernel report
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo "       KERNEL REPORT"
          echo "========================================"

          {
            echo "STOCK BOOT IMAGE"
            echo "================"
            echo ""

            echo "File:"
            ls -lh boot.img

            echo ""
            echo "SHA256:"
            sha256sum boot.img

            echo ""
            echo "Kernel strings:"
            strings -a boot.img \
              | grep -E \
              'Linux version|6\.1\.|android14|g0c3d559bcd85|clang|LLVM|Xiaomi|xiaomi|uke' \
              | head -200 \
              || true

            echo ""
            echo "Potential symbols:"
            strings -a boot.img \
              | grep -E \
              'kallsyms|CONFIG_|BTF|VMLINUX|__VMLINUX_SYMBOL' \
              | head -200 \
              || true

          } | tee analysis/kernel-report.txt


      # ============================================================
      # SEARCH KALLSYMS / BTF
      # ============================================================

      - name: Check kallsyms and BTF
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo "       KALLSYMS / BTF CHECK"
          echo "========================================"

          echo ""
          echo "kallsyms strings:"
          strings -a boot.img \
            | grep -Ei 'kallsyms|kallsyms_lookup_name|kallsyms_on_each_symbol' \
            | head -100 \
            || true

          echo ""
          echo "BTF strings:"
          strings -a boot.img \
            | grep -Ei 'BTF|BTF_MAGIC|__BTF' \
            | head -100 \
            || true

          {
            echo "=== KALLSYMS ==="
            strings -a boot.img \
              | grep -Ei 'kallsyms|kallsyms_lookup_name|kallsyms_on_each_symbol' \
              || true

            echo ""
            echo "=== BTF ==="
            strings -a boot.img \
              | grep -Ei 'BTF|BTF_MAGIC|__BTF' \
              || true
          } > analysis/symbol-report.txt


      # ============================================================
      # FINAL REPORT
      # ============================================================

      - name: Final analysis
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          echo ""
          echo "========================================"
          echo "       ANALYSIS COMPLETE"
          echo "========================================"

          echo ""
          echo "Reports:"
          find analysis -type f -maxdepth 2 -print

          echo ""
          echo "Kernel report:"
          cat analysis/kernel-report.txt

          echo ""
          echo "Symbol report:"
          cat analysis/symbol-report.txt


      # ============================================================
      # UPLOAD REPORT
      # ============================================================

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: boot-img-analysis
          path: |
            analysis/
