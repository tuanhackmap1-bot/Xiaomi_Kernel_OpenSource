name: Step 7 - GKI 6.1.138 + KernelSU + SUSFS

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout GKI 6.1.138
        uses: actions/checkout@v4
        with:
          repository: android/kernel_common
          ref: android14-6.1.138_r00
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            flex \
            git \
            libdw-dev \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            pahole \
            python3 \
            rsync

      - name: Verify GKI
        run: |
          set -e

          echo "========================================"
          echo "GKI VERSION"
          echo "========================================"

          echo "Commit:"
          git rev-parse HEAD

          echo ""
          echo "Kernel version:"
          make -s kernelversion

          test "$(make -s kernelversion)" = "6.1.138"

      - name: Clone SUSFS stable branch
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch gki-android14-6.1 \
            https://github.com/deepongi-labs/susfs4ksu.git \
            susfs

          echo "SUSFS commit:"
          git -C susfs rev-parse HEAD

      - name: Clone KernelSU release
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch v3.2.4 \
            https://github.com/tiann/KernelSU.git \
            KernelSU

          echo "KernelSU commit:"
          git -C KernelSU rev-parse HEAD

      - name: Check SUSFS patch compatibility
        run: |
          set -e

          echo "========================================"
          echo "CHECK KSU / SUSFS COMPATIBILITY"
          echo "========================================"

          test -f \
            susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

          test -f \
            susfs/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch

          echo ""
          echo "Testing KernelSU patch..."

          cd KernelSU

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          cp \
            ../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch \
            .

          patch \
            --dry-run \
            -p1 \
            < 10_enable_susfs_for_ksu.patch

          echo ""
          echo "KernelSU SUSFS patch compatibility: OK"

      - name: Integrate KernelSU
        run: |
          set -e

          ./KernelSU/kernel/setup.sh

      - name: Apply SUSFS KernelSU patch
        run: |
          set -e

          cd KernelSU

          patch \
            -p1 \
            < 10_enable_susfs_for_ksu.patch

      - name: Install SUSFS kernel files
        run: |
          set -e

          cp \
            susfs/kernel_patches/fs/susfs.c \
            fs/susfs.c

          cp \
            susfs/kernel_patches/include/linux/susfs.h \
            include/linux/susfs.h

      - name: Apply SUSFS GKI 6.1 patch
        run: |
          set -e

          cp \
            susfs/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch \
            .

          patch \
            --dry-run \
            -p1 \
            < 50_add_susfs_in_gki-android14-6.1.patch

          patch \
            -p1 \
            < 50_add_susfs_in_gki-android14-6.1.patch

      - name: Remove GKI protected exports
        run: |
          set -e

          rm -f \
            android/abi_gki_protected_exports_aarch64 \
            android/abi_gki_protected_exports_x86_64

      - name: Verify SUSFS integration
        run: |
          set -e

          echo "========================================"
          echo "VERIFY SUSFS"
          echo "========================================"

          test -f fs/susfs.c
          test -f include/linux/susfs.h
          test -f KernelSU/kernel/Kconfig

          echo ""
          echo "SUSFS files:"
          ls -lh \
            fs/susfs.c \
            include/linux/susfs.h

          echo ""
          echo "KernelSU SUSFS symbols:"
          grep -Rni \
            "CONFIG_KSU_SUSFS" \
            KernelSU/kernel \
            | head -20

          echo ""
          echo "SUSFS integration completed."

      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: gki-6.1.138-kernelsu-susfs-source
          path: |
            KernelSU/
            fs/susfs.c
            include/linux/susfs.h
            android/
