name: Build Xiaomi Pad 7 Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout Xiaomi UKE source
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: 5712080a4b0c0b1a879e6d145c601c649ddaddfd
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            cpio \
            flex \
            libdw-dev \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd

      - name: Show source information
        run: |
          set -e

          echo "========================================"
          echo "XIAOMI UKE SOURCE"
          echo "========================================"

          echo ""
          echo "Commit:"
          git rev-parse HEAD

          echo ""
          echo "Kernel version:"
          make -s kernelversion

          echo ""
          grep -E '^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION' Makefile

          echo ""
          echo "Required stock target:"
          echo "Xiaomi Pad 7"

      - name: Check missing HWID source
        run: |
          set -e

          echo "========================================"
          echo "CHECK HWID"
          echo "========================================"

          if [ -d drivers/misc/hwid ]; then
            echo "HWID source exists."
          else
            echo "HWID source is missing."

            if grep -n 'drivers/misc/hwid/Kconfig' drivers/misc/Kconfig; then
              cp drivers/misc/Kconfig drivers/misc/Kconfig.before-hwid

              sed -i \
                '/source "drivers\/misc\/hwid\/Kconfig"/d' \
                drivers/misc/Kconfig

              echo "Removed missing HWID Kconfig reference."
            fi
          fi

          echo ""
          echo "Remaining HWID reference:"
          grep -n 'drivers/misc/hwid/Kconfig' drivers/misc/Kconfig || true

      - name: Download stock boot.img
        run: |
          set -e

          wget -q --show-progress \
            -O boot.img \
            "https://github.com/tuanhackmap1-bot/Xiaomi_Kernel_OpenSource/releases/download/boot-analysis/boot.img"

          echo ""
          echo "boot.img size:"
          stat -c%s boot.img

          echo ""
          echo "boot.img sha256:"
          sha256sum boot.img

      - name: Extract stock kernel
        run: |
          set -e

          mkdir -p stock

          dd \
            if=boot.img \
            of=stock/kernel \
            bs=4096 \
            skip=1 \
            count=8645 \
            status=progress

          echo ""
          echo "Stock kernel:"
          file stock/kernel

          echo ""
          echo "Stock kernel size:"
          stat -c%s stock/kernel

      - name: Extract stock config
        run: |
          set -e

          wget -q \
            -O extract-ikconfig \
            "https://raw.githubusercontent.com/torvalds/linux/master/scripts/extract-ikconfig"

          chmod +x extract-ikconfig

          ./extract-ikconfig \
            stock/kernel \
            > stock.config

          test -s stock.config

          echo "Stock config:"
          wc -l stock.config

          echo ""
          echo "Stock config kernel version:"
          grep -E '^CONFIG_LOCALVERSION=' stock.config || true

      - name: Save stock config
        run: |
          set -e

          mkdir -p arch/arm64/configs

          cp stock.config \
            arch/arm64/configs/stock_pad7_defconfig

          echo "Saved stock config."

      - name: Inspect ABI and KMI setup
        run: |
          set -e

          echo "========================================"
          echo "ABI / KMI SETUP"
          echo "========================================"

          echo ""
          echo "Existing ABI files:"
          find . \
            -type f \
            \( \
              -name 'abi_symbollist.raw' \
              -o -name 'abi_symbollist*' \
              -o -name '*symbollist*' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | head -200

          echo ""
          echo "ABI references in source:"
          grep -Rni \
            -E 'abi_symbollist|symbollist|TRIM_UNUSED_KSYMS|UNUSED_KSYMS_WHITELIST' \
            Makefile \
            scripts \
            kernel \
            arch \
            2>/dev/null \
            | head -200 \
            || true

      - name: Prepare build directory
        run: |
          set -e

          mkdir -p out

          cp stock.config \
            out/.config

          echo "Running olddefconfig..."

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo ""
          echo "Config generated successfully."

      - name: Verify generated config
        run: |
          set -e

          echo "========================================"
          echo "CONFIG CHECK"
          echo "========================================"

          grep '^CONFIG_ARM64=' out/.config || true
          grep '^CONFIG_MODULES=' out/.config || true
          grep '^CONFIG_KALLSYMS=' out/.config || true
          grep '^CONFIG_KALLSYMS_ALL=' out/.config || true
          grep '^CONFIG_TRIM_UNUSED_KSYMS=' out/.config || true
          grep '^CONFIG_UNUSED_KSYMS_WHITELIST=' out/.config || true

      - name: Verify ABI whitelist before build
        run: |
          set -e

          echo "========================================"
          echo "ABI WHITELIST CHECK"
          echo "========================================"

          if [ -f abi_symbollist.raw ]; then
            echo "abi_symbollist.raw exists at source root."
          elif [ -f out/abi_symbollist.raw ]; then
            echo "out/abi_symbollist.raw exists."
          else
            echo "No abi_symbollist.raw currently exists."
          fi

          echo ""
          echo "Searching generated files:"
          find out \
            -type f \
            \( \
              -name 'abi_symbollist.raw' \
              -o -name '*symbollist*' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            || true

      - name: Build kernel
        run: |
          set -e

          echo "========================================"
          echo "BUILD KERNEL"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image

      - name: Verify Image
        run: |
          set -e

          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"

          test -f out/arch/arm64/boot/Image

          echo ""
          echo "Image:"
          ls -lh out/arch/arm64/boot/Image

          echo ""
          echo "SHA256:"
          sha256sum out/arch/arm64/boot/Image

          echo ""
          echo "File:"
          file out/arch/arm64/boot/Image

      - name: Create report
        if: always()
        run: |
          set +e

          mkdir -p report

          {
            echo "XIAOMI PAD 7 KERNEL BUILD REPORT"
            echo "================================"
            echo ""
            echo "SOURCE COMMIT:"
            git rev-parse HEAD
            echo ""
            echo "SOURCE KERNEL VERSION:"
            make -s kernelversion
            echo ""
            echo "STOCK CONFIG:"
            sha256sum stock.config 2>/dev/null || true
            echo ""
            echo "FINAL CONFIG:"
            sha256sum out/.config 2>/dev/null || true
            echo ""
            echo "IMAGE:"
            ls -lh out/arch/arm64/boot/Image 2>/dev/null || true
            sha256sum out/arch/arm64/boot/Image 2>/dev/null || true
          } | tee report/build-report.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pad7-kernel-build
          path: |
            out/arch/arm64/boot/Image
            out/.config
            stock.config
            report/build-report.txt
