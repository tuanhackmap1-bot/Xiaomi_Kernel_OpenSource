name: Step 3 GKI 6.1.138

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - uke-v-oss

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - name: Download stock boot
        run: |
          wget -O boot.img "https://github.com/tuanhackmap1-bot/Xiaomi_Kernel_OpenSource/releases/download/boot-analysis/boot.img"
          sha256sum boot.img

      - name: Extract stock kernel
        run: |
          mkdir -p analysis
          dd if=boot.img of=analysis/kernel.img bs=4096 skip=1 count=8641
          stat -c%s analysis/kernel.img
          file analysis/kernel.img

      - name: Check stock version
        run: |
          strings -a analysis/kernel.img | grep -E "6.1.138|g0c3d559bcd85" | head -50 || true

      - name: Clone Google GKI
        run: |
          git clone --depth=1 --branch android14-6.1.138_r00 "https://android.googlesource.com/kernel/common.git" google-kernel
          cd google-kernel
          echo "GOOGLE COMMIT:"
          git rev-parse HEAD
          echo "GOOGLE VERSION:"
          make -s kernelversion

      - name: Compare config
        run: |
          echo "=== GOOGLE GKI CONFIG ==="
          if [ -f google-kernel/arch/arm64/configs/gki_defconfig ]; then
            grep -E "^CONFIG_(KALLSYMS|DEBUG_INFO|MODULES|BPF|SECURITY|PROC_FS)" google-kernel/arch/arm64/configs/gki_defconfig || true
            cp google-kernel/arch/arm64/configs/gki_defconfig analysis/google-gki_defconfig
          else
            echo "gki_defconfig NOT FOUND"
          fi

          echo ""
          echo "=== STOCK CONFIG STRINGS ==="
          strings -a analysis/kernel.img | grep -E "^CONFIG_[A-Z0-9_]+=" | sort -u | head -500 > analysis/stock-config.txt || true
          cat analysis/stock-config.txt || true

      - name: Create report
        run: |
          {
            echo "PAD 7 STOCK VS GOOGLE GKI 6.1.138"
            echo "========================================"
            echo ""
            echo "BOOT SHA256:"
            sha256sum boot.img
            echo ""
            echo "STOCK KERNEL SIZE:"
            stat -c%s analysis/kernel.img
            echo ""
            echo "STOCK VERSION:"
            cat analysis/stock-version.txt 2>/dev/null || true
            strings -a analysis/kernel.img | grep -E "6.1.138|g0c3d559bcd85" | head -50 || true
            echo ""
            echo "GOOGLE COMMIT:"
            cd google-kernel
            git rev-parse HEAD
            echo ""
            echo "GOOGLE VERSION:"
            make -s kernelversion
            echo ""
            echo "GOOGLE TAG:"
            git describe --tags --always
            echo ""
            echo "STEP 3 COMPLETE"
          } | tee analysis/FINAL-REPORT.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: pad7-step3-analysis
          path: analysis/
