name: Build Xiaomi Pad 7 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: uke-v-oss
          fetch-depth: 1


      # ============================================================
      # SHOW SOURCE
      # ============================================================

      - name: Check kernel source
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo "       XIAOMI PAD 7 KERNEL"
          echo "========================================"

          echo "Commit:"
          git log -1 --oneline

          echo ""
          echo "Kernel version:"
          make -s kernelversion

          echo ""
          echo "Repository:"
          git remote -v

          echo ""
          echo "Source check complete"


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          set -e

          sudo add-apt-repository universe
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            git \
            lld \
            llvm \
            libelf-dev \
            libssl-dev \
            pahole \
            pkg-config \
            python3 \
            rsync \
            unzip \
            zip


      # ============================================================
      # TOOLCHAIN
      # ============================================================

      - name: Check LLVM toolchain
        run: |
          set -e

          echo "========================================"
          echo "       LLVM TOOLCHAIN"
          echo "========================================"

          clang --version
          echo ""
          ld.lld --version


      # ============================================================
      # FIND DEFCONFIG
      # ============================================================

      - name: Inspect kernel configs
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo "       KERNEL CONFIGS"
          echo "========================================"

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -name "*defconfig" \
            -print | sort

          echo ""
          echo "Checking GKI defconfig..."

          test -f arch/arm64/configs/gki_defconfig

          echo "gki_defconfig FOUND"


      # ============================================================
      # CONFIGURE
      # ============================================================

      - name: Configure kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo "       CONFIGURE KERNEL"
          echo "========================================"

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            gki_defconfig

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo ""
          echo "Kernel version:"
          make \
            O=out \
            ARCH=arm64 \
            kernelversion

          echo ""
          echo "Config generated:"
          test -f out/.config

          echo "CONFIG OK"


      # ============================================================
      # BUILD KERNEL IMAGE
      # ============================================================

      - name: Build kernel Image
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo "       BUILD KERNEL IMAGE"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            Image

          echo ""
          echo "========================================"
          echo "       VERIFY IMAGE"
          echo "========================================"

          IMAGE="out/arch/arm64/boot/Image"

          test -f "$IMAGE"

          ls -lh "$IMAGE"

          echo ""
          echo "IMAGE BUILD SUCCESS"


      # ============================================================
      # BUILD DTBS
      # ============================================================

      - name: Build DTBs
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo "       BUILD DTBS"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            dtbs

          echo ""
          echo "DTBS BUILD SUCCESS"


      # ============================================================
      # SHOW RESULT
      # ============================================================

      - name: Show build result
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo "       BUILD RESULT"
          echo "========================================"

          echo ""
          echo "=== KERNEL VERSION ==="

          make \
            O=out \
            ARCH=arm64 \
            kernelversion

          echo ""
          echo "=== IMAGE ==="

          ls -lh \
            out/arch/arm64/boot/Image

          echo ""
          echo "=== DTB FILES ==="

          find out/arch/arm64/boot/dts \
            -type f \
            -name "*.dtb" \
            -print | head -100 || true

          echo ""
          echo "========================================"
          echo "       BUILD COMPLETED"
          echo "========================================"


      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-pad7-kernel
          if-no-files-found: warn
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/**/*.dtb
            out/arch/arm64/boot/dts/**/*.dtbo
