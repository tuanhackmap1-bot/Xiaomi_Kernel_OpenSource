name: GKI 6.1.138 KernelSU Next SUSFS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. ANDROID COMMON 6.1
      # ============================================================
      - name: Checkout Android Common
        uses: actions/checkout@v4
        with:
          repository: android/kernel_common
          ref: android14-6.1-2025-06
          fetch-depth: 1

      # ============================================================
      # 2. DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            cpio \
            curl \
            flex \
            git \
            lld \
            llvm \
            libelf-dev \
            libssl-dev \
            pahole \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd

      # ============================================================
      # 3. VERIFY KERNEL
      # ============================================================
      - name: Verify kernel 6.1.138
        run: |
          set -eux

          VERSION="$(make -s kernelversion)"

          echo "========================================"
          echo "KERNEL VERSION"
          echo "========================================"

          echo "$VERSION"

          test "$VERSION" = "6.1.138"

      # ============================================================
      # 4. KERNELSU NEXT
      # ============================================================
      - name: Install KernelSU Next
        run: |
          set -eux

          echo "========================================"
          echo "KERNELSU NEXT"
          echo "========================================"

          curl -LSs \
            "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" \
            | bash -

          test -d KernelSU-Next

          echo "KernelSU Next installed."

      # ============================================================
      # 5. SUSFS
      #
      # IMPORTANT:
      # Use a real SUSFS repository with the GKI 6.1 branch.
      # ============================================================
      - name: Clone SUSFS GKI 6.1
        run: |
          set -eux

          echo "========================================"
          echo "SUSFS"
          echo "========================================"

          rm -rf susfs

          git clone \
            --depth=1 \
            --branch gki-android14-6.1 \
            https://github.com/deepongi-labs/susfs4ksu.git \
            susfs

          echo ""
          echo "SUSFS commit:"
          git -C susfs rev-parse HEAD

          echo ""
          echo "SUSFS patch files:"
          find susfs/kernel_patches \
            -type f \
            -name '*.patch' \
            -print \
            | sort

      # ============================================================
      # 6. FIND CORRECT KERNEL PATCH
      # ============================================================
      - name: Find SUSFS 6.1 patch
        run: |
          set -eux

          echo "========================================"
          echo "FIND SUSFS PATCH"
          echo "========================================"

          PATCH=""

          for p in \
            susfs/kernel_patches/50_add_susfs_in_kernel-6.1.patch \
            susfs/kernel_patches/50_add_susfs_in_kernel-6.1.138.patch
          do
            if [ -f "$p" ]; then
              PATCH="$p"
              break
            fi
          done

          if [ -z "$PATCH" ]; then
            PATCH="$(find susfs/kernel_patches \
              -type f \
              -name '50_add_susfs_in_kernel-*.patch' \
              | sort \
              | head -1 || true)"
          fi

          if [ -z "$PATCH" ]; then
            echo ""
            echo "ERROR: No SUSFS kernel patch exists in this"
            echo "SUSFS branch."
            echo ""
            echo "Available patch files:"
            find susfs/kernel_patches \
              -type f \
              -name '*.patch' \
              -print \
              | sort

            exit 1
          fi

          echo "Using SUSFS kernel patch:"
          echo "$PATCH"

          cp "$PATCH" susfs-kernel.patch

      # ============================================================
      # 7. COPY SUSFS SOURCE
      # ============================================================
      - name: Copy SUSFS source
        run: |
          set -eux

          echo "========================================"
          echo "COPY SUSFS SOURCE"
          echo "========================================"

          if [ -d susfs/kernel_patches/fs ]; then
            cp -av \
              susfs/kernel_patches/fs/* \
              fs/
          fi

          if [ -d susfs/kernel_patches/include/linux ]; then
            cp -av \
              susfs/kernel_patches/include/linux/* \
              include/linux/
          fi

      # ============================================================
      # 8. PATCH KERNELSU
      # ============================================================
      - name: Patch KernelSU for SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "PATCH KERNELSU"
          echo "========================================"

          KSU_PATCH="susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          if [ ! -f "$KSU_PATCH" ]; then
            echo ""
            echo "ERROR: KernelSU SUSFS patch missing:"
            echo "$KSU_PATCH"
            echo ""
            find susfs/kernel_patches/KernelSU \
              -type f \
              -print \
              | sort
            exit 1
          fi

          cp "$KSU_PATCH" KernelSU-Next/

          cd KernelSU-Next

          patch \
            -p1 \
            < 10_enable_susfs_for_ksu.patch

      # ============================================================
      # 9. PATCH KERNEL
      # ============================================================
      - name: Patch kernel with SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "PATCH KERNEL"
          echo "========================================"

          patch \
            -p1 \
            < susfs-kernel.patch

      # ============================================================
      # 10. VERIFY SUSFS
      # ============================================================
      - name: Verify SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "VERIFY SUSFS"
          echo "========================================"

          echo ""
          echo "SUSFS source:"

          find fs \
            include/linux \
            -type f \
            \( \
              -name 'susfs.c' \
              -o \
              -name 'susfs.h' \
            \) \
            -print

          echo ""
          echo "SUSFS Kconfig:"

          grep -R \
            -n \
            'CONFIG_KSU_SUSFS' \
            KernelSU-Next \
            fs \
            include \
            2>/dev/null \
            | head -50 \
            || true

      # ============================================================
      # 11. PREPARE GKI CONFIG
      # ============================================================
      - name: Prepare GKI config
        run: |
          set -eux

          echo "========================================"
          echo "GKI CONFIG"
          echo "========================================"

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            gki_defconfig

      # ============================================================
      # 12. ENABLE KSU + SUSFS
      # ============================================================
      - name: Enable KernelSU SUSFS config
        run: |
          set -eux

          echo "========================================"
          echo "KSU SUSFS CONFIG"
          echo "========================================"

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU_SUSFS

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo ""
          echo "KernelSU:"
          grep '^CONFIG_KSU=' out/.config

          echo ""
          echo "SUSFS:"
          grep '^CONFIG_KSU_SUSFS=' out/.config

      # ============================================================
      # 13. REMOVE GKI PROTECTED EXPORTS
      # ============================================================
      - name: Prepare GKI exports
        run: |
          set -eux

          rm -f \
            android/abi_gki_protected_exports_aarch64 \
            android/abi_gki_protected_exports_x86_64 \
            || true

      # ============================================================
      # 14. BUILD
      # ============================================================
      - name: Build Image
        run: |
          set -eux

          echo "========================================"
          echo "BUILD"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image

      # ============================================================
      # 15. VERIFY
      # ============================================================
      - name: Verify Image
        run: |
          set -eux

          IMAGE="out/arch/arm64/boot/Image"

          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"

          test -f "$IMAGE"

          echo ""
          ls -lh "$IMAGE"

          echo ""
          sha256sum "$IMAGE"

          echo ""
          file "$IMAGE"

      # ============================================================
      # 16. REPORT
      # ============================================================
      - name: Create report
        run: |
          set -eux

          mkdir -p report

          {
            echo "========================================"
            echo "GKI 6.1.138"
            echo "KERNELSU NEXT"
            echo "SUSFS"
            echo "========================================"
            echo ""
            echo "KERNEL:"
            make -s kernelversion
            echo ""
            echo "SOURCE:"
            git rev-parse HEAD
            echo ""
            echo "KSU:"
            grep '^CONFIG_KSU=' out/.config || true
            echo ""
            echo "SUSFS:"
            grep '^CONFIG_KSU_SUSFS=' out/.config || true
            echo ""
            echo "IMAGE:"
            ls -lh out/arch/arm64/boot/Image
            echo ""
            echo "SHA256:"
            sha256sum out/arch/arm64/boot/Image
          } | tee report/FINAL-REPORT.txt

      # ============================================================
      # 17. ARTIFACT
      # ============================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gki-6.1.138-kernelsu-next-susfs
          path: |
            out/arch/arm64/boot/Image
            out/.config
            report/FINAL-REPORT.txt
