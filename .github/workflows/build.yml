name: Compare Google GKI 6.1.138

on:
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-24.04

    steps:
      - name: Check Google GKI tag
        run: |
          set -e

          echo "========================================"
          echo "GOOGLE GKI 6.1.138"
          echo "========================================"

          git ls-remote \
            https://android.googlesource.com/kernel/common.git \
            refs/tags/android14-6.1.138_r00

      - name: Clone Google kernel
        run: |
          set -e

          echo "========================================"
          echo "CLONE GOOGLE KERNEL"
          echo "========================================"

          git clone \
            --depth=1 \
            --branch android14-6.1.138_r00 \
            https://android.googlesource.com/kernel/common.git \
            google-kernel

          cd google-kernel

          echo ""
          echo "Commit:"
          git log -1 --oneline

          echo ""
          echo "Commit SHA:"
          git rev-parse HEAD

          echo ""
          echo "Kernel version:"
          make -s kernelversion

      - name: Inspect Google tree
        run: |
          set -e

          cd google-kernel

          echo "========================================"
          echo "GOOGLE TREE"
          echo "========================================"

          echo ""
          echo "Tag:"
          git describe --tags --always

          echo ""
          echo "Kernel version:"
          make -s kernelversion

          echo ""
          echo "ARM64 configs:"
          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            | sort \
            | grep -E 'gki|defconfig' \
            | head -100 || true

          echo ""
          echo "Build configs:"
          find . \
            -maxdepth 3 \
            -name 'build.config*' \
            | sort \
            | head -100 || true

      - name: Check GKI config
        run: |
          set -e

          cd google-kernel

          echo "========================================"
          echo "GKI CONFIG"
          echo "========================================"

          if [ -f arch/arm64/configs/gki_defconfig ]; then
            echo ""
            echo "KALLSYMS:"
            grep -E '^CONFIG_KALLSYMS' \
              arch/arm64/configs/gki_defconfig || true

            echo ""
            echo "DEBUG INFO:"
            grep -E '^CONFIG_DEBUG_INFO' \
              arch/arm64/configs/gki_defconfig || true

            echo ""
            echo "MODULES:"
            grep -E '^CONFIG_MODULES' \
              arch/arm64/configs/gki_defconfig || true
          else
            echo "gki_defconfig not found"
          fi

      - name: Check kernel source symbols
        run: |
          set -e

          cd google-kernel

          echo "========================================"
          echo "KERNEL SOURCE SYMBOLS"
          echo "========================================"

          echo ""
          echo "kallsyms:"
          grep -R \
            -E 'kallsyms_lookup_name|kallsyms_on_each_symbol' \
            kernel include \
            2>/dev/null \
            | head -100 || true

          echo ""
          echo "securityfs:"
          grep -R \
            -E 'securityfs|security_inode' \
            fs security include \
            2>/dev/null \
            | head -100 || true

          echo ""
          echo "proc:"
          grep -R \
            -E 'proc_create|proc_remove' \
            fs include \
            2>/dev/null \
            | head -100 || true

      - name: Create report
        run: |
          set -e

          mkdir -p analysis

          echo "========================================" > analysis/google-gki-report.txt
          echo "GOOGLE ANDROID 14 GKI 6.1.138" >> analysis/google-gki-report.txt
          echo "========================================" >> analysis/google-gki-report.txt

          echo "" >> analysis/google-gki-report.txt
          echo "REMOTE TAG:" >> analysis/google-gki-report.txt

          git ls-remote \
            https://android.googlesource.com/kernel/common.git \
            refs/tags/android14-6.1.138_r00 \
            >> analysis/google-gki-report.txt

          cd google-kernel

          echo "" >> ../analysis/google-gki-report.txt
          echo "LOCAL COMMIT:" >> ../analysis/google-gki-report.txt
          git rev-parse HEAD >> ../analysis/google-gki-report.txt

          echo "" >> ../analysis/google-gki-report.txt
          echo "DESCRIPTION:" >> ../analysis/google-gki-report.txt
          git log -1 --oneline >> ../analysis/google-gki-report.txt

          echo "" >> ../analysis/google-gki-report.txt
          echo "KERNEL VERSION:" >> ../analysis/google-gki-report.txt
          make -s kernelversion >> ../analysis/google-gki-report.txt

          echo "" >> ../analysis/google-gki-report.txt
          echo "TAG:" >> ../analysis/google-gki-report.txt
          git describe --tags --always >> ../analysis/google-gki-report.txt

          echo "" >> ../analysis/google-gki-report.txt
          echo "GKI KALLSYMS CONFIG:" >> ../analysis/google-gki-report.txt
          grep -E '^CONFIG_KALLSYMS' \
            arch/arm64/configs/gki_defconfig \
            >> ../analysis/google-gki-report.txt || true

          echo "" >> ../analysis/google-gki-report.txt
          echo "GKI DEBUG INFO CONFIG:" >> ../analysis/google-gki-report.txt
          grep -E '^CONFIG_DEBUG_INFO' \
            arch/arm64/configs/gki_defconfig \
            >> ../analysis/google-gki-report.txt || true

          echo "" >> ../analysis/google-gki-report.txt
          echo "GKI MODULE CONFIG:" >> ../analysis/google-gki-report.txt
          grep -E '^CONFIG_MODULES' \
            arch/arm64/configs/gki_defconfig \
            >> ../analysis/google-gki-report.txt || true

          echo "" >> ../analysis/google-gki-report.txt
          echo "REPORT COMPLETE" >> ../analysis/google-gki-report.txt

          cd ..

          echo ""
          cat analysis/google-gki-report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: google-gki-6.1.138-report
          path: analysis/google-gki-report.txt
