name: Pad 7 - GKI 6.1.138 - KernelSU Next - SUSFS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # 1. ANDROID COMMON 6.1.138
      # ==========================================================
      - name: Checkout Android Common 6.1.138
        uses: actions/checkout@v4
        with:
          repository: android/kernel_common
          ref: android14-6.1-2025-06
          fetch-depth: 1

      # ==========================================================
      # 2. DEPENDENCIES
      # ==========================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            cpio \
            curl \
            flex \
            git \
            lld \
            llvm \
            libelf-dev \
            libssl-dev \
            pahole \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd

      # ==========================================================
      # 3. VERIFY KERNEL
      # ==========================================================
      - name: Verify kernel version
        run: |
          set -eux

          echo "========================================"
          echo "KERNEL VERSION"
          echo "========================================"

          VERSION="$(make -s kernelversion)"

          echo "Detected: $VERSION"

          if [ "$VERSION" != "6.1.138" ]; then
            echo ""
            echo "ERROR: WRONG KERNEL"
            echo "Expected: 6.1.138"
            echo "Detected: $VERSION"
            exit 1
          fi

          echo ""
          echo "6.1.138 OK."

      # ==========================================================
      # 4. DOWNLOAD SUSFS - CORRECT BRANCH
      # ==========================================================
      - name: Download SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "DOWNLOAD SUSFS"
          echo "========================================"

          rm -rf susfs4ksu

          git clone \
            --depth=1 \
            --branch gki-android14-6.1 \
            https://github.com/deepongi-labs/susfs4ksu.git \
            susfs4ksu

          echo ""
          echo "SUSFS downloaded."

          echo ""
          echo "Available kernel patches:"
          find susfs4ksu/kernel_patches \
            -maxdepth 1 \
            -type f \
            -name '*.patch' \
            -print \
            | sort

      # ==========================================================
      # 5. VERIFY REQUIRED SUSFS PATCH
      # ==========================================================
      - name: Verify SUSFS patch
        run: |
          set -eux

          echo "========================================"
          echo "VERIFY SUSFS PATCH"
          echo "========================================"

          PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1_GKI.patch"

          if [ ! -f "$PATCH" ]; then
            echo ""
            echo "ERROR: Required GKI SUSFS patch not found:"
            echo "$PATCH"
            echo ""
            echo "Available patches:"
            find susfs4ksu/kernel_patches \
              -maxdepth 1 \
              -type f \
              -name '*.patch' \
              -print \
              | sort
            exit 1
          fi

          echo "Patch found:"
          echo "$PATCH"

      # ==========================================================
      # 6. INSTALL KERNELSU NEXT
      # ==========================================================
      - name: Install KernelSU Next
        run: |
          set -eux

          echo "========================================"
          echo "KERNELSU NEXT"
          echo "========================================"

          curl -LSs \
            "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/next-susfs/kernel/setup.sh" \
            | bash -s next-susfs

          test -d KernelSU-Next/kernel

          echo ""
          echo "KernelSU Next installed."

      # ==========================================================
      # 7. COPY SUSFS FILES
      # ==========================================================
      - name: Copy SUSFS files
        run: |
          set -eux

          echo "========================================"
          echo "COPY SUSFS"
          echo "========================================"

          cp -v \
            susfs4ksu/kernel_patches/fs/* \
            fs/

          cp -v \
            susfs4ksu/kernel_patches/include/linux/* \
            include/linux/

          echo ""
          echo "SUSFS files copied."

      # ==========================================================
      # 8. PATCH KERNELSU
      # ==========================================================
      - name: Patch KernelSU Next
        run: |
          set -eux

          echo "========================================"
          echo "PATCH KERNELSU"
          echo "========================================"

          cp \
            susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch \
            KernelSU-Next/kernel/

          cd KernelSU-Next/kernel

          patch \
            -p1 \
            < 10_enable_susfs_for_ksu.patch

          cd "$GITHUB_WORKSPACE"

          echo ""
          echo "KernelSU SUSFS patch applied."

      # ==========================================================
      # 9. APPLY GKI SUSFS PATCH
      # ==========================================================
      - name: Apply SUSFS GKI patch
        run: |
          set -eux

          echo "========================================"
          echo "APPLY SUSFS GKI PATCH"
          echo "========================================"

          cp \
            susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1_GKI.patch \
            .

          patch \
            -p1 \
            < 50_add_susfs_in_gki-android14-6.1_GKI.patch

          echo ""
          echo "SUSFS GKI patch applied."

      # ==========================================================
      # 10. VERIFY SUSFS
      # ==========================================================
      - name: Verify SUSFS integration
        run: |
          set -eux

          echo "========================================"
          echo "VERIFY SUSFS"
          echo "========================================"

          test -f fs/susfs.c
          test -f include/linux/susfs.h

          echo "fs/susfs.c:"
          ls -lh fs/susfs.c

          echo ""
          echo "include/linux/susfs.h:"
          ls -lh include/linux/susfs.h

          echo ""
          echo "Kconfig references:"
          grep -R \
            -n \
            "KSU_SUSFS" \
            KernelSU-Next/kernel \
            fs \
            include \
            2>/dev/null \
            | head -100 \
            || true

      # ==========================================================
      # 11. REMOVE GKI PROTECTED EXPORTS
      # ==========================================================
      - name: Remove protected exports
        run: |
          set -eux

          echo "========================================"
          echo "GKI PROTECTED EXPORTS"
          echo "========================================"

          rm -f \
            android/abi_gki_protected_exports_aarch64 \
            android/abi_gki_protected_exports_x86_64

          echo "Protected export files removed."

      # ==========================================================
      # 12. GKI DEFCONFIG
      # ==========================================================
      - name: Prepare GKI config
        run: |
          set -eux

          echo "========================================"
          echo "GKI CONFIG"
          echo "========================================"

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            gki_defconfig

      # ==========================================================
      # 13. ENABLE KSU + SUSFS
      # ==========================================================
      - name: Enable KernelSU and SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "ENABLE KSU + SUSFS"
          echo "========================================"

          chmod +x scripts/config || true

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_SUSFS \
            --enable CONFIG_KSU_SUSFS_SUS_MOUNT \
            --enable CONFIG_KSU_SUSFS_SUS_KSTAT \
            --enable CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
            --enable CONFIG_KSU_SUSFS_TRY_UMOUNT \
            --enable CONFIG_KSU_SUSFS_SPOOF_UNAME \
            --enable CONFIG_KSU_SUSFS_SUS_PATH \
            --enable CONFIG_KSU_SUSFS_ENABLE_LOG \
            --enable CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
            --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            --enable CONFIG_KPROBES \
            --enable CONFIG_KPROBE_EVENTS \
            --enable CONFIG_MODULES

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

      # ==========================================================
      # 14. VERIFY CONFIG
      # ==========================================================
      - name: Verify final config
        run: |
          set -eux

          echo "========================================"
          echo "FINAL CONFIG"
          echo "========================================"

          echo ""
          echo "KSU:"
          grep '^CONFIG_KSU=' out/.config

          echo ""
          echo "SUSFS:"
          grep '^CONFIG_KSU_SUSFS=' out/.config

          echo ""
          echo "SUSFS OPTIONS:"
          grep '^CONFIG_KSU_SUSFS_' out/.config || true

          echo ""
          echo "KPROBES:"
          grep '^CONFIG_KPROBES=' out/.config || true

      # ==========================================================
      # 15. COMPILER
      # ==========================================================
      - name: Show compiler
        run: |
          set -eux

          clang --version
          echo ""
          ld.lld --version

      # ==========================================================
      # 16. BUILD
      # ==========================================================
      - name: Build kernel
        run: |
          set -eux

          echo "========================================"
          echo "BUILD KERNEL"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image

      # ==========================================================
      # 17. VERIFY IMAGE
      # ==========================================================
      - name: Verify Image
        run: |
          set -eux

          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"

          IMAGE="out/arch/arm64/boot/Image"

          test -f "$IMAGE"

          echo ""
          echo "Image:"
          ls -lh "$IMAGE"

          echo ""
          echo "SHA256:"
          sha256sum "$IMAGE"

          echo ""
          echo "File:"
          file "$IMAGE"

      # ==========================================================
      # 18. REPORT
      # ==========================================================
      - name: Create report
        run: |
          set -eux

          mkdir -p report

          {
            echo "========================================"
            echo "PAD 7 GKI"
            echo "6.1.138"
            echo "KERNELSU NEXT"
            echo "SUSFS"
            echo "========================================"
            echo ""
            echo "SOURCE:"
            git rev-parse HEAD
            echo ""
            echo "KERNEL:"
            make -s kernelversion
            echo ""
            echo "KSU:"
            grep '^CONFIG_KSU=' out/.config || true
            echo ""
            echo "SUSFS:"
            grep '^CONFIG_KSU_SUSFS=' out/.config || true
            echo ""
            echo "IMAGE:"
            ls -lh out/arch/arm64/boot/Image
            echo ""
            echo "SHA256:"
            sha256sum out/arch/arm64/boot/Image
            echo ""
            echo "========================================"
            echo "BUILD SUCCESS"
            echo "========================================"
          } | tee report/FINAL-REPORT.txt

      # ==========================================================
      # 19. ARTIFACT
      # ==========================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pad7-gki-6.1.138-kernelsu-next-susfs
          path: |
            out/arch/arm64/boot/Image
            out/.config
            report/FINAL-REPORT.txt
