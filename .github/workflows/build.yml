name: Pad 7 - 6.1.138 KernelSU Next SUSFS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. ANDROID COMMON 6.1.138
      # ============================================================
      - name: Checkout Android Common 6.1.138
        uses: actions/checkout@v4
        with:
          repository: android/kernel_common
          ref: android14-6.1-2025-06
          fetch-depth: 1

      # ============================================================
      # 2. DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            cpio \
            curl \
            flex \
            git \
            lld \
            llvm \
            libelf-dev \
            libssl-dev \
            pahole \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd

      # ============================================================
      # 3. CHECK VERSION
      # ============================================================
      - name: Check kernel version
        run: |
          set -eux

          echo "========================================"
          echo "KERNEL VERSION"
          echo "========================================"

          VERSION="$(make -s kernelversion)"

          echo "Detected: $VERSION"

          if [ "$VERSION" != "6.1.138" ]; then
            echo ""
            echo "ERROR: WRONG KERNEL VERSION"
            echo "Expected: 6.1.138"
            echo "Detected: $VERSION"
            exit 1
          fi

          echo ""
          echo "6.1.138 OK"

      # ============================================================
      # 4. KERNELSU-NEXT + SUSFS
      # ============================================================
      - name: Install KernelSU Next SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "KERNELSU NEXT + SUSFS"
          echo "========================================"

          curl -LSs \
            "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" \
            | bash -s dev-susfs

          echo ""
          echo "Checking KernelSU..."

          test -d drivers/kernelsu

          echo ""
          echo "KernelSU directory:"
          ls -la drivers/kernelsu

          echo ""
          echo "Searching SUSFS..."

          grep -R \
            -n \
            "SUSFS" \
            drivers/kernelsu \
            2>/dev/null \
            | head -50 \
            || true

          echo ""
          echo "KernelSU-Next dev-susfs setup finished."

      # ============================================================
      # 5. PREPARE GKI CONFIG
      # ============================================================
      - name: Prepare GKI config
        run: |
          set -eux

          echo "========================================"
          echo "GKI CONFIG"
          echo "========================================"

          rm -rf out

          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            gki_defconfig

      # ============================================================
      # 6. ENABLE KSU
      # ============================================================
      - name: Enable KernelSU
        run: |
          set -eux

          echo "========================================"
          echo "KSU CONFIG"
          echo "========================================"

          chmod +x scripts/config || true

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo ""
          echo "CONFIG_KSU:"
          grep '^CONFIG_KSU=' out/.config

      # ============================================================
      # 7. VERIFY SUSFS/KSU
      # ============================================================
      - name: Verify KSU SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "VERIFY KSU + SUSFS"
          echo "========================================"

          echo ""
          echo "KernelSU config:"
          grep '^CONFIG_KSU=' out/.config

          echo ""
          echo "KernelSU source:"
          test -d drivers/kernelsu
          find drivers/kernelsu -maxdepth 2 -type f | head -100

          echo ""
          echo "SUSFS references:"
          grep -R \
            -n \
            "susfs" \
            drivers/kernelsu \
            2>/dev/null \
            | head -100 \
            || true

      # ============================================================
      # 8. COMPILER
      # ============================================================
      - name: Check compiler
        run: |
          set -eux

          echo "========================================"
          echo "COMPILER"
          echo "========================================"

          clang --version

          echo ""

          ld.lld --version

      # ============================================================
      # 9. BUILD
      # ============================================================
      - name: Build kernel
        run: |
          set -eux

          echo "========================================"
          echo "BUILD 6.1.138"
          echo "KERNELSU NEXT + SUSFS"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image

      # ============================================================
      # 10. VERIFY IMAGE
      # ============================================================
      - name: Verify Image
        run: |
          set -eux

          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"

          IMAGE="out/arch/arm64/boot/Image"

          test -f "$IMAGE"

          echo ""
          echo "Image:"
          ls -lh "$IMAGE"

          echo ""
          echo "SHA256:"
          sha256sum "$IMAGE"

          echo ""
          echo "File:"
          file "$IMAGE"

      # ============================================================
      # 11. REPORT
      # ============================================================
      - name: Create report
        run: |
          set -eux

          mkdir -p report

          {
            echo "========================================"
            echo "PAD 7 GKI KERNEL"
            echo "========================================"
            echo ""
            echo "KERNEL VERSION:"
            make -s kernelversion
            echo ""
            echo "SOURCE COMMIT:"
            git rev-parse HEAD
            echo ""
            echo "KSU:"
            grep '^CONFIG_KSU=' out/.config || true
            echo ""
            echo "IMAGE:"
            ls -lh out/arch/arm64/boot/Image
            echo ""
            echo "IMAGE SHA256:"
            sha256sum out/arch/arm64/boot/Image
            echo ""
            echo "========================================"
            echo "BUILD SUCCESS"
            echo "========================================"
          } | tee report/FINAL-REPORT.txt

      # ============================================================
      # 12. ARTIFACT
      # ============================================================
      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: pad7-6.1.138-ksu-next-susfs
          path: |
            out/arch/arm64/boot/Image
            out/.config
            report/FINAL-REPORT.txt
