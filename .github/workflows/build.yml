name: Step 7 - Prepare KernelSU SUSFS 6.1

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout GKI 6.1.138
        uses: actions/checkout@v4
        with:
          repository: android/kernel_common
          ref: android14-6.1.138_r00
          fetch-depth: 1

      - name: Show kernel version
        run: |
          set -e

          echo "========================================"
          echo "GKI SOURCE"
          echo "========================================"

          git rev-parse HEAD
          make -s kernelversion

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            flex \
            git \
            libdw-dev \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            pahole \
            python3 \
            rsync

      - name: Clone KernelSU
        run: |
          set -e

          git clone \
            --depth=1 \
            https://github.com/tiann/KernelSU.git \
            KernelSU

      - name: Clone SUSFS
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch gki-android14-6.1 \
            https://github.com/deepongi-labs/susfs4ksu.git \
            susfs

      - name: Verify SUSFS kernel patch
        run: |
          set -e

          echo "========================================"
          echo "SUSFS PATCH FILES"
          echo "========================================"

          find susfs/kernel_patches \
            -maxdepth 2 \
            -type f \
            | sort

          echo ""
          echo "6.1 kernel patch candidates:"

          find susfs/kernel_patches \
            -type f \
            -name '*6.1*.patch' \
            -print

          echo ""
          echo "KernelSU patch:"

          test -f \
            susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

      - name: Integrate KernelSU
        run: |
          set -e

          ./KernelSU/kernel/setup.sh

      - name: Apply SUSFS KernelSU patch
        run: |
          set -e

          cd KernelSU

          patch -p1 \
            < ../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

      - name: Install SUSFS kernel files
        run: |
          set -e

          cp -a \
            susfs/kernel_patches/fs/. \
            fs/

          cp -a \
            susfs/kernel_patches/include/linux/. \
            include/linux/

      - name: Apply SUSFS 6.1 kernel patch
        run: |
          set -e

          PATCH="$(find susfs/kernel_patches \
            -type f \
            -name '*6.1*.patch' \
            | head -n 1)"

          test -n "$PATCH"

          echo "Using:"
          echo "$PATCH"

          patch -p1 < "$PATCH"

      - name: Remove protected exports
        run: |
          set -e

          rm -f \
            android/abi_gki_protected_exports_aarch64 \
            android/abi_gki_protected_exports_x86_64

      - name: Verify SUSFS config
        run: |
          set -e

          echo "========================================"
          echo "VERIFY SUSFS"
          echo "========================================"

          test -d KernelSU
          test -f KernelSU/kernel/Kconfig

          grep -Rni \
            'CONFIG_KSU_SUSFS' \
            KernelSU/kernel/Kconfig \
            | head -20

          echo ""
          echo "SUSFS source integrated successfully."

      - name: Upload patched GKI source
        uses: actions/upload-artifact@v4
        with:
          name: gki-6.1.138-kernelsu-susfs-source
          path: |
            KernelSU/
            fs/
            include/linux/
            android/
