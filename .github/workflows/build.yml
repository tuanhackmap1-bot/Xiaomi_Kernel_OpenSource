name: Build Xiaomi Pad 7 Kernel

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-24.04

steps:
  - name: Checkout
    uses: actions/checkout@v4
    with:
      fetch-depth: 1

  - name: Install dependencies
    run: |
      sudo add-apt-repository universe
      sudo apt-get update
      sudo apt-get install -y \
        bc \
        bison \
        build-essential \
        ccache \
        flex \
        git \
        clang \
        llvm \
        lld-18 \
        libelf-dev \
        libssl-dev \
        zlib1g-dev \
        pkg-config \
        pahole \
        python3 \
        rsync \
        unzip \
        zip

      sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld

  - name: Check source
    run: |
      set -e

      echo "========================================"
      echo "  VERIFY XIAOMI PAD 7 KERNEL SOURCE"
      echo "========================================"

      echo "=== REMOTE ==="
      git remote -v

      echo "=== BRANCH ==="
      git branch --show-current

      echo "=== COMMIT ==="
      git rev-parse HEAD

      echo "=== KERNEL VERSION ==="
      make -s kernelversion

      echo "=== PAD 7 CONFIG ==="
      test -f arch/arm64/configs/vendor/uke_GKI.config
      echo "uke_GKI.config found"

      echo "========================================"

  - name: Build Xiaomi custom kernel - KernelSU + SUSFS
    run: |
      set -e

      export ARCH=arm64
      export SUBARCH=arm64
      export LLVM=1
      export LLVM_IAS=1

      echo "========================================"
      echo "  XIAOMI PAD 7 + KERNELSU + SUSFS"
      echo "========================================"

      echo "=== KERNEL VERSION ==="
      make -s kernelversion

      echo "=== CLEAN BUILD OUTPUT ==="
      rm -rf out
      mkdir -p out

      echo "========================================"
      echo "  STEP 1: INTEGRATE KERNELSU"
      echo "========================================"

      rm -rf KernelSU

      git clone --depth=1 \
        https://github.com/tiann/KernelSU.git KernelSU

      test -f KernelSU/kernel/setup.sh

      echo "=== RUN KERNELSU SETUP ==="
      bash KernelSU/kernel/setup.sh

      echo "=== CHECK KERNELSU ==="
      test -e drivers/kernelsu
      test -f drivers/Kconfig
      grep -q 'CONFIG_KSU' KernelSU/kernel/Kconfig

      echo "KernelSU integration OK"

      echo "========================================"
      echo "  STEP 2: CLONE SUSFS"
      echo "========================================"

      rm -rf susfs

      git clone --depth=1 \
        --branch gki-android14-6.1 \
        --filter=blob:none \
        https://github.com/deepongi-labs/susfs4ksu.git susfs

      test -d susfs/kernel_patches

      echo "=== SUSFS VERSION ==="
      cd susfs
      git log -1 --oneline
      cd ..

      echo "=== SUSFS PATCHES ==="
      find susfs/kernel_patches -type f -name '*.patch' -print

      echo "========================================"
      echo "  STEP 3: PREPARE SUSFS FILES"
      echo "========================================"

      cp -fv susfs/kernel_patches/fs/* fs/
      cp -fv susfs/kernel_patches/include/linux/* include/linux/

      test -f susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
      test -f susfs/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch

      echo "SUSFS files copied"

      echo "========================================"
      echo "  STEP 4: PATCH KERNELSU"
      echo "========================================"

      cd KernelSU

      patch --dry-run -p1 \
        < ../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

      patch -p1 \
        < ../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

      cd ..

      echo "KernelSU SUSFS patch applied"

      echo "========================================"
      echo "  STEP 5: TEST KERNEL SUSFS PATCH"
      echo "========================================"

      echo "=== TEST PATCH ==="

      if patch --dry-run -p1 \
        < susfs/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch
      then
        echo "SUSFS patch matches this kernel source"
      else
        echo "ERROR: SUSFS patch does NOT match this Xiaomi kernel"
        echo "STOP - DO NOT APPLY PATCH"
        exit 1
      fi

      echo "========================================"
      echo "  STEP 6: APPLY SUSFS PATCH"
      echo "========================================"

      patch -p1 \
        < susfs/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch

      echo "SUSFS kernel patch applied"

      echo "========================================"
      echo "  STEP 7: CONFIGURE KERNEL"
      echo "========================================"

      echo "=== GKI DEFCONFIG ==="

      make O=out ARCH=arm64 gki_defconfig </dev/null

      echo "=== APPLY XIAOMI PAD 7 CONFIG ==="

      scripts/kconfig/merge_config.sh \
        -m \
        out/.config \
        arch/arm64/configs/vendor/uke_GKI.config

      echo "=== ENABLE KERNELSU ==="

      scripts/config \
        --file out/.config \
        -e CONFIG_KSU

      echo "=== ENABLE SUSFS ==="

      scripts/config \
        --file out/.config \
        -e CONFIG_KSU_SUSFS

      echo "=== DISABLE KASAN ==="

      scripts/config --file out/.config -d CONFIG_KASAN
      scripts/config --file out/.config -d CONFIG_KASAN_GENERIC
      scripts/config --file out/.config -d CONFIG_KASAN_SW_TAGS
      scripts/config --file out/.config -d CONFIG_KASAN_HW_TAGS

      echo "=== DISABLE UBSAN ==="

      scripts/config --file out/.config -d CONFIG_UBSAN
      scripts/config --file out/.config -d CONFIG_UBSAN_TRAP
      scripts/config --file out/.config -d CONFIG_UBSAN_BOUNDS
      scripts/config --file out/.config -d CONFIG_UBSAN_LOCAL_BOUNDS
      scripts/config --file out/.config -d CONFIG_UBSAN_SHIFT
      scripts/config --file out/.config -d CONFIG_UBSAN_UNREACHABLE
      scripts/config --file out/.config -d CONFIG_UBSAN_BOOL
      scripts/config --file out/.config -d CONFIG_UBSAN_ENUM

      echo "========================================"
      echo "  STEP 8: FINALIZE CONFIG"
      echo "========================================"

      make O=out ARCH=arm64 olddefconfig </dev/null

      echo "=== CONFIG CHECK ==="

      grep -E \
        '^(CONFIG_KSU=|CONFIG_KSU_SUSFS=|CONFIG_MI_HARDWARE_ID=|CONFIG_MI_ENABLE_DP=|CONFIG_MIHW=|CONFIG_MI_WIRELESS=|CONFIG_MI_PEN_WIRELESS=)' \
        out/.config || true

      echo "=== CHECK AUTO CONFIG ==="
      test -f out/include/config/auto.conf

      echo "========================================"
      echo "  STEP 9: BUILD IMAGE"
      echo "========================================"

      make -j"$(nproc)" \
        O=out \
        ARCH=arm64 \
        LLVM=1 \
        LLVM_IAS=1 \
        Image

      echo "========================================"
      echo "  STEP 10: BUILD DTBS"
      echo "========================================"

      make -j"$(nproc)" \
        O=out \
        ARCH=arm64 \
        LLVM=1 \
        LLVM_IAS=1 \
        dtbs

      echo "========================================"
      echo "  BUILD SUCCESS"
      echo "========================================"

      ls -lh out/arch/arm64/boot/Image

  - name: Show output
    run: |
      echo "=== Kernel ==="
      ls -lh out/arch/arm64/boot/Image || true

      echo "=== DTBs ==="
      find out/arch/arm64/boot/dts \
        -type f \
        \( -name "*.dtb" -o -name "*.dtbo" \) \
        -print | head -50 || true

  - name: Upload kernel
    uses: actions/upload-artifact@v4
    with:
      name: xiaomi-pad7-kernel
      path: |
        out/arch/arm64/boot/Image
        out/arch/arm64/boot/Image.gz
        out/arch/arm64/boot/dts/**/*.dtb
        out/arch/arm64/boot/dts/**/*.dtbo
      if-no-files-found: warn
