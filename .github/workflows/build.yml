name: Analyze Stock Pad 7 boot.img

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-24.04

    steps:

      - name: Download stock boot.img
        run: |
          set -e

          wget -O boot.img \
            https://github.com/tuanhackmap1-bot/Xiaomi_Kernel_OpenSource/releases/download/boot-analysis/boot.img

          echo "Downloaded:"
          ls -lh boot.img

          echo "SHA256:"
          sha256sum boot.img

          echo "Expected:"
          echo "22f5e87ea6764e22bf191182d9dcffb0f423af53853e0f70dc0c278c94cb129a"

          test "$(sha256sum boot.img | awk '{print $1}')" = \
            "22f5e87ea6764e22bf191182d9dcffb0f423af53853e0f70dc0c278c94cb129a"

          echo "SHA256 OK"


      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            file \
            binwalk \
            xxd \
            strings \
            cpio \
            gzip \
            lz4 \
            xz-utils \
            zstd


      - name: Analyze boot.img
        run: |
          set -e

          mkdir -p analysis

          echo "========================================"
          echo "       PAD 7 STOCK BOOT ANALYSIS"
          echo "========================================"

          echo ""
          echo "=== FILE ==="
          file boot.img

          echo ""
          echo "=== SIZE ==="
          ls -lh boot.img

          echo ""
          echo "=== HEADER ==="
          xxd -l 256 boot.img

          echo ""
          echo "=== KERNEL STRINGS ==="

          strings -a boot.img |
            grep -Ei \
            'Linux version|6\.1\.138|android14|g0c3d559bcd85|ab14529422|clang|LLVM|Xiaomi|xiaomi|uke|kallsyms|BTF' \
            | head -300 \
            | tee analysis/kernel-strings.txt || true

          echo ""
          echo "=== ALL VERSION STRINGS ==="

          strings -a boot.img |
            grep -Ei 'Linux version|6\.1\.' |
            head -100 |
            tee analysis/version.txt || true

          echo ""
          echo "=== KALLSYMS ==="

          strings -a boot.img |
            grep -Ei 'kallsyms|kallsyms_lookup_name|kallsyms_on_each_symbol' |
            head -200 |
            tee analysis/kallsyms.txt || true

          echo ""
          echo "=== BTF ==="

          strings -a boot.img |
            grep -Ei 'BTF|BTF_MAGIC|__BTF' |
            head -200 |
            tee analysis/btf.txt || true

          echo ""
          echo "=== BINWALK ==="

          binwalk boot.img |
            tee analysis/binwalk.txt || true


      - name: Create final report
        run: |
          set -e

          {
            echo "========================================"
            echo "PAD 7 STOCK BOOT.IMG REPORT"
            echo "========================================"
            echo ""

            echo "SHA256:"
            sha256sum boot.img

            echo ""
            echo "FILE:"
            file boot.img

            echo ""
            echo "SIZE:"
            ls -lh boot.img

            echo ""
            echo "=== VERSION ==="
            cat analysis/version.txt || true

            echo ""
            echo "=== KERNEL STRINGS ==="
            cat analysis/kernel-strings.txt || true

            echo ""
            echo "=== KALLSYMS ==="
            cat analysis/kallsyms.txt || true

            echo ""
            echo "=== BTF ==="
            cat analysis/btf.txt || true

            echo ""
            echo "=== BINWALK ==="
            cat analysis/binwalk.txt || true

          } | tee analysis/FINAL-REPORT.txt


      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: pad7-stock-boot-analysis
          path: analysis/
