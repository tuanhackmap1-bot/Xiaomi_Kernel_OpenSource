name: Build Xiaomi Pad 7 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo add-apt-repository universe
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            lld-18 \
            libelf-dev \
            libssl-dev \
            pahole \
            python3 \
            rsync \
            unzip \
            zip
                            sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld
        
      - name: Check source
        run: |
          echo "Kernel source:"
          pwd
          echo "Branch:"
          git branch --show-current
          echo "Kernel version:"
          make kernelversion

      - name: Build Xiaomi custom kernel - KernelSU + SUSFS
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          echo "========================================"
          echo "  XIAOMI KERNEL + KERNELSU + SUSFS"
          echo "========================================"

          echo "=== CHECK KERNEL VERSION ==="
          make kernelversion

          KERNEL_VERSION="$(make -s kernelversion)"
          echo "Kernel version: ${KERNEL_VERSION}"

          echo "=== CLEAN BUILD OUTPUT ==="
          rm -rf out
          mkdir -p out

          echo "========================================"
          echo "  STEP 1: INTEGRATE KERNELSU"
          echo "========================================"

          rm -rf KernelSU

          git clone --depth=1 \
            https://github.com/tiann/KernelSU.git KernelSU

          test -f KernelSU/kernel/setup.sh

          echo "=== RUN KERNELSU SETUP ==="
          bash KernelSU/kernel/setup.sh

          echo "=== CHECK KERNELSU SETUP ==="
          echo "=== KERNELSU FILES ==="
          ls -la kernel 2>/dev/null || true
          ls -la KernelSU 2>/dev/null || true

          echo "=== CHECK KERNELSU LINK ==="
          if [ -e kernel ]; then
            echo "KernelSU kernel directory exists"
          else
            echo "KernelSU kernel directory was not created"
          fi

          echo "=== CHECK KERNEL CONFIG ==="
          if [ -f kernel/Kconfig ]; then
            echo "kernel/Kconfig found"
          elif [ -f KernelSU/kernel/Kconfig ]; then
            echo "KernelSU/kernel/Kconfig found"
          else
            echo "WARNING: KernelSU Kconfig location differs"
          fi

          echo "========================================"
          echo "  STEP 2: CLONE SUSFS"
          echo "========================================"

          rm -rf susfs

          echo "=== CLONE SUSFS ==="
          git clone --depth=1 \
            --branch gki-android14-6.1 \
            --filter=blob:none \
            https://github.com/deepongi-labs/susfs4ksu.git susfs

          echo "=== SUSFS CLONE DONE ==="
          test -d susfs

          echo "=== SUSFS VERSION ==="
          cd susfs
          git log -1 --oneline
          cd ..

          echo "========================================"
          echo "  STEP 3: PREPARE SUSFS FILES"
          echo "========================================"

          cp -fv \
            susfs/kernel_patches/fs/* \
            fs/

          cp -fv \
            susfs/kernel_patches/include/linux/* \
            include/linux/

          echo "========================================"
          

          echo "========================================"
          echo "  STEP 5: INSPECT SUSFS"
          echo "========================================"

          echo "=== KERNEL VERSION ==="
          make -s kernelversion

          echo "=== SUSFS DIRECTORY ==="
          ls -la susfs

          echo "=== KERNEL PATCHES ==="
          find susfs/kernel_patches -maxdepth 2 -type f -name '*.patch' -print

          echo "=== STEP 5 INSPECTION DONE ==="

          

          echo "========================================"
          echo "  STEP 6: CONFIGURE KERNEL"
          echo "========================================"

          echo "=== GKI DEFCONFIG ==="

          make O=out ARCH=arm64 gki_defconfig </dev/null

          echo "=== ENABLE KERNELSU ==="

          scripts/config \
            --file out/.config \
            -e CONFIG_KSU

          echo "=== ENABLE SUSFS ==="

          

          echo "=== DISABLE KASAN ==="

          scripts/config --file out/.config -d CONFIG_KASAN
          scripts/config --file out/.config -d CONFIG_KASAN_GENERIC
          scripts/config --file out/.config -d CONFIG_KASAN_SW_TAGS
          scripts/config --file out/.config -d CONFIG_KASAN_HW_TAGS

          echo "=== DISABLE UBSAN ==="

          scripts/config --file out/.config -d CONFIG_UBSAN
          scripts/config --file out/.config -d CONFIG_UBSAN_TRAP
          scripts/config --file out/.config -d CONFIG_UBSAN_BOUNDS
          scripts/config --file out/.config -d CONFIG_UBSAN_LOCAL_BOUNDS
          scripts/config --file out/.config -d CONFIG_UBSAN_SHIFT
          scripts/config --file out/.config -d CONFIG_UBSAN_UNREACHABLE
          scripts/config --file out/.config -d CONFIG_UBSAN_BOOL
          scripts/config --file out/.config -d CONFIG_UBSAN_ENUM

          echo "========================================"
          echo "  STEP 7: FINALIZE CONFIG"
          echo "========================================"

          make O=out ARCH=arm64 olddefconfig </dev/null

          echo "========================================"
          echo "  CONFIG CHECK"
          echo "========================================"

          grep -E \
            '^(CONFIG_KSU=|CONFIG_KSU_SUSFS=|CONFIG_CFI_CLANG=|CONFIG_SHADOW_CALL_STACK=|CONFIG_ARM64_PTR_AUTH=|CONFIG_ARM64_BTI=|CONFIG_ARM64_MTE=)' \
            out/.config || true

          echo "=== CHECK AUTO CONFIG ==="
          test -f out/include/config/auto.conf

          echo "=== CONFIG FINALIZED ==="
          echo "========================================"
          echo "  STEP 8: BUILD IMAGE"
          echo "========================================"

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            Image

          echo "========================================"
          echo "  STEP 9: BUILD DTBS"
          echo "========================================"

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            dtbs

          echo "========================================"
          echo "  BUILD SUCCESS"
          echo "========================================"

          ls -lh out/arch/arm64/boot/Image

      - name: Show output
        run: |
          echo "=== Kernel ==="
          ls -lh out/arch/arm64/boot/Image || true

          echo "=== DTBs ==="
          find out/arch/arm64/boot/dts -type f \
            \( -name "*.dtb" -o -name "*.dtbo" \) \
            -print | head -50 || true

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-pad7-kernel
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/**/*.dtb
            out/arch/arm64/boot/dts/**/*.dtbo
          if-no-files-found: warn
