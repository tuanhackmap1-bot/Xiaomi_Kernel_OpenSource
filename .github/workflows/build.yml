name: GKI 6.1.138 KSU Next SUSFS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Android Common 6.1.138
        uses: actions/checkout@v4
        with:
          repository: android/kernel_common
          ref: android14-6.1-2025-06
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential clang cpio curl flex git \
            lld llvm libelf-dev libssl-dev pahole python3 \
            rsync unzip wget xz-utils zstd

      - name: Verify kernel
        run: |
          set -eux
          echo "Kernel:"
          make -s kernelversion

          test "$(make -s kernelversion)" = "6.1.138"

      - name: Setup KernelSU Next SUSFS
        run: |
          set -eux

          curl -LSs \
            "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" \
            | bash -s dev-susfs

          test -d KernelSU-Next/kernel

      - name: Download SUSFS patches
        run: |
          set -eux

          git clone \
            --depth=1 \
            -b gki-android14-6.1 \
            https://github.com/deepongi-labs/susfs4ksu.git \
            susfs4ksu

          echo "SUSFS:"
          ls -la susfs4ksu/kernel_patches

      - name: Apply SUSFS
        run: |
          set -eux

          test -f \
            susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch

          test -f \
            susfs4ksu/kernel_patches/50_add_susfs_in_kernel-6.1.patch

          cp \
            susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch \
            KernelSU-Next/kernel/

          cp \
            susfs4ksu/kernel_patches/50_add_susfs_in_kernel-6.1.patch \
            ./

          cp \
            susfs4ksu/kernel_patches/fs/* \
            fs/

          cp \
            susfs4ksu/kernel_patches/include/linux/* \
            include/linux/

          cd KernelSU-Next/kernel

          patch -p1 \
            < 10_enable_susfs_for_ksu.patch

          cd ../..

          patch -p1 \
            < 50_add_susfs_in_kernel-6.1.patch

      - name: Verify SUSFS
        run: |
          set -eux

          echo "SUSFS files:"

          find fs include/linux \
            -type f \
            | grep -i susfs \
            | head -100

          echo ""
          echo "SUSFS Kconfig:"
          grep -R "KSU_SUSFS" \
            KernelSU-Next/kernel \
            fs \
            include/linux \
            2>/dev/null \
            | head -50

      - name: Prepare config
        run: |
          set -eux

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            gki_defconfig

      - name: Enable KSU SUSFS
        run: |
          set -eux

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_SUSFS \
            --enable CONFIG_KPROBES \
            --enable CONFIG_MODULES

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo ""
          grep '^CONFIG_KSU=' out/.config
          grep '^CONFIG_KSU_SUSFS=' out/.config
          grep '^CONFIG_KPROBES=' out/.config

      - name: Build
        run: |
          set -eux

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image

      - name: Verify
        run: |
          set -eux

          test -f out/arch/arm64/boot/Image

          echo "========================================"
          echo "SUCCESS"
          echo "========================================"

          make -s kernelversion

          grep '^CONFIG_KSU=' out/.config
          grep '^CONFIG_KSU_SUSFS=' out/.config

          ls -lh out/arch/arm64/boot/Image
          sha256sum out/arch/arm64/boot/Image

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gki-6.1.138-ksunext-susfs
          path: |
            out/arch/arm64/boot/Image
            out/.config
