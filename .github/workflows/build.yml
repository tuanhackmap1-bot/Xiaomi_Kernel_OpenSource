name: GKI 6.1.138 KernelSU Next SUSFS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout Android Common 6.1.138
        uses: actions/checkout@v4
        with:
          repository: android/kernel_common
          ref: android14-6.1-2025-06
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            cpio \
            curl \
            flex \
            git \
            lld \
            llvm \
            libelf-dev \
            libssl-dev \
            pahole \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd

      - name: Verify kernel
        run: |
          set -eux

          VERSION="$(make -s kernelversion)"

          echo "========================================"
          echo "KERNEL"
          echo "========================================"
          echo "Detected: $VERSION"

          test "$VERSION" = "6.1.138"

      # ------------------------------------------------------------
      # KernelSU Next
      # ------------------------------------------------------------

      - name: Install KernelSU Next
        run: |
          set -eux

          curl -LSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            | bash -s next

          test -d drivers/kernelsu

      # ------------------------------------------------------------
      # SUSFS
      # ------------------------------------------------------------

      - name: Clone SUSFS 6.1
        run: |
          set -eux

          rm -rf susfs

          git clone \
            --depth=1 \
            --branch gki-android14-6.1 \
            https://github.com/deepongi-labs/susfs4ksu.git \
            susfs

          echo "========================================"
          echo "SUSFS PATCHES"
          echo "========================================"

          find susfs/kernel_patches \
            -maxdepth 2 \
            -type f \
            | sort

      - name: Find correct SUSFS 6.1 patch
        run: |
          set -eux

          echo "========================================"
          echo "FIND 6.1 PATCH"
          echo "========================================"

          PATCH="$(find susfs/kernel_patches \
            -maxdepth 1 \
            -type f \
            -name '50_add_susfs_in_kernel-6.1*.patch' \
            | sort \
            | head -n 1)"

          if [ -z "$PATCH" ]; then
            echo ""
            echo "ERROR: NO SUSFS 6.1 PATCH FOUND"
            echo ""
            echo "Available patches:"
            find susfs/kernel_patches \
              -maxdepth 2 \
              -type f \
              | sort
            exit 1
          fi

          echo "FOUND:"
          echo "$PATCH"

          echo "SUSFS_PATCH=$GITHUB_WORKSPACE/$PATCH" >> "$GITHUB_ENV"

      - name: Apply SUSFS files
        run: |
          set -eux

          echo "========================================"
          echo "COPY SUSFS FILES"
          echo "========================================"

          cp -fv \
            susfs/kernel_patches/fs/* \
            fs/

          cp -fv \
            susfs/kernel_patches/include/linux/* \
            include/linux/

      - name: Apply SUSFS KernelSU patch
        run: |
          set -eux

          echo "========================================"
          echo "PATCH KERNELSU"
          echo "========================================"

          KSU_PATCH="susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          test -f "$KSU_PATCH"

          cd drivers/kernelsu

          patch -p1 < "$GITHUB_WORKSPACE/$KSU_PATCH"

      - name: Apply SUSFS kernel patch
        run: |
          set -eux

          echo "========================================"
          echo "PATCH KERNEL"
          echo "========================================"

          cd "$GITHUB_WORKSPACE"

          patch -p1 < "$SUSFS_PATCH"

      # ------------------------------------------------------------
      # Verify SUSFS was actually applied
      # ------------------------------------------------------------

      - name: Verify SUSFS integration
        run: |
          set -eux

          echo "========================================"
          echo "VERIFY SUSFS"
          echo "========================================"

          echo ""
          echo "SUSFS files:"

          find fs include/linux drivers/kernelsu \
            -type f \
            \( \
              -iname '*susfs*' \
              -o \
              -name 'susfs.c' \
            \) \
            -print \
            | sort

          echo ""
          echo "SUSFS Kconfig:"

          grep -R \
            -n \
            'CONFIG_KSU_SUSFS' \
            drivers/kernelsu \
            2>/dev/null \
            | head -50 \
            || true

      # ------------------------------------------------------------
      # GKI config
      # ------------------------------------------------------------

      - name: Create GKI config
        run: |
          set -eux

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            gki_defconfig

      - name: Enable KernelSU SUSFS
        run: |
          set -eux

          echo "========================================"
          echo "ENABLE KSU + SUSFS"
          echo "========================================"

          chmod +x scripts/config

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_SUSFS

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo ""
          echo "KSU:"
          grep '^CONFIG_KSU=' out/.config

          echo ""
          echo "SUSFS:"
          grep '^CONFIG_KSU_SUSFS=' out/.config

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Show compiler
        run: |
          set -eux

          clang --version
          ld.lld --version

      - name: Build Image
        run: |
          set -eux

          echo "========================================"
          echo "BUILD"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image

      - name: Verify build
        run: |
          set -eux

          IMAGE="out/arch/arm64/boot/Image"

          test -f "$IMAGE"

          echo "========================================"
          echo "SUCCESS"
          echo "========================================"

          ls -lh "$IMAGE"

          sha256sum "$IMAGE"

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: pad7-6.1.138-ksunext-susfs
          path: |
            out/arch/arm64/boot/Image
            out/.config
