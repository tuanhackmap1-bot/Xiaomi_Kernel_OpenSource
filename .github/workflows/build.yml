name: Pad 7 - GKI 6.1.138 - KernelSU Next - SUSFS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT ANDROID COMMON 6.1.138
      # ============================================================
      - name: Checkout Android Common 6.1.138
        uses: actions/checkout@v4
        with:
          repository: android/kernel_common
          ref: android14-6.1-2025-06
          fetch-depth: 1

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            cpio \
            flex \
            git \
            lld \
            llvm \
            libelf-dev \
            libssl-dev \
            pahole \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd

      # ============================================================
      # 3. VERIFY SOURCE
      # ============================================================
      - name: Verify kernel source
        run: |
          set -eux

          echo "========================================"
          echo "ANDROID COMMON"
          echo "========================================"

          git rev-parse HEAD

          echo ""
          echo "Branch:"
          git branch --show-current || true

          echo ""
          echo "Kernel version:"
          make -s kernelversion || true

          echo ""
          echo "Makefile:"
          grep -E \
            '^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION' \
            Makefile

      # ============================================================
      # 4. VERIFY 6.1.138
      # ============================================================
      - name: Verify kernel 6.1.138
        run: |
          set -eux

          VERSION="$(make -s kernelversion)"

          echo "Detected kernel: $VERSION"

          if [ "$VERSION" != "6.1.138" ]; then
            echo ""
            echo "ERROR: Wrong kernel version."
            echo "Expected: 6.1.138"
            echo "Detected: $VERSION"
            exit 1
          fi

          echo "Kernel 6.1.138 confirmed."

      # ============================================================
      # 5. SETUP KERNELSU-NEXT
      # ============================================================
      - name: Setup KernelSU Next
        run: |
          set -eux

          echo "========================================"
          echo "KERNELSU NEXT"
          echo "========================================"

          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s next

          test -d drivers/kernelsu

          echo ""
          echo "KernelSU directory:"
          ls -la drivers/kernelsu

      # ============================================================
      # 6. SETUP SUSFS
      # ============================================================
      - name: Setup SUSFS KernelSU Next
        run: |
          set -eux

          echo "========================================"
          echo "SUSFS"
          echo "========================================"

          curl -LSs \
            "https://raw.githubusercontent.com/pershoot/KernelSU-Next/next-susfs/kernel/setup.sh" \
            | bash -s next-susfs

          echo ""
          echo "KernelSU directory:"
          test -d drivers/kernelsu

          echo ""
          echo "SUSFS source check:"
          find . \
            \( -name '*susfs*' -o -name 'susfs.c' \) \
            -print \
            | head -100

      # ============================================================
      # 7. PREPARE GKI CONFIG
      # ============================================================
      - name: Prepare GKI configuration
        run: |
          set -eux

          echo "========================================"
          echo "GKI CONFIG"
          echo "========================================"

          rm -rf out
          mkdir -p out

          if [ -f build.config.gki.aarch64 ]; then
            echo "Using build.config.gki.aarch64"
          elif [ -f build.config.gki_kprobes ]; then
            echo "Using build.config.gki_kprobes"
          else
            echo "No GKI config file found."
            exit 1
          fi

      # ============================================================
      # 8. CREATE BASE CONFIG
      # ============================================================
      - name: Create base config
        run: |
          set -eux

          echo "========================================"
          echo "BASE CONFIG"
          echo "========================================"

          make \
            O=out \
            ARCH=arm64 \
            gki_defconfig

      # ============================================================
      # 9. ENABLE KSU + KPROBE + MODULES
      # ============================================================
      - name: Enable KernelSU configuration
        run: |
          set -eux

          echo "========================================"
          echo "KSU CONFIG"
          echo "========================================"

          if [ ! -x scripts/config ]; then
            echo "scripts/config not executable."
            chmod +x scripts/config || true
          fi

          scripts/config \
            --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_KPROBES \
            --enable CONFIG_KPROBE_EVENTS \
            --enable CONFIG_KSU_KPROBE_HOOKS \
            --enable CONFIG_MODULES

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo ""
          echo "KSU:"
          grep '^CONFIG_KSU=' out/.config

          echo ""
          echo "KPROBES:"
          grep '^CONFIG_KPROBES=' out/.config

          echo ""
          echo "MODULES:"
          grep '^CONFIG_MODULES=' out/.config

      # ============================================================
      # 10. VERIFY SUSFS
      # ============================================================
      - name: Verify SUSFS integration
        run: |
          set -eux

          echo "========================================"
          echo "VERIFY SUSFS"
          echo "========================================"

          FOUND=0

          if find fs include kernel drivers -type f \
            \( -name 'susfs.c' -o -name '*susfs*.h' \) \
            2>/dev/null | grep -q .; then
            FOUND=1
          fi

          if [ "$FOUND" -eq 0 ]; then
            echo "ERROR: SUSFS source was not found."
            exit 1
          fi

          echo "SUSFS source detected."

      # ============================================================
      # 11. LLVM
      # ============================================================
      - name: Show compiler
        run: |
          set -eux

          echo "========================================"
          echo "LLVM"
          echo "========================================"

          clang --version
          echo ""
          ld.lld --version

      # ============================================================
      # 12. BUILD
      # ============================================================
      - name: Build GKI kernel
        run: |
          set -eux

          echo "========================================"
          echo "BUILD 6.1.138"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image

      # ============================================================
      # 13. VERIFY IMAGE
      # ============================================================
      - name: Verify Image
        run: |
          set -eux

          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"

          IMAGE="out/arch/arm64/boot/Image"

          if [ ! -f "$IMAGE" ]; then
            echo "ERROR: Image not found."
            exit 1
          fi

          echo ""
          echo "Image:"
          ls -lh "$IMAGE"

          echo ""
          echo "SHA256:"
          sha256sum "$IMAGE"

          echo ""
          echo "File:"
          file "$IMAGE"

      # ============================================================
      # 14. REPORT
      # ============================================================
      - name: Create final report
        run: |
          set -eux

          mkdir -p report

          {
            echo "========================================"
            echo "GKI 6.1.138"
            echo "KERNELSU NEXT"
            echo "SUSFS"
            echo "========================================"
            echo ""
            echo "SOURCE COMMIT:"
            git rev-parse HEAD
            echo ""
            echo "KERNEL VERSION:"
            make -s kernelversion
            echo ""
            echo "KSU:"
            grep '^CONFIG_KSU=' out/.config || true
            echo ""
            echo "KPROBES:"
            grep '^CONFIG_KPROBES=' out/.config || true
            echo ""
            echo "MODULES:"
            grep '^CONFIG_MODULES=' out/.config || true
            echo ""
            echo "IMAGE:"
            ls -lh out/arch/arm64/boot/Image
            echo ""
            echo "IMAGE SHA256:"
            sha256sum out/arch/arm64/boot/Image
            echo ""
            echo "========================================"
            echo "BUILD COMPLETE"
            echo "========================================"
          } | tee report/FINAL-REPORT.txt

      # ============================================================
      # 15. UPLOAD
      # ============================================================
      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: pad7-gki-6.1.138-kernelsu-next-susfs
          path: |
            out/arch/arm64/boot/Image
            out/.config
            report/FINAL-REPORT.txt
