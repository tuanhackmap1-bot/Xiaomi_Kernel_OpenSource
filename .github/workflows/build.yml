name: Pad 7 - Stock Kernel + KernelSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Xiaomi UKE source
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: 5712080a4b0c0b1a879e6d145c601c649ddaddfd
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            ccache \
            flex \
            git \
            lld \
            llvm \
            libelf-dev \
            libssl-dev \
            pahole \
            pkg-config \
            python3 \
            rsync \
            unzip \
            zip \
            cpio \
            wget \
            xz-utils \
            zstd

      - name: Show Xiaomi source
        run: |
          set -e

          echo "========================================"
          echo "XIAOMI PAD 7 KERNEL"
          echo "========================================"

          echo "Commit:"
          git rev-parse HEAD

          echo ""
          echo "Kernel version:"
          make -s kernelversion

          echo ""
          echo "Makefile:"
          grep -E \
            '^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION' \
            Makefile

      - name: Check HWID source
        run: |
          set -e

          echo "========================================"
          echo "CHECK HWID SOURCE"
          echo "========================================"

          if [ -d drivers/misc/hwid ]; then
            echo "HWID source FOUND"
            find drivers/misc/hwid -maxdepth 2 -type f -print
          else
            echo "WARNING: drivers/misc/hwid is missing"
          fi

          echo ""
          echo "Kconfig reference:"
          grep -n \
            'drivers/misc/hwid/Kconfig' \
            drivers/misc/Kconfig \
            || true

      - name: Download stock boot.img
        run: |
          set -e

          wget -q --show-progress \
            -O boot.img \
            "https://github.com/tuanhackmap1-bot/Xiaomi_Kernel_OpenSource/releases/download/boot-analysis/boot.img"

          echo ""
          echo "boot.img:"
          ls -lh boot.img

          echo ""
          echo "SHA256:"
          sha256sum boot.img

      - name: Extract stock kernel
        run: |
          set -e

          rm -rf stock
          mkdir -p stock

          dd \
            if=boot.img \
            of=stock/kernel \
            bs=4096 \
            skip=1 \
            count=8645 \
            status=progress

          echo ""
          echo "Stock kernel:"
          ls -lh stock/kernel

          echo ""
          file stock/kernel

      - name: Extract stock config
        run: |
          set -e

          wget -q \
            -O extract-ikconfig \
            "https://raw.githubusercontent.com/torvalds/linux/master/scripts/extract-ikconfig"

          chmod +x extract-ikconfig

          ./extract-ikconfig \
            stock/kernel \
            > stock.config \
            2>stock-config-error.txt \
            || true

          echo ""
          echo "Stock config size:"
          wc -c stock.config

          echo ""
          echo "Stock config lines:"
          wc -l stock.config

          if [ ! -s stock.config ]; then
            echo ""
            echo "ERROR: Cannot extract stock config."
            cat stock-config-error.txt || true
            exit 1
          fi

      - name: Prepare build directory
        run: |
          set -e

          rm -rf out
          mkdir -p out

          cp stock.config out/.config

      - name: Setup KernelSU-Next
        run: |
          set -e

          echo "========================================"
          echo "KERNELSU-NEXT"
          echo "========================================"

          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s v3.3.0

          echo ""
          echo "KernelSU-Next directory:"

          test -d drivers/kernelsu
          test -f drivers/kernelsu/Kconfig

          ls -la drivers/kernelsu

      - name: Run olddefconfig non-interactively
        run: |
          set -e

          echo "========================================"
          echo "OLDDEFCONFIG"
          echo "========================================"

          yes "" | make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo ""
          echo "olddefconfig completed."

      - name: Verify KernelSU configuration
        run: |
          set -e

          echo "========================================"
          echo "KERNELSU CONFIGURATION"
          echo "========================================"

          echo "CONFIG_KSU:"
          grep '^CONFIG_KSU=' out/.config || true

          echo ""
          echo "KernelSU related options:"
          grep -E \
            '^CONFIG_KSU' \
            out/.config \
            || true

      - name: Prepare compiler
        run: |
          set -e

          echo "========================================"
          echo "LLVM"
          echo "========================================"

          clang --version

          echo ""
          ld.lld --version

      - name: Build kernel
        run: |
          set -e

          echo "========================================"
          echo "BUILD KERNEL"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image

      - name: Verify Image
        run: |
          set -e

          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"

          IMAGE="out/arch/arm64/boot/Image"

          if [ ! -f "$IMAGE" ]; then
            echo "ERROR: Image was not produced."
            exit 1
          fi

          echo "Image:"
          ls -lh "$IMAGE"

          echo ""
          echo "SHA256:"
          sha256sum "$IMAGE"

          echo ""
          echo "File:"
          file "$IMAGE"

      - name: Create final report
        run: |
          set -e

          mkdir -p report

          {
            echo "========================================"
            echo "PAD 7 KERNELSU-NEXT BUILD"
            echo "========================================"

            echo ""
            echo "SOURCE COMMIT:"
            git rev-parse HEAD

            echo ""
            echo "KERNEL VERSION:"
            make -s kernelversion

            echo ""
            echo "KERNELSU:"
            grep '^CONFIG_KSU=' out/.config || true

            echo ""
            echo "STOCK CONFIG SHA256:"
            sha256sum stock.config

            echo ""
            echo "FINAL CONFIG SHA256:"
            sha256sum out/.config

            echo ""
            echo "IMAGE:"
            ls -lh out/arch/arm64/boot/Image

            echo ""
            echo "IMAGE SHA256:"
            sha256sum out/arch/arm64/boot/Image

            echo ""
            echo "========================================"
            echo "BUILD COMPLETE"
            echo "========================================"

          } | tee report/FINAL-REPORT.txt

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: pad7-kernelsu-next
          path: |
            out/arch/arm64/boot/Image
            out/.config
            stock.config
            report/FINAL-REPORT.txt
